<svg xmlns="http://www.w3.org/2000/svg" width="900" height="420" viewBox="0 0 900 420" role="img" aria-labelledby="title desc">
  <title id="title">Head and shoulders example</title>
  <desc id="desc">A sample head and shoulders chart pattern with left shoulder, head, right shoulder, and neckline.</desc>
  <rect width="900" height="420" fill="#f7f2e8"/>
  <rect x="72" y="58" width="760" height="282" fill="#fffdf7" stroke="#d8cdbb" stroke-width="2"/>
  <g stroke="#eadfcd" stroke-width="1">
    <line x1="72" y1="105" x2="832" y2="105"/>
    <line x1="72" y1="152" x2="832" y2="152"/>
    <line x1="72" y1="199" x2="832" y2="199"/>
    <line x1="72" y1="246" x2="832" y2="246"/>
    <line x1="72" y1="293" x2="832" y2="293"/>
  </g>
  <line x1="250" y1="232" x2="690" y2="244" stroke="#207868" stroke-width="5" stroke-dasharray="12 8"/>
  <polyline points="96,295 152,250 214,188 274,138 338,230 404,148 462,78 526,152 588,236 650,150 716,210 782,255 824,300"
    fill="none" stroke="#243b53" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
  <g fill="#d85140">
    <circle cx="274" cy="138" r="10"/>
    <circle cx="462" cy="78" r="10"/>
    <circle cx="650" cy="150" r="10"/>
  </g>
  <g font-family="Arial, sans-serif" font-size="24" font-weight="700" fill="#9a342b">
    <text x="190" y="122">Left shoulder</text>
    <text x="426" y="54">Head</text>
    <text x="626" y="126">Right shoulder</text>
  </g>
  <text x="392" y="271" font-family="Arial, sans-serif" font-size="25" font-weight="700" fill="#196657">Neckline</text>
  <text x="78" y="382" font-family="Arial, sans-serif" font-size="20" fill="#4f5b66">Head and shoulders: a higher middle peak with two smaller peaks nearby.</text>
</svg>
