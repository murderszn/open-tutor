<svg xmlns="http://www.w3.org/2000/svg" width="900" height="420" viewBox="0 0 900 420" role="img" aria-labelledby="title desc">
  <title id="title">Candlestick anatomy example</title>
  <desc id="desc">Two candlesticks showing open, close, high, low, body, and wick.</desc>
  <rect width="900" height="420" fill="#f7f2e8"/>
  <rect x="70" y="54" width="760" height="292" fill="#fffdf7" stroke="#d8cdbb" stroke-width="2"/>
  <g stroke="#eadfcd" stroke-width="1">
    <line x1="70" y1="100" x2="830" y2="100"/>
    <line x1="70" y1="146" x2="830" y2="146"/>
    <line x1="70" y1="192" x2="830" y2="192"/>
    <line x1="70" y1="238" x2="830" y2="238"/>
    <line x1="70" y1="284" x2="830" y2="284"/>
  </g>

  <g font-family="Arial, sans-serif">
    <line x1="240" y1="88" x2="240" y2="296" stroke="#207868" stroke-width="8" stroke-linecap="round"/>
    <rect x="198" y="142" width="84" height="102" fill="#207868" stroke="#15594c" stroke-width="4"/>
    <text x="172" y="74" fill="#196657" font-size="25" font-weight="700">Green candle</text>
    <text x="122" y="121" fill="#4f5b66" font-size="19">High</text>
    <line x1="170" y1="96" x2="232" y2="96" stroke="#4f5b66" stroke-width="2"/>
    <text x="300" y="162" fill="#4f5b66" font-size="19">Close</text>
    <line x1="286" y1="146" x2="360" y2="146" stroke="#4f5b66" stroke-width="2"/>
    <text x="300" y="245" fill="#4f5b66" font-size="19">Open</text>
    <line x1="286" y1="244" x2="360" y2="244" stroke="#4f5b66" stroke-width="2"/>
    <text x="128" y="306" fill="#4f5b66" font-size="19">Low</text>
    <line x1="170" y1="296" x2="232" y2="296" stroke="#4f5b66" stroke-width="2"/>
    <text x="184" y="334" fill="#196657" font-size="20" font-weight="700">Close above open = price rose</text>

    <line x1="620" y1="88" x2="620" y2="296" stroke="#d85140" stroke-width="8" stroke-linecap="round"/>
    <rect x="578" y="142" width="84" height="102" fill="#d85140" stroke="#9a342b" stroke-width="4"/>
    <text x="558" y="74" fill="#9a342b" font-size="25" font-weight="700">Red candle</text>
    <text x="684" y="162" fill="#4f5b66" font-size="19">Open</text>
    <line x1="666" y1="146" x2="742" y2="146" stroke="#4f5b66" stroke-width="2"/>
    <text x="684" y="245" fill="#4f5b66" font-size="19">Close</text>
    <line x1="666" y1="244" x2="742" y2="244" stroke="#4f5b66" stroke-width="2"/>
    <text x="542" y="334" fill="#9a342b" font-size="20" font-weight="700">Close below open = price fell</text>

    <text x="88" y="382" fill="#4f5b66" font-size="20">Wicks show the high and low. The body shows the open and close.</text>
  </g>
</svg>
