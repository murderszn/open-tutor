<svg xmlns="http://www.w3.org/2000/svg" width="900" height="420" viewBox="0 0 900 420" role="img" aria-labelledby="title desc">
  <title id="title">Support and resistance example</title>
  <desc id="desc">A sample price line bouncing between a lower support range and an upper resistance range.</desc>
  <rect width="900" height="420" fill="#f7f2e8"/>
  <rect x="72" y="58" width="760" height="282" fill="#fffdf7" stroke="#d8cdbb" stroke-width="2"/>
  <g stroke="#eadfcd" stroke-width="1">
    <line x1="72" y1="105" x2="832" y2="105"/>
    <line x1="72" y1="152" x2="832" y2="152"/>
    <line x1="72" y1="199" x2="832" y2="199"/>
    <line x1="72" y1="246" x2="832" y2="246"/>
    <line x1="72" y1="293" x2="832" y2="293"/>
  </g>
  <rect x="72" y="88" width="760" height="36" fill="#d85140" opacity="0.16"/>
  <rect x="72" y="274" width="760" height="36" fill="#207868" opacity="0.18"/>
  <line x1="72" y1="106" x2="832" y2="106" stroke="#b33d31" stroke-width="4" stroke-dasharray="10 8"/>
  <line x1="72" y1="292" x2="832" y2="292" stroke="#207868" stroke-width="4" stroke-dasharray="10 8"/>
  <polyline points="92,280 155,236 218,124 286,108 352,162 420,286 486,270 552,148 622,102 690,137 756,289 812,252"
    fill="none" stroke="#243b53" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
  <g font-family="Arial, sans-serif" font-size="28" font-weight="700">
    <text x="92" y="85" fill="#9a342b">Resistance range</text>
    <text x="92" y="335" fill="#196657">Support range</text>
  </g>
  <g font-family="Arial, sans-serif" font-size="20" fill="#4f5b66">
    <text x="78" y="382">Price keeps reacting near the same zones. Use ranges, not perfect single lines.</text>
  </g>
</svg>
