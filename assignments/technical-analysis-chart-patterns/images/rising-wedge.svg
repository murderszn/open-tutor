<svg xmlns="http://www.w3.org/2000/svg" width="900" height="420" viewBox="0 0 900 420" role="img" aria-labelledby="title desc">
  <title id="title">Rising wedge example</title>
  <desc id="desc">A sample rising wedge chart pattern with higher highs and higher lows squeezing together.</desc>
  <rect width="900" height="420" fill="#f7f2e8"/>
  <rect x="72" y="58" width="760" height="282" fill="#fffdf7" stroke="#d8cdbb" stroke-width="2"/>
  <g stroke="#eadfcd" stroke-width="1">
    <line x1="72" y1="105" x2="832" y2="105"/>
    <line x1="72" y1="152" x2="832" y2="152"/>
    <line x1="72" y1="199" x2="832" y2="199"/>
    <line x1="72" y1="246" x2="832" y2="246"/>
    <line x1="72" y1="293" x2="832" y2="293"/>
  </g>
  <line x1="130" y1="108" x2="760" y2="76" stroke="#b33d31" stroke-width="5" stroke-dasharray="12 8"/>
  <line x1="130" y1="300" x2="760" y2="152" stroke="#207868" stroke-width="5" stroke-dasharray="12 8"/>
  <polyline points="120,300 190,222 254,276 328,188 394,236 472,152 540,194 620,112 690,144 760,86"
    fill="none" stroke="#243b53" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
  <g font-family="Arial, sans-serif" font-size="25" font-weight="700">
    <text x="142" y="95" fill="#9a342b">Upper trendline</text>
    <text x="520" y="247" fill="#196657">Lower trendline</text>
  </g>
  <text x="78" y="382" font-family="Arial, sans-serif" font-size="20" fill="#4f5b66">Rising wedge: price still rises, but the range gets tighter as momentum slows.</text>
</svg>
