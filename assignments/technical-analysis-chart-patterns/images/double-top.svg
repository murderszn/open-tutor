<svg xmlns="http://www.w3.org/2000/svg" width="900" height="420" viewBox="0 0 900 420" role="img" aria-labelledby="title desc">
  <title id="title">Double top example</title>
  <desc id="desc">A sample M-shaped double top chart pattern with two peaks and a neckline.</desc>
  <rect width="900" height="420" fill="#f7f2e8"/>
  <rect x="72" y="58" width="760" height="282" fill="#fffdf7" stroke="#d8cdbb" stroke-width="2"/>
  <g stroke="#eadfcd" stroke-width="1">
    <line x1="72" y1="105" x2="832" y2="105"/>
    <line x1="72" y1="152" x2="832" y2="152"/>
    <line x1="72" y1="199" x2="832" y2="199"/>
    <line x1="72" y1="246" x2="832" y2="246"/>
    <line x1="72" y1="293" x2="832" y2="293"/>
  </g>
  <line x1="318" y1="225" x2="722" y2="225" stroke="#207868" stroke-width="5" stroke-dasharray="12 8"/>
  <line x1="252" y1="108" x2="622" y2="108" stroke="#b33d31" stroke-width="5" stroke-dasharray="12 8"/>
  <polyline points="96,285 152,244 214,174 270,104 338,225 406,178 474,118 542,104 610,160 676,226 746,274 812,302"
    fill="none" stroke="#243b53" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
  <g fill="#d85140">
    <circle cx="270" cy="104" r="10"/>
    <circle cx="542" cy="104" r="10"/>
  </g>
  <circle cx="338" cy="225" r="10" fill="#207868"/>
  <g font-family="Arial, sans-serif" font-size="25" font-weight="700">
    <text x="222" y="82" fill="#9a342b">Top 1</text>
    <text x="558" y="82" fill="#9a342b">Top 2</text>
    <text x="350" y="252" fill="#196657">Neckline</text>
  </g>
  <text x="78" y="382" font-family="Arial, sans-serif" font-size="20" fill="#4f5b66">Double top: price tests resistance twice and then traders watch the neckline.</text>
</svg>
