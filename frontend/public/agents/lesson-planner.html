<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>LessonPlanner — schedule.csv generator</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;600;800&family=Instrument+Serif&display=swap" rel="stylesheet">
<style>
:root { --brand: #b2f522; --cobalt: #2146e0; --ink: #090d18; --paper: #ffffff; --card-border: rgba(9,13,24,0.18); }
* { box-sizing: border-box; }
body { font-family: 'Geist', ui-sans-serif, system-ui, sans-serif; background: var(--paper); color: var(--ink); max-width: 900px; margin: 2rem auto; padding: 0 1rem; line-height: 1.6; }
h1, h2, h3 { font-family: 'Instrument Serif', Georgia, serif; font-weight: normal; letter-spacing: -0.01em; color: var(--ink); }
h1 { font-size: 2.25rem; margin: 0.5rem 0 1rem; }
a { color: var(--cobalt); text-decoration: none; }
a:hover { text-decoration: underline; }
.back-link { display: inline-flex; align-items: center; min-height: 44px; font-weight: 600; }
.card { background: #fff; border: 1px solid var(--card-border); border-radius: 10px; padding: 1.5rem; margin-bottom: 1.5rem; }
input { font-family: inherit; font-size: 14px; color: var(--ink); background: #fff; border: 1px solid var(--card-border); border-radius: 8px; padding: 8px 12px; min-height: 44px; }
input:focus { outline: 2px solid var(--cobalt); border-color: var(--cobalt); }
label { font-weight: 600; font-size: 14px; display: inline-flex; align-items: center; gap: 8px; margin-right: 12px; margin-bottom: 8px; }
button { background: var(--cobalt); color: #fff; border: none; border-radius: 8px; padding: 10px 18px; font-weight: 600; cursor: pointer; min-height: 44px; font-family: inherit; font-size: 14px; }
button:hover { filter: brightness(0.92); }
button.secondary { background: #fff; color: var(--ink); border: 1px solid var(--card-border); }
button.secondary:hover { background: var(--paper); }
table { border-collapse: collapse; width: 100%; margin-top: 1rem; background: #fff; border: 1px solid var(--card-border); border-radius: 10px; overflow: hidden; }
th { background: var(--ink); color: #fff; font-weight: 600; text-align: left; padding: 10px 14px; font-size: 12px; text-transform: uppercase; letter-spacing: 0.05em; border: none; }
td { border-bottom: 1px solid var(--card-border); padding: 10px 14px; color: var(--ink); font-size: 14px; border-top: none; border-left: none; border-right: none; }
</style>
</head>
<body>
<a href="index.html" class="back-link">&larr; Cockpit</a>
<div class="card">
  <h1>LessonPlanner</h1>
  <div style="display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin-bottom:12px">
    <label>Topic <input id="topic" value="Fractions"></label>
    <label>Grade <input id="grade" value="4th" size="6"></label>
    <button id="go">Generate week</button>
    <button id="csv" class="secondary">Download schedule.csv</button>
  </div>
  <table id="t"><tr><th>Week</th><th>Day</th><th>Study Area</th><th>Task</th><th>Status</th></tr></table>
</div>
<script type="module">
import { runAgent } from '../../lib/agentClient.js'; let rows=[];
go.onclick = async () => { rows = await runAgent('LessonPlanner', { topic: topic.value, grade: grade.value });
  document.querySelectorAll('#t tr:not(:first-child)').forEach(r=>r.remove());
  for (const r of rows) { const tr=document.createElement('tr'); [r.week,r.day,r.studyArea,r.task,r.status].forEach(c=>{const td=document.createElement('td');td.textContent=c;tr.appendChild(td);}); t.appendChild(tr); } };
csv.onclick = () => { const head='Week,Study Area,Task,Status'; const lines=rows.map(r=>`"${r.week}","${r.studyArea}","${r.day}: ${r.task.replace(/"/g,'')}","${r.status}"`);
  const blob=new Blob([[head,...lines].join('\n')],{type:'text/csv'}); const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download='schedule.csv'; a.click(); };
</script>
</body></html>
