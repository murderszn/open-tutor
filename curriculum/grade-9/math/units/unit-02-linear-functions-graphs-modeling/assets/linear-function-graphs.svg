<svg xmlns="http://www.w3.org/2000/svg" width="560" height="650" viewBox="0 0 560 650" role="img" aria-labelledby="svgTitle svgDesc">
  <title id="svgTitle">Two graphed linear functions: y = 2x + 1 and y = −x + 4</title>
  <desc id="svgDesc">Coordinate grid with x from −3 to 5 and y from −4 to 6. Blue line y = 2x + 1 passes through (−2.5, −4) and (2.5, 6); its y-intercept is (0, 1), its x-intercept is (−0.5, 0), and a slope triangle between (−2, −3) and (−1, −1) shows rise 2 and run 1, so slope m = 2. Red line y = −x + 4 passes through (−2, 6) and (5, −1); its y-intercept is (0, 4) and its x-intercept is (4, 0). The two lines intersect at (1, 3): both equations are true there.</desc>
  <style>
    .grid { stroke: #e3e3e3; stroke-width: 1; }
    .axis { stroke: #333; stroke-width: 2; }
    .tick { stroke: #333; stroke-width: 1.5; }
    .lbl { font: 12px sans-serif; fill: #333; }
    .note { font: 13px sans-serif; fill: #333; }
    .lineA { stroke: #1a6bc4; stroke-width: 3; fill: none; }
    .lineB { stroke: #c0392b; stroke-width: 3; fill: none; }
    .tri { stroke: #666; stroke-width: 2; stroke-dasharray: 6 4; fill: none; }
    .lblA { font: 14px sans-serif; fill: #1a6bc4; font-weight: bold; }
    .lblB { font: 14px sans-serif; fill: #c0392b; font-weight: bold; }
    .dot { fill: white; stroke-width: 3; }
    .dotA { stroke: #1a6bc4; }
    .dotB { stroke: #c0392b; }
    .dotI { fill: #111; stroke: #111; }
  </style>

  <!-- grid -->
  <g>
    <line class="grid" x1="75"  y1="50" x2="75"  y2="600"/>
    <line class="grid" x1="130" y1="50" x2="130" y2="600"/>
    <line class="grid" x1="185" y1="50" x2="185" y2="600"/>
    <line class="grid" x1="240" y1="50" x2="240" y2="600"/>
    <line class="grid" x1="295" y1="50" x2="295" y2="600"/>
    <line class="grid" x1="350" y1="50" x2="350" y2="600"/>
    <line class="grid" x1="405" y1="50" x2="405" y2="600"/>
    <line class="grid" x1="460" y1="50" x2="460" y2="600"/>
    <line class="grid" x1="515" y1="50" x2="515" y2="600"/>
    <line class="grid" x1="60" y1="600" x2="530" y2="600"/>
    <line class="grid" x1="60" y1="545" x2="530" y2="545"/>
    <line class="grid" x1="60" y1="490" x2="530" y2="490"/>
    <line class="grid" x1="60" y1="435" x2="530" y2="435"/>
    <line class="grid" x1="60" y1="380" x2="530" y2="380"/>
    <line class="grid" x1="60" y1="325" x2="530" y2="325"/>
    <line class="grid" x1="60" y1="270" x2="530" y2="270"/>
    <line class="grid" x1="60" y1="215" x2="530" y2="215"/>
    <line class="grid" x1="60" y1="160" x2="530" y2="160"/>
    <line class="grid" x1="60" y1="105" x2="530" y2="105"/>
    <line class="grid" x1="60" y1="50"  x2="530" y2="50"/>
  </g>

  <!-- axes -->
  <line class="axis" x1="60" y1="380" x2="532" y2="380"/>
  <line class="axis" x1="240" y1="40" x2="240" y2="612"/>

  <!-- x ticks and labels -->
  <g class="lbl" text-anchor="middle">
    <text x="75"  y="398">−3</text>
    <text x="130" y="398">−2</text>
    <text x="185" y="398">−1</text>
    <text x="240" y="398">0</text>
    <text x="295" y="398">1</text>
    <text x="350" y="398">2</text>
    <text x="405" y="398">3</text>
    <text x="460" y="398">4</text>
    <text x="515" y="398">5</text>
  </g>
  <!-- y ticks and labels -->
  <g class="lbl" text-anchor="end">
    <text x="230" y="604">−4</text>
    <text x="230" y="549">−3</text>
    <text x="230" y="494">−2</text>
    <text x="230" y="439">−1</text>
    <text x="230" y="329">1</text>
    <text x="230" y="274">2</text>
    <text x="230" y="219">3</text>
    <text x="230" y="164">4</text>
    <text x="230" y="109">5</text>
    <text x="230" y="54">6</text>
  </g>
  <text class="lbl" x="538" y="384" text-anchor="start" font-style="italic">x</text>
  <text class="lbl" x="248" y="36" text-anchor="start" font-style="italic">y</text>

  <!-- line A: y = 2x + 1 -->
  <line class="lineA" x1="102.5" y1="600" x2="377.5" y2="50"/>
  <text class="lblA" x="386" y="56" text-anchor="start">y = 2x + 1</text>

  <!-- slope triangle on line A between (−2,−3) and (−1,−1) -->
  <line class="tri" x1="130" y1="545" x2="185" y2="545"/>
  <line class="tri" x1="185" y1="545" x2="185" y2="435"/>
  <text class="note" x="157.5" y="566" text-anchor="middle">run = 1</text>
  <text class="note" x="197" y="494" text-anchor="start">rise = 2</text>
  <text class="note" x="157.5" y="592" text-anchor="middle" font-weight="bold">slope m = 2/1 = 2</text>

  <!-- line B: y = −x + 4 -->
  <line class="lineB" x1="130" y1="50" x2="515" y2="435"/>
  <text class="lblB" x="478" y="462" text-anchor="start">y = −x + 4</text>

  <!-- intercepts of line A -->
  <circle class="dot dotA" cx="240" cy="325" r="7"/>
  <text class="note" x="254" y="320" text-anchor="start">y-intercept (0, 1)</text>
  <circle class="dot dotA" cx="212.5" cy="380" r="7"/>
  <text class="note" x="212.5" y="412" text-anchor="middle">x-intercept (−0.5, 0)</text>

  <!-- intercepts of line B -->
  <circle class="dot dotB" cx="240" cy="160" r="7"/>
  <text class="note" x="254" y="156" text-anchor="start">y-intercept (0, 4)</text>
  <circle class="dot dotB" cx="460" cy="380" r="7"/>
  <text class="note" x="460" y="412" text-anchor="middle">x-intercept (4, 0)</text>

  <!-- intersection -->
  <circle class="dotI" cx="295" cy="215" r="7"/>
  <text class="note" x="310" y="210" text-anchor="start" font-weight="bold">intersection (1, 3)</text>
  <text class="note" x="310" y="228" text-anchor="start">both equations true here</text>
</svg>
