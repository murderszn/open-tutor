  <line class="tick" x1="370" y1="294" x2="370" y2="306"/>
  <text class="lbl" x="370" y="324">−1</text>
  <line class="tick" x1="425" y1="294" x2="425" y2="306"/>
  <text class="lbl" x="425" y="324">0</text>
  <line class="tick" x1="480" y1="294" x2="480" y2="306"/>
  <text class="lbl" x="480" y="324">1</text>
  <line class="tick" x1="535" y1="294" x2="535" y2="306"/>
  <text class="lbl" x="535" y="324">2</text>
  <line class="tick" x1="590" y1="294" x2="590" y2="306"/>
  <text class="lbl" x="590" y="324">3</text>
  <line class="tick" x1="645" y1="294" x2="645" y2="306"/>
  <text class="lbl" x="645" y="324">4</text>
  <line class="tick" x1="700" y1="294" x2="700" y2="306"/>
  <text class="lbl" x="700" y="324">5</text>
  <line class="ray" x1="590" y1="60" x2="690" y2="60"/>
  <polygon points="690,52 706,60 690,68" fill="#c0392b"/>
  <circle class="open" cx="590" cy="60" r="8"/>
  <line class="ray" x1="370" y1="180" x2="160" y2="180"/>
  <polygon points="160,172 144,180 160,188" fill="#c0392b"/>
  <circle class="closed" cx="370" cy="180" r="8"/>
  <line class="seg" x1="370" y1="300" x2="590" y2="300"/>
  <circle class="open" cx="370" cy="300" r="8"/>
  <circle class="closed" cx="590" cy="300" r="8"/>
