  <line class="tick" x1="425" y1="174" x2="425" y2="186"/>
  <text class="lbl" x="425" y="204">0</text>
  <line class="tick" x1="480" y1="174" x2="480" y2="186"/>
  <text class="lbl" x="480" y="204">1</text>
  <line class="tick" x1="535" y1="174" x2="535" y2="186"/>
