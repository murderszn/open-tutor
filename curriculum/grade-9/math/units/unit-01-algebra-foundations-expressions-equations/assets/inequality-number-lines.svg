  <text class="lbl" x="590" y="204">3</text>
  <line class="tick" x1="645" y1="174" x2="645" y2="186"/>
  <text class="lbl" x="645" y="204">4</text>
  <line class="tick" x1="700" y1="174" x2="700" y2="186"/>
  <text class="lbl" x="700" y="204">5</text>
  <text class="ineq" x="20" y="292">−1 &lt; x ≤ 3</text>
  <line class="axis" x1="150" y1="300" x2="700" y2="300"/>
  <line class="tick" x1="150" y1="294" x2="150" y2="306"/>
