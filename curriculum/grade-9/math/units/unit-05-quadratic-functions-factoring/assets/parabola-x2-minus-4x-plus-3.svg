<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 610 640" role="img" aria-label="Graph of y equals x squared minus 4x plus 3, a parabola with vertex at (2, negative 1), x-intercepts 1 and 3, y-intercept 3, axis of symmetry x equals 2.">
  <title>Parabola y = x&#178; &#8722; 4x + 3</title>
  <rect x="0" y="0" width="610" height="640" fill="#ffffff"/>
  <!-- grid lines every 1 unit -->
  <g stroke="#e5e5e5" stroke-width="1">
    <line x1="125" y1="60" x2="125" y2="600"/>
    <line x1="215" y1="60" x2="215" y2="600"/>
    <line x1="305" y1="60" x2="305" y2="600"/>
    <line x1="395" y1="60" x2="395" y2="600"/>
    <line x1="485" y1="60" x2="485" y2="600"/>
    <line x1="80" y1="600" x2="530" y2="600"/>
    <line x1="80" y1="510" x2="530" y2="510"/>
    <line x1="80" y1="420" x2="530" y2="420"/>
    <line x1="80" y1="330" x2="530" y2="330"/>
    <line x1="80" y1="240" x2="530" y2="240"/>
    <line x1="80" y1="150" x2="530" y2="150"/>
    <line x1="80" y1="60" x2="530" y2="60"/>
  </g>
  <!-- axes -->
  <line x1="80" y1="420" x2="530" y2="420" stroke="#111111" stroke-width="2"/>
  <line x1="125" y1="60" x2="125" y2="600" stroke="#111111" stroke-width="2"/>
  <!-- axis of symmetry x = 2, dashed -->
  <line x1="305" y1="60" x2="305" y2="600" stroke="#c0392b" stroke-width="2" stroke-dasharray="8 6"/>
  <text x="313" y="80" font-family="sans-serif" font-size="18" fill="#c0392b">x = 2</text>
  <!-- parabola -->
  <path d="M 125.0 150.0 L 136.2 193.6 L 147.5 234.4 L 158.8 272.3 L 170.0 307.5 L 181.2 339.8 L 192.5 369.4 L 203.8 396.1 L 215.0 420.0 L 226.2 441.1 L 237.5 459.4 L 248.8 474.8 L 260.0 487.5 L 271.2 497.3 L 282.5 504.4 L 293.8 508.6 L 305.0 510.0 L 316.2 508.6 L 327.5 504.4 L 338.8 497.3 L 350.0 487.5 L 361.2 474.8 L 372.5 459.4 L 383.8 441.1 L 395.0 420.0 L 406.2 396.1 L 417.5 369.4 L 428.8 339.8 L 440.0 307.5 L 451.2 272.3 L 462.5 234.4 L 473.8 193.6 L 485.0 150.0" fill="none" stroke="#1f4e79" stroke-width="3"/>
  <!-- intercepts and vertex -->
  <circle cx="215" cy="420" r="6" fill="#1f4e79"/>
  <circle cx="395" cy="420" r="6" fill="#1f4e79"/>
  <circle cx="125" cy="150" r="6" fill="#1f4e79"/>
  <circle cx="305" cy="510" r="7" fill="#c0392b"/>
  <g font-family="sans-serif" font-size="18" fill="#111111">
    <text x="207" y="448">(1, 0)</text>
    <text x="387" y="448">(3, 0)</text>
    <text x="137" y="156">(0, 3)</text>
    <text x="317" y="516">vertex (2, &#8722;1)</text>
    <text x="540" y="426">x</text>
    <text x="131" y="80">y</text>
  </g>
  <text x="80" y="630" font-family="sans-serif" font-size="16" fill="#555555">y = x&#178; &#8722; 4x + 3 = (x &#8722; 1)(x &#8722; 3)</text>
</svg>
