<svg xmlns="http://www.w3.org/2000/svg" width="480" height="440" viewBox="0 0 480 440" role="img" aria-labelledby="title desc">
<title id="title">Feasible region for x ≥ 0, y ≥ 0, x + y ≤ 10, 2x + y ≤ 14</title>
<desc id="desc">A coordinate grid from x = 0 to 12 and y = 0 to 14. The shaded feasible region is the quadrilateral with corners at (0, 0), (7, 0), (4, 6), and (0, 10). It is bounded below by the x-axis, on the left by the y-axis, above on the right by the line x + y = 10, and above in the middle by the line 2x + y = 14. The two slanted boundary lines meet at (4, 6).</desc>
<style>
  .grid { stroke: #cccccc; stroke-width: 1; }
  .axis { stroke: #333333; stroke-width: 2; }
  .region { fill: #bcd6f7; fill-opacity: 0.9; stroke: #1f4e79; stroke-width: 2; }
  .bound { stroke: #1f4e79; stroke-width: 2; }
  .label { font-family: sans-serif; font-size: 13px; fill: #222222; }
  .corner { fill: #c00000; }
  .tick { font-family: sans-serif; font-size: 11px; fill: #555555; }
</style>
<!-- grid: origin (50,400), 26 px per unit -->
<g class="grid">
  <line x1="50" y1="400" x2="362" y2="400"/>
  <line x1="50" y1="374" x2="362" y2="374"/><line x1="50" y1="348" x2="362" y2="348"/>
  <line x1="50" y1="322" x2="362" y2="322"/><line x1="50" y1="296" x2="362" y2="296"/>
  <line x1="50" y1="270" x2="362" y2="270"/><line x1="50" y1="244" x2="362" y2="244"/>
  <line x1="50" y1="218" x2="362" y2="218"/><line x1="50" y1="192" x2="362" y2="192"/>
  <line x1="50" y1="166" x2="362" y2="166"/><line x1="50" y1="140" x2="362" y2="140"/>
  <line x1="50" y1="114" x2="362" y2="114"/><line x1="50" y1="88" x2="362" y2="88"/>
  <line x1="50" y1="62" x2="362" y2="62"/><line x1="50" y1="36" x2="362" y2="36"/>
  <line x1="76" y1="36" x2="76" y2="400"/><line x1="102" y1="36" x2="102" y2="400"/>
  <line x1="128" y1="36" x2="128" y2="400"/><line x1="154" y1="36" x2="154" y2="400"/>
  <line x1="180" y1="36" x2="180" y2="400"/><line x1="206" y1="36" x2="206" y2="400"/>
  <line x1="232" y1="36" x2="232" y2="400"/><line x1="258" y1="36" x2="258" y2="400"/>
  <line x1="284" y1="36" x2="284" y2="400"/><line x1="310" y1="36" x2="310" y2="400"/>
  <line x1="336" y1="36" x2="336" y2="400"/><line x1="362" y1="36" x2="362" y2="400"/>
</g>
<!-- feasible region: (0,0) (7,0) (4,6) (0,10) -->
<polygon class="region" points="50,400 232,400 154,244 50,140"/>
<!-- boundary lines, extended slightly past the region -->
<line class="bound" x1="50" y1="140" x2="310" y2="400"/>
<line class="bound" x1="50" y1="36" x2="232" y2="400"/>
<!-- axes -->
<line class="axis" x1="50" y1="400" x2="380" y2="400"/>
<line class="axis" x1="50" y1="400" x2="50" y2="20"/>
<!-- corner dots and labels -->
<circle class="corner" cx="50" cy="400" r="5"/><text class="label" x="58" y="418">(0, 0)</text>
<circle class="corner" cx="232" cy="400" r="5"/><text class="label" x="218" y="418">(7, 0)</text>
<circle class="corner" cx="154" cy="244" r="5"/><text class="label" x="164" y="238">(4, 6)</text>
<circle class="corner" cx="50" cy="140" r="5"/><text class="label" x="58" y="134">(0, 10)</text>
<!-- line labels -->
<text class="label" x="300" y="330">x + y = 10</text>
<text class="label" x="120" y="60">2x + y = 14</text>
<!-- axis labels and ticks -->
<text class="label" x="382" y="404">x</text>
<text class="label" x="42" y="24">y</text>
<text class="tick" x="48" y="418">0</text>
<text class="tick" x="178" y="418">5</text>
<text class="tick" x="308" y="418">10</text>
<text class="tick" x="34" y="404">0</text>
<text class="tick" x="34" y="274">5</text>
<text class="tick" x="28" y="144">10</text>
</svg>
