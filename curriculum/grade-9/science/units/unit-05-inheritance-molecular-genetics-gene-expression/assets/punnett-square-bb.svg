<svg xmlns="http://www.w3.org/2000/svg" width="560" height="460" viewBox="0 0 560 460" role="img" aria-labelledby="title desc">
  <title id="title">Punnett square for a pea flower-color cross, Bb × Bb</title>
  <desc id="desc">A two-by-two grid. The top labels are the gametes of one parent, B and b. The side labels are the gametes of the other parent, B and b. The four boxes read: top-left BB, purple flowers; top-right Bb, purple flowers; bottom-left Bb, purple flowers; bottom-right bb, white flowers. Genotype ratio 1 BB : 2 Bb : 1 bb. Phenotype ratio 3 purple : 1 white.</desc>
  <rect x="0" y="0" width="560" height="460" fill="#ffffff"/>
  <text x="280" y="34" text-anchor="middle" font-family="sans-serif" font-size="20" font-weight="bold" fill="#1a1a1a">Punnett square: Bb × Bb (flower color)</text>
  <text x="280" y="60" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#333333">B = purple (dominant) · b = white (recessive)</text>

  <!-- Column headers: Parent 1 gametes -->
  <text x="280" y="100" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#333333">Parent 1 gametes (across the top)</text>
  <text x="270" y="140" text-anchor="middle" font-family="sans-serif" font-size="26" font-weight="bold" fill="#1a1a1a">B</text>
  <text x="420" y="140" text-anchor="middle" font-family="sans-serif" font-size="26" font-weight="bold" fill="#1a1a1a">b</text>

  <!-- Row headers: Parent 2 gametes -->
  <text x="40" y="240" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#333333" transform="rotate(-90 40 240)">Parent 2 gametes (down the side)</text>
  <text x="120" y="240" text-anchor="middle" font-family="sans-serif" font-size="26" font-weight="bold" fill="#1a1a1a">B</text>
  <text x="120" y="370" text-anchor="middle" font-family="sans-serif" font-size="26" font-weight="bold" fill="#1a1a1a">b</text>

  <!-- Grid -->
  <g font-family="sans-serif" stroke="#1a1a1a" stroke-width="2">
    <rect x="170" y="160" width="150" height="120" fill="#e6d9f2"/>
    <rect x="320" y="160" width="150" height="120" fill="#e6d9f2"/>
    <rect x="170" y="280" width="150" height="120" fill="#e6d9f2"/>
    <rect x="320" y="280" width="150" height="120" fill="#ffffff"/>
  </g>
  <g font-family="sans-serif" text-anchor="middle" fill="#1a1a1a">
    <text x="245" y="215" font-size="30" font-weight="bold">BB</text>
    <text x="245" y="245" font-size="15">purple</text>
    <text x="395" y="215" font-size="30" font-weight="bold">Bb</text>
    <text x="395" y="245" font-size="15">purple</text>
    <text x="245" y="335" font-size="30" font-weight="bold">Bb</text>
    <text x="245" y="365" font-size="15">purple</text>
    <text x="395" y="335" font-size="30" font-weight="bold">bb</text>
    <text x="395" y="365" font-size="15">white</text>
  </g>

  <text x="280" y="435" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#1a1a1a">Genotypes 1 BB : 2 Bb : 1 bb — Phenotypes 3 purple : 1 white</text>
</svg>
