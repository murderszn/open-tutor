<svg xmlns="http://www.w3.org/2000/svg" width="900" height="560" viewBox="0 0 900 560" role="img" aria-labelledby="title desc">
<title id="title">Mitosis and meiosis chromosome counts for a cell with 2n = 4</title>
<desc id="desc">Top row, mitosis: parent cell 2n equals 4; after S phase 4 chromosomes and 8 chromatids; metaphase 4 chromosomes and 8 chromatids; two daughter cells with 4 chromosomes each. Bottom row, meiosis: parent cell 2n equals 4; after S phase 4 chromosomes and 8 chromatids; after meiosis I two cells with 2 chromosomes each; after meiosis II four cells with 2 chromosomes each, haploid n equals 2.</desc>
<style>
  text { font-family: sans-serif; }
  .heading { font-size: 22px; font-weight: bold; }
  .label { font-size: 15px; }
  .small { font-size: 13px; }
  .cell { fill: #eef4fb; stroke: #1f3a5f; stroke-width: 2; }
  .arrow { stroke: #1f3a5f; stroke-width: 2; }
</style>

<text x="20" y="30" class="heading">Mitosis: one division, two identical cells (2n = 4)</text>
<circle cx="110" cy="110" r="55" class="cell"/>
<text x="110" y="105" text-anchor="middle" class="label">Parent</text>
<text x="110" y="125" text-anchor="middle" class="label">2n = 4</text>
<text x="185" y="112" class="label">S: copy &#8594;</text>
<circle cx="310" cy="110" r="55" class="cell"/>
<text x="310" y="100" text-anchor="middle" class="label">After S</text>
<text x="310" y="120" text-anchor="middle" class="label">4 chr, 8 chromatids</text>
<text x="385" y="112" class="label">Mitosis &#8594;</text>
<circle cx="510" cy="110" r="55" class="cell"/>
<text x="510" y="100" text-anchor="middle" class="label">Metaphase</text>
<text x="510" y="120" text-anchor="middle" class="label">4 chr, 8 chromatids</text>
<text x="585" y="112" class="label">Divide &#8594;</text>
<circle cx="705" cy="82" r="40" class="cell"/>
<text x="705" y="78" text-anchor="middle" class="label">Daughter</text>
<text x="705" y="97" text-anchor="middle" class="label">4 chr</text>
<circle cx="705" cy="168" r="40" class="cell"/>
<text x="705" y="164" text-anchor="middle" class="label">Daughter</text>
<text x="705" y="183" text-anchor="middle" class="label">4 chr</text>
<text x="770" y="112" class="small">2 cells, identical</text>

<text x="20" y="280" class="heading">Meiosis: two divisions, four varied cells (2n = 4 &#8594; n = 2)</text>
<circle cx="110" cy="360" r="55" class="cell"/>
<text x="110" y="355" text-anchor="middle" class="label">Parent</text>
<text x="110" y="375" text-anchor="middle" class="label">2n = 4</text>
<text x="185" y="362" class="label">S: copy &#8594;</text>
<circle cx="310" cy="360" r="55" class="cell"/>
<text x="310" y="350" text-anchor="middle" class="label">After S</text>
<text x="310" y="370" text-anchor="middle" class="label">4 chr, 8 chromatids</text>
<text x="385" y="362" class="label">Meiosis I &#8594;</text>
<circle cx="510" cy="332" r="40" class="cell"/>
<text x="510" y="328" text-anchor="middle" class="label">Cell: 2 chr</text>
<circle cx="510" cy="418" r="40" class="cell"/>
<text x="510" y="414" text-anchor="middle" class="label">Cell: 2 chr</text>
<text x="570" y="362" class="label">Meiosis II &#8594;</text>
<circle cx="680" cy="312" r="30" class="cell"/>
<text x="680" y="316" text-anchor="middle" class="small">Gamete: 2</text>
<circle cx="760" cy="312" r="30" class="cell"/>
<text x="760" y="316" text-anchor="middle" class="small">Gamete: 2</text>
<circle cx="680" cy="392" r="30" class="cell"/>
<text x="680" y="396" text-anchor="middle" class="small">Gamete: 2</text>
<circle cx="760" cy="392" r="30" class="cell"/>
<text x="760" y="396" text-anchor="middle" class="small">Gamete: 2</text>
<text x="820" y="362" class="small">4 cells, n = 2</text>

<text x="20" y="500" class="label">Counting rule: one centromere = one chromosome, however many chromatids it holds.</text>
<text x="20" y="525" class="label">Combinations from independent assortment alone: 2^n. For n = 2: 4. For humans (n = 23): 8,388,608.</text>
</svg>
