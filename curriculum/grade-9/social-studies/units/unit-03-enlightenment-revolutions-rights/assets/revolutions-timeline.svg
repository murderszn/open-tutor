<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="300" viewBox="0 0 1000 300" role="img" aria-label="Timeline of Enlightenment works and revolutions, 1689 to 1947">
  <title>Unit 03 timeline: ideas and revolutions, 1689–1947</title>
  <rect width="1000" height="300" fill="#ffffff"/>
  <line x1="60" y1="150" x2="940" y2="150" stroke="#333333" stroke-width="2"/>
  <!-- Events: x positions are evenly spaced for readability, not to scale. -->
  <g font-family="sans-serif" font-size="13" fill="#111111">
    <circle cx="90" cy="150" r="6" fill="#333333"/><text x="90" y="120" text-anchor="middle">1689</text><text x="90" y="185" text-anchor="middle">Locke,</text><text x="90" y="202" text-anchor="middle">Second Treatise</text>
    <circle cx="210" cy="150" r="6" fill="#333333"/><text x="210" y="120" text-anchor="middle">1748</text><text x="210" y="185" text-anchor="middle">Montesquieu,</text><text x="210" y="202" text-anchor="middle">Spirit of the Laws</text>
    <circle cx="320" cy="150" r="6" fill="#333333"/><text x="320" y="120" text-anchor="middle">1762</text><text x="320" y="185" text-anchor="middle">Rousseau,</text><text x="320" y="202" text-anchor="middle">Social Contract</text>
    <circle cx="430" cy="150" r="6" fill="#333333"/><text x="430" y="120" text-anchor="middle">1776</text><text x="430" y="185" text-anchor="middle">U.S. Declaration</text><text x="430" y="202" text-anchor="middle">of Independence</text>
    <circle cx="530" cy="150" r="6" fill="#333333"/><text x="530" y="120" text-anchor="middle">1789</text><text x="530" y="185" text-anchor="middle">French Declaration</text><text x="530" y="202" text-anchor="middle">of the Rights of Man</text>
    <circle cx="630" cy="150" r="6" fill="#333333"/><text x="630" y="120" text-anchor="middle">1791–1804</text><text x="630" y="185" text-anchor="middle">Haitian Revolution;</text><text x="630" y="202" text-anchor="middle">independence 1804</text>
    <circle cx="730" cy="150" r="6" fill="#333333"/><text x="730" y="120" text-anchor="middle">1815</text><text x="730" y="185" text-anchor="middle">Bolívar,</text><text x="730" y="202" text-anchor="middle">Jamaica Letter</text>
    <circle cx="830" cy="150" r="6" fill="#333333"/><text x="830" y="120" text-anchor="middle">1825 / 1838</text><text x="830" y="185" text-anchor="middle">Haiti indemnity:</text><text x="830" y="202" text-anchor="middle">150M → 90M francs</text>
    <circle cx="920" cy="150" r="6" fill="#333333"/><text x="920" y="120" text-anchor="middle">1947</text><text x="920" y="185" text-anchor="middle">Indemnity</text><text x="920" y="202" text-anchor="middle">payments end</text>
  </g>
  <text x="500" y="280" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#555555">Positions are evenly spaced for readability; the timeline is NOT to scale. Dates verified in the unit README source notes.</text>
</svg>
