<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" role="img" aria-labelledby="title desc">
  <title id="title">Columbian exchange: two-direction flows after 1492</title>
  <desc id="desc">Schematic. Left column: the Americas. Right column: Afro-Eurasia. A blue arrow from the Americas to Afro-Eurasia lists maize, potatoes, tomatoes, cacao, tobacco, cassava. A green arrow from Afro-Eurasia to the Americas lists wheat, sugarcane, horses, cattle. A red arrow from Afro-Eurasia to the Americas lists smallpox and measles, marked as disease.</desc>
  <rect x="0" y="0" width="720" height="420" fill="#ffffff"/>
  <text x="360" y="34" text-anchor="middle" font-family="sans-serif" font-size="20" font-weight="bold">Columbian Exchange — flows after 1492</text>
  <rect x="40" y="70" width="180" height="60" rx="8" fill="#eef4fb" stroke="#2b5d8a" stroke-width="2"/>
  <text x="130" y="105" text-anchor="middle" font-family="sans-serif" font-size="18" font-weight="bold">The Americas</text>
  <rect x="500" y="70" width="180" height="60" rx="8" fill="#fbf3ee" stroke="#8a5a2b" stroke-width="2"/>
  <text x="590" y="105" text-anchor="middle" font-family="sans-serif" font-size="18" font-weight="bold">Afro-Eurasia</text>
  <!-- Americas -> Afro-Eurasia : crops -->
  <line x1="230" y1="170" x2="490" y2="170" stroke="#2b6cb0" stroke-width="4" marker-end="url(#ah)"/>
  <text x="360" y="160" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="bold" fill="#2b6cb0">crops →</text>
  <text x="360" y="196" text-anchor="middle" font-family="sans-serif" font-size="14">maize · potatoes · tomatoes</text>
  <text x="360" y="216" text-anchor="middle" font-family="sans-serif" font-size="14">cacao · tobacco · cassava</text>
  <!-- Afro-Eurasia -> Americas : crops/animals -->
  <line x1="490" y1="260" x2="230" y2="260" stroke="#2f855a" stroke-width="4" marker-end="url(#ah)"/>
  <text x="360" y="250" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="bold" fill="#2f855a">← crops &amp; animals</text>
  <text x="360" y="286" text-anchor="middle" font-family="sans-serif" font-size="14">wheat · sugarcane</text>
  <text x="360" y="306" text-anchor="middle" font-family="sans-serif" font-size="14">horses · cattle · pigs</text>
  <!-- Afro-Eurasia -> Americas : disease -->
  <line x1="490" y1="350" x2="230" y2="350" stroke="#c0392b" stroke-width="4" stroke-dasharray="10 6" marker-end="url(#ah)"/>
  <text x="360" y="340" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="bold" fill="#c0392b">← disease (dashed)</text>
  <text x="360" y="376" text-anchor="middle" font-family="sans-serif" font-size="14">smallpox · measles · typhus · influenza</text>
  <defs>
    <marker id="ah" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <polygon points="0 0, 10 4, 0 8" fill="#333"/>
    </marker>
  </defs>
  <text x="360" y="406" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#555">Term coined by Alfred Crosby (1972). Dashed red = disease, not trade goods.</text>
</svg>
