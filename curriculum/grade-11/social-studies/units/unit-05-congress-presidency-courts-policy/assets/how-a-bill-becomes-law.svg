<svg xmlns="http://www.w3.org/2000/svg" width="760" height="560" viewBox="0 0 760 560" role="img" aria-labelledby="title desc">
  <title id="title">How a bill becomes law — five stages with friction points</title>
  <desc id="desc">A vertical flow of five boxes: 1 Introduction, 2 Committee, 3 Floor, 4 Conference, 5 Presidential action. Side notes mark the friction points: committee inaction, filibuster and cloture (60 votes), veto and pocket veto, and the two-thirds override.</desc>
  <style>
    .box { fill: #f4f1ea; stroke: #1f3a5f; stroke-width: 2; }
    .num { font: bold 22px sans-serif; fill: #1f3a5f; }
    .head { font: bold 17px sans-serif; fill: #1f3a5f; }
    .body { font: 14px sans-serif; fill: #333333; }
    .note { font: italic 13px sans-serif; fill: #7a2e2e; }
    .arrow { stroke: #1f3a5f; stroke-width: 2; fill: none; }
  </style>
  <rect x="180" y="20" width="400" height="78" rx="6" class="box"/>
  <text x="200" y="52" class="num">1</text>
  <text x="235" y="52" class="head">Introduction</text>
  <text x="235" y="76" class="body">A member introduces the bill; it is numbered and referred to committee.</text>
  <rect x="180" y="128" width="400" height="78" rx="6" class="box"/>
  <text x="200" y="160" class="num">2</text>
  <text x="235" y="160" class="head">Committee</text>
  <text x="235" y="184" class="body">Hearings, markup, vote to report — or the bill dies here.</text>
  <rect x="180" y="236" width="400" height="78" rx="6" class="box"/>
  <text x="200" y="268" class="num">3</text>
  <text x="235" y="268" class="head">Floor</text>
  <text x="235" y="292" class="body">Debate and vote in one chamber, then the same in the other.</text>
  <rect x="180" y="344" width="400" height="78" rx="6" class="box"/>
  <text x="200" y="376" class="num">4</text>
  <text x="235" y="376" class="head">Conference</text>
  <text x="235" y="400" class="body">If the two versions differ, a conference committee writes one text.</text>
  <rect x="180" y="452" width="400" height="78" rx="6" class="box"/>
  <text x="200" y="484" class="num">5</text>
  <text x="235" y="484" class="head">Presidential action</text>
  <text x="235" y="508" class="body">Sign (law) · veto (back to Congress) · pocket veto (dies).</text>
  <line x1="380" y1="98" x2="380" y2="128" class="arrow"/>
  <line x1="380" y1="206" x2="380" y2="236" class="arrow"/>
  <line x1="380" y1="314" x2="380" y2="344" class="arrow"/>
  <line x1="380" y1="422" x2="380" y2="452" class="arrow"/>
  <text x="600" y="160" class="note">Friction: most bills</text>
  <text x="600" y="178" class="note">never leave committee.</text>
  <text x="600" y="268" class="note">Friction: Senate filibuster;</text>
  <text x="600" y="286" class="note">cloture needs 60 votes.</text>
  <text x="600" y="484" class="note">Friction: veto override</text>
  <text x="600" y="502" class="note">needs two-thirds of each chamber.</text>
</svg>
