<svg xmlns="http://www.w3.org/2000/svg" width="400" height="320" viewBox="0 0 400 320" role="img" aria-labelledby="title desc">
  <title id="title">Graphs of y = 2^x and y = log base 2 of x, reflected across y = x</title>
  <desc id="desc">A coordinate diagram. The horizontal axis runs from x = 0 to x = 4 and the vertical axis from y = -1 to y = 5. The exponential curve y = 2^x passes through (0,1), (1,2), and (2,4), approaching the horizontal asymptote y = 0. The logarithmic curve y = log2(x) passes through (1,0), (2,1), and (4,2), approaching the vertical asymptote x = 0. The dashed line y = x shows the reflection between the two curves.</desc>
  <rect width="400" height="320" fill="white"/>
  <!-- axes -->
  <line x1="60" y1="280" x2="360" y2="280" stroke="black" stroke-width="1.5"/>
  <line x1="60" y1="280" x2="60" y2="20" stroke="black" stroke-width="1.5"/>
  <text x="350" y="300" font-size="13" text-anchor="middle">x</text>
  <text x="45" y="30" font-size="13" text-anchor="middle">y</text>
  <!-- asymptotes -->
  <line x1="60" y1="240" x2="360" y2="240" stroke="#888888" stroke-width="1" stroke-dasharray="5 4"/>
  <text x="365" y="244" font-size="12">y = 0</text>
  <line x1="60" y1="280" x2="60" y2="20" stroke="#888888" stroke-width="1" stroke-dasharray="5 4"/>
  <text x="64" y="34" font-size="12">x = 0</text>
  <!-- line y = x -->
  <line x1="60" y1="240" x2="340" y2="80" stroke="#888888" stroke-width="1" stroke-dasharray="5 4"/>
  <text x="300" y="70" font-size="12">y = x</text>
  <!-- y = 2^x through computed points (0,1), (1,2), (2,4), capped at y = 5 -->
  <polyline points="60,200 130,160 200,80 222,40" fill="none" stroke="#c0392b" stroke-width="2.5"/>
  <text x="228" y="36" font-size="13" fill="#c0392b">y = 2^x</text>
  <!-- y = log2(x) through computed points (0.5,-1), (1,0), (2,1), (4,2) -->
  <polyline points="95,280 130,240 200,200 340,160" fill="none" stroke="#1a5276" stroke-width="2.5"/>
  <text x="250" y="150" font-size="13" fill="#1a5276">y = log2(x)</text>
  <!-- marked points -->
  <circle cx="60" cy="200" r="3.5" fill="#c0392b"/><text x="66" y="196" font-size="12">(0, 1)</text>
  <circle cx="130" cy="240" r="3.5" fill="#1a5276"/><text x="136" y="256" font-size="12">(1, 0)</text>
  <circle cx="200" cy="80" r="3.5" fill="#c0392b"/><text x="206" y="76" font-size="12">(2, 4)</text>
  <circle cx="200" cy="200" r="3.5" fill="#1a5276"/><text x="206" y="216" font-size="12">(2, 1)</text>
</svg>
