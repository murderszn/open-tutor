<svg xmlns="http://www.w3.org/2000/svg" width="640" height="160" viewBox="0 0 640 160" role="img" aria-label="Story map: start, change, result boxes with arrows">
  <title>Story map: start, change, result</title>
  <desc>Three boxes in a row labeled START, CHANGE, RESULT, with arrows between them. The question mark can sit in any one of the three boxes.</desc>
  <rect x="5" y="40" width="180" height="80" rx="10" fill="#eef4ff" stroke="#1f4e79" stroke-width="3"/>
  <text x="95" y="80" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#1f4e79">START</text>
  <text x="95" y="105" text-anchor="middle" font-family="sans-serif" font-size="17" fill="#333333">what we begin with</text>
  <polygon points="192,75 218,75 218,62 242,80 218,98 218,85 192,85" fill="#1f4e79"/>
  <rect x="247" y="40" width="180" height="80" rx="10" fill="#fff4e0" stroke="#7a4a00" stroke-width="3"/>
  <text x="337" y="80" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#7a4a00">CHANGE</text>
  <text x="337" y="105" text-anchor="middle" font-family="sans-serif" font-size="17" fill="#333333">what joins or leaves</text>
  <polygon points="434,75 460,75 460,62 484,80 460,98 460,85 434,85" fill="#1f4e79"/>
  <rect x="489" y="40" width="146" height="80" rx="10" fill="#e6f7e6" stroke="#1e6b1e" stroke-width="3"/>
  <text x="562" y="80" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#1e6b1e">RESULT</text>
  <text x="562" y="105" text-anchor="middle" font-family="sans-serif" font-size="17" fill="#333333">what we end with</text>
  <text x="320" y="150" text-anchor="middle" font-family="sans-serif" font-size="19" fill="#333333">The ? can sit in any box. Find it, then solve.</text>
</svg>
