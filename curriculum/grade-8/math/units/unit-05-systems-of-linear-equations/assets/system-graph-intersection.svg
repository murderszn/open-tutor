<svg xmlns="http://www.w3.org/2000/svg" width="460" height="540" viewBox="0 0 460 540" role="img" aria-label="Coordinate grid showing the lines y equals 2x minus 1 and y equals negative x plus 5 crossing at the point (2, 3)">
  <title>System graph: y = 2x − 1 and y = −x + 5, intersecting at (2, 3)</title>
  <rect x="0" y="0" width="460" height="540" fill="#ffffff"/>
  <!-- Grid: x from -1 to 5, y from -2 to 6; 60 px per unit.
       px(x) = 50 + (x + 1) * 60; py(y) = 510 - (y + 2) * 60. -->
  <g stroke="#d9dee6" stroke-width="1">
    <line x1="50" y1="30" x2="50" y2="510"/>
    <line x1="110" y1="30" x2="110" y2="510"/>
    <line x1="170" y1="30" x2="170" y2="510"/>
    <line x1="230" y1="30" x2="230" y2="510"/>
    <line x1="290" y1="30" x2="290" y2="510"/>
    <line x1="350" y1="30" x2="350" y2="510"/>
    <line x1="410" y1="30" x2="410" y2="510"/>
    <line x1="50" y1="510" x2="410" y2="510"/>
    <line x1="50" y1="450" x2="410" y2="450"/>
    <line x1="50" y1="390" x2="410" y2="390"/>
    <line x1="50" y1="330" x2="410" y2="330"/>
    <line x1="50" y1="270" x2="410" y2="270"/>
    <line x1="50" y1="210" x2="410" y2="210"/>
    <line x1="50" y1="150" x2="410" y2="150"/>
    <line x1="50" y1="90" x2="410" y2="90"/>
    <line x1="50" y1="30" x2="410" y2="30"/>
  </g>
  <!-- Axes: x-axis is y = 0 (py 390); y-axis is x = 0 (px 110). -->
  <g stroke="#333333" stroke-width="2">
    <line x1="50" y1="390" x2="410" y2="390"/>
    <line x1="110" y1="30" x2="110" y2="510"/>
  </g>
  <!-- Tick labels -->
  <g font-family="sans-serif" font-size="13" fill="#333333">
    <text x="50" y="408" text-anchor="middle">−1</text>
    <text x="110" y="408" text-anchor="middle">0</text>
    <text x="170" y="408" text-anchor="middle">1</text>
    <text x="230" y="408" text-anchor="middle">2</text>
    <text x="290" y="408" text-anchor="middle">3</text>
    <text x="350" y="408" text-anchor="middle">4</text>
    <text x="410" y="408" text-anchor="middle">5</text>
    <text x="100" y="514" text-anchor="end">−2</text>
    <text x="100" y="454" text-anchor="end">−1</text>
    <text x="100" y="394" text-anchor="end">0</text>
    <text x="100" y="334" text-anchor="end">1</text>
    <text x="100" y="274" text-anchor="end">2</text>
    <text x="100" y="214" text-anchor="end">3</text>
    <text x="100" y="154" text-anchor="end">4</text>
    <text x="100" y="94" text-anchor="end">5</text>
    <text x="100" y="34" text-anchor="end">6</text>
    <text x="418" y="394">x</text>
    <text x="114" y="24">y</text>
  </g>
  <!-- Line 1: y = 2x - 1, from (-0.5, -2) to (3.5, 6). -->
  <line x1="80" y1="510" x2="320" y2="30" stroke="#c0392b" stroke-width="3"/>
  <!-- Line 2: y = -x + 5, from (-1, 6) to (5, 0). -->
  <line x1="50" y1="30" x2="410" y2="390" stroke="#2471a3" stroke-width="3"/>
  <!-- Intersection point (2, 3): px 230, py 210. -->
  <circle cx="230" cy="210" r="6" fill="#f1c40f" stroke="#333333" stroke-width="2"/>
  <g font-family="sans-serif" font-size="15" font-weight="bold" fill="#333333">
    <text x="330" y="60">y = 2x − 1</text>
    <text x="58" y="58">y = −x + 5</text>
    <text x="242" y="200">(2, 3)</text>
  </g>
</svg>
