<svg xmlns="http://www.w3.org/2000/svg" width="400" height="320" viewBox="0 0 400 320" role="img" aria-label="A line through the origin with slope 3, with a small right triangle of run 2 and rise 6 and a larger right triangle of run 4 and rise 12">
  <title>Slope triangles: slope 3</title>
  <desc>A straight line through the origin. A small right triangle under it has horizontal leg 2 and vertical leg 6. A larger right triangle has horizontal leg 4 and vertical leg 12. Both give rise over run equal to 3.</desc>
  <!-- axes -->
  <line x1="40" y1="270" x2="340" y2="270" stroke="#333" stroke-width="2"/>
  <line x1="50" y1="300" x2="50" y2="15" stroke="#333" stroke-width="2"/>
  <polygon points="340,270 330,265 330,275" fill="#333"/>
  <polygon points="50,15 45,25 55,25" fill="#333"/>
  <text x="345" y="275" font-family="sans-serif" font-size="14">x</text>
  <text x="38" y="20" font-family="sans-serif" font-size="14">y</text>
  <text x="40" y="290" font-family="sans-serif" font-size="13">0</text>
  <!-- triangles -->
  <polygon points="50,270 150,270 150,150" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <polygon points="50,270 250,270 250,30" fill="none" stroke="#dc2626" stroke-width="2"/>
  <!-- line -->
  <line x1="50" y1="270" x2="255" y2="24" stroke="#111" stroke-width="3"/>
  <!-- labels -->
  <text x="85" y="288" font-family="sans-serif" font-size="13" fill="#2563eb">run 2</text>
  <text x="155" y="215" font-family="sans-serif" font-size="13" fill="#2563eb">rise 6</text>
  <text x="140" y="288" font-family="sans-serif" font-size="13" fill="#dc2626">run 4</text>
  <text x="255" y="155" font-family="sans-serif" font-size="13" fill="#dc2626">rise 12</text>
  <text x="150" y="145" font-family="sans-serif" font-size="12">(2, 6)</text>
  <text x="250" y="25" font-family="sans-serif" font-size="12">(4, 12)</text>
</svg>
