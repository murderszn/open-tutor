<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 170" role="img" aria-labelledby="nl-title nl-desc">
  <title id="nl-title">Number line from −4 to 4 with real numbers placed to scale</title>
  <desc id="nl-desc">A horizontal number line from negative 4 to 4. Marked points: negative square root of 5 at about negative 2.24, square root of 2 at about 1.41, three halves at 1.5, square root of 3 at about 1.73, and pi at about 3.14.</desc>
  <rect x="0" y="0" width="900" height="170" fill="#ffffff"/>
  <!-- baseline: x(v) = 450 + 100*v -->
  <line x1="50" y1="95" x2="850" y2="95" stroke="#222222" stroke-width="2"/>
  <polygon points="850,95 838,89 838,101" fill="#222222"/>
  <!-- integer ticks and labels -->
  <g font-family="sans-serif" font-size="14" fill="#222222" text-anchor="middle">
    <g stroke="#222222" stroke-width="2">
      <line x1="50" y1="88" x2="50" y2="102"/>
      <line x1="150" y1="88" x2="150" y2="102"/>
      <line x1="250" y1="88" x2="250" y2="102"/>
      <line x1="350" y1="88" x2="350" y2="102"/>
      <line x1="450" y1="88" x2="450" y2="102"/>
      <line x1="550" y1="88" x2="550" y2="102"/>
      <line x1="650" y1="88" x2="650" y2="102"/>
      <line x1="750" y1="88" x2="750" y2="102"/>
      <line x1="850" y1="88" x2="850" y2="102"/>
    </g>
    <!-- half ticks -->
    <g stroke="#222222" stroke-width="1">
      <line x1="100" y1="91" x2="100" y2="99"/>
      <line x1="200" y1="91" x2="200" y2="99"/>
      <line x1="300" y1="91" x2="300" y2="99"/>
      <line x1="400" y1="91" x2="400" y2="99"/>
      <line x1="500" y1="91" x2="500" y2="99"/>
      <line x1="600" y1="91" x2="600" y2="99"/>
      <line x1="700" y1="91" x2="700" y2="99"/>
      <line x1="800" y1="91" x2="800" y2="99"/>
    </g>
    <text x="50" y="125">−4</text>
    <text x="150" y="125">−3</text>
    <text x="250" y="125">−2</text>
    <text x="350" y="125">−1</text>
    <text x="450" y="125">0</text>
    <text x="550" y="125">1</text>
    <text x="650" y="125">2</text>
    <text x="750" y="125">3</text>
    <text x="850" y="125">4</text>
  </g>
  <!-- plotted points: dots -->
  <g stroke="#222222" stroke-width="1.5">
    <circle cx="226.4" cy="95" r="7" fill="#c0392b"/>
    <circle cx="591.4" cy="95" r="7" fill="#2471a3"/>
    <circle cx="600" cy="95" r="7" fill="#1e8449"/>
    <circle cx="623.2" cy="95" r="7" fill="#2471a3"/>
    <circle cx="764.2" cy="95" r="7" fill="#c0392b"/>
  </g>
  <!-- labels, staggered to avoid overlap -->
  <g font-family="sans-serif" font-size="15" text-anchor="middle">
    <text x="226.4" y="60" fill="#c0392b">−√5 ≈ −2.24</text>
    <text x="575" y="60" fill="#2471a3">√2 ≈ 1.41</text>
    <text x="623.2" y="38" fill="#2471a3">√3 ≈ 1.73</text>
    <text x="610" y="150" fill="#1e8449">3/2 = 1.5</text>
    <text x="764.2" y="60" fill="#c0392b">π ≈ 3.14</text>
  </g>
  <g font-family="sans-serif" font-size="12" fill="#555555" text-anchor="middle">
    <text x="226.4" y="150">irrational</text>
    <text x="607" y="78" fill="#555555">rational</text>
    <text x="764.2" y="150">irrational</text>
  </g>
</svg>
