<svg xmlns="http://www.w3.org/2000/svg" width="900" height="220" viewBox="0 0 900 220" role="img" aria-label="Timeline of Unit 04 events, 1789 to 1838">
<title>Unit 04 timeline, 1789–1838 (schematic, not to scale)</title>
<rect x="0" y="0" width="900" height="220" fill="#ffffff"/>
<line x1="40" y1="110" x2="860" y2="110" stroke="#333333" stroke-width="2"/>
<text x="450" y="30" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="bold">Unit 04 timeline, 1789–1838 (schematic — spacing is even, not proportional to years)</text>
<g font-family="sans-serif" font-size="12">
<circle cx="80" cy="110" r="5" fill="#333333"/><text x="80" y="90" text-anchor="middle">1789–97</text><text x="80" y="140" text-anchor="middle">Washington</text><text x="80" y="156" text-anchor="middle">precedents</text>
<circle cx="160" cy="110" r="5" fill="#333333"/><text x="160" y="90" text-anchor="middle">1791</text><text x="160" y="140" text-anchor="middle">National bank</text><text x="160" y="156" text-anchor="middle">chartered</text>
<circle cx="240" cy="110" r="5" fill="#333333"/><text x="240" y="90" text-anchor="middle">1800</text><text x="240" y="140" text-anchor="middle">Jefferson elected;</text><text x="240" y="156" text-anchor="middle">peaceful transfer</text>
<circle cx="320" cy="110" r="5" fill="#333333"/><text x="320" y="90" text-anchor="middle">1803</text><text x="320" y="140" text-anchor="middle">Louisiana</text><text x="320" y="156" text-anchor="middle">Purchase</text>
<circle cx="400" cy="110" r="5" fill="#333333"/><text x="400" y="90" text-anchor="middle">1812–15</text><text x="400" y="140" text-anchor="middle">War of 1812;</text><text x="400" y="156" text-anchor="middle">Ghent 1814</text>
<circle cx="480" cy="110" r="5" fill="#333333"/><text x="480" y="90" text-anchor="middle">1820</text><text x="480" y="140" text-anchor="middle">Missouri</text><text x="480" y="156" text-anchor="middle">Compromise</text>
<circle cx="560" cy="110" r="5" fill="#333333"/><text x="560" y="90" text-anchor="middle">1823</text><text x="560" y="140" text-anchor="middle">Monroe</text><text x="560" y="156" text-anchor="middle">Doctrine</text>
<circle cx="640" cy="110" r="5" fill="#333333"/><text x="640" y="90" text-anchor="middle">1830</text><text x="640" y="140" text-anchor="middle">Indian Removal</text><text x="640" y="156" text-anchor="middle">Act</text>
<circle cx="720" cy="110" r="5" fill="#333333"/><text x="720" y="90" text-anchor="middle">1832</text><text x="720" y="140" text-anchor="middle">Worcester v.</text><text x="720" y="156" text-anchor="middle">Georgia</text>
<circle cx="800" cy="110" r="5" fill="#333333"/><text x="800" y="90" text-anchor="middle">1838</text><text x="800" y="140" text-anchor="middle">Forced Cherokee</text><text x="800" y="156" text-anchor="middle">removal begins</text>
</g>
<text x="450" y="200" text-anchor="middle" font-family="sans-serif" font-size="12" font-style="italic">Dates verified 2026-11-02; see unit README standards and source notes.</text>
</svg>
