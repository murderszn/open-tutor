<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 480" role="img" aria-labelledby="tri-title tri-desc">
  <title id="tri-title">Triangular trade schematic</title>
  <desc id="tri-desc">Schematic diagram, not to scale and not a geographic map. Three labeled boxes — Europe, West Africa, and the Americas — connected by arrows showing the three legs of the triangular trade and what moved on each leg.</desc>
  <rect x="0" y="0" width="640" height="480" fill="#fafafa"/>
  <text x="320" y="28" text-anchor="middle" font-family="sans-serif" font-size="18" font-weight="bold">The Triangular Trade (schematic — not to scale)</text>

  <!-- Nodes -->
  <g font-family="sans-serif" font-size="15" font-weight="bold" text-anchor="middle">
    <rect x="250" y="50" width="140" height="52" rx="8" fill="#e8eef7" stroke="#333"/>
    <text x="320" y="82">EUROPE</text>
    <rect x="60" y="330" width="160" height="52" rx="8" fill="#f7ecd9" stroke="#333"/>
    <text x="140" y="362">WEST AFRICA</text>
    <rect x="420" y="330" width="160" height="52" rx="8" fill="#e2f0e2" stroke="#333"/>
    <text x="500" y="362">THE AMERICAS</text>
  </g>

  <!-- Leg 1: Europe -> West Africa -->
  <line x1="255" y1="102" x2="155" y2="330" stroke="#333" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="120" y="210" font-family="sans-serif" font-size="13" text-anchor="middle" transform="rotate(-62 120 210)">Leg 1: cloth, guns, iron, rum</text>

  <!-- Leg 2: West Africa -> Americas (Middle Passage) -->
  <line x1="220" y1="356" x2="420" y2="356" stroke="#333" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="320" y="344" font-family="sans-serif" font-size="13" text-anchor="middle">Leg 2 (Middle Passage): enslaved Africans</text>

  <!-- Leg 3: Americas -> Europe -->
  <line x1="545" y1="330" x2="385" y2="102" stroke="#333" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="540" y="215" font-family="sans-serif" font-size="13" text-anchor="middle" transform="rotate(62 540 215)">Leg 3: sugar, tobacco, rice</text>

  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#333"/>
    </marker>
  </defs>

  <text x="320" y="430" text-anchor="middle" font-family="sans-serif" font-size="12" font-style="italic">Profit was made at every leg — except by the enslaved people whose labor created the value.</text>
  <text x="320" y="452" text-anchor="middle" font-family="sans-serif" font-size="12" font-style="italic">Schematic only: positions and distances are not geographic.</text>
</svg>
