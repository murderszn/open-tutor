<svg xmlns="http://www.w3.org/2000/svg" width="780" height="480" viewBox="0 0 780 480" role="img" aria-labelledby="title desc">
  <title id="title">Kettlewell recapture percentages: peppered moths in polluted and unpolluted woods</title>
  <desc id="desc">Grouped bar chart. In polluted woods near Birmingham, 19 percent of released light moths and 40 percent of released dark moths were recaptured. In unpolluted woods in Dorset, 12.5 percent of light moths and 6 percent of dark moths were recaptured. Data from Kettlewell's 1953 to 1956 release-recapture experiments.</desc>
  <rect x="0" y="0" width="780" height="480" fill="#ffffff"/>
  <text x="390" y="32" font-family="sans-serif" font-size="19" font-weight="bold" text-anchor="middle" fill="#222222">Moths recaptured: polluted vs. unpolluted woods</text>
  <text x="390" y="56" font-family="sans-serif" font-size="13" text-anchor="middle" fill="#555555">Kettlewell, 1953–1956 — percent of released moths later recaptured</text>

  <!-- gridlines and y labels -->
  <line x1="90" y1="340" x2="720" y2="340" stroke="#222222" stroke-width="2"/>
  <line x1="90" y1="282" x2="720" y2="282" stroke="#dddddd" stroke-width="1"/>
  <line x1="90" y1="224" x2="720" y2="224" stroke="#dddddd" stroke-width="1"/>
  <line x1="90" y1="166" x2="720" y2="166" stroke="#dddddd" stroke-width="1"/>
  <line x1="90" y1="108" x2="720" y2="108" stroke="#dddddd" stroke-width="1"/>
  <text x="80" y="345" font-family="sans-serif" font-size="13" text-anchor="end" fill="#333333">0%</text>
  <text x="80" y="287" font-family="sans-serif" font-size="13" text-anchor="end" fill="#333333">10%</text>
  <text x="80" y="229" font-family="sans-serif" font-size="13" text-anchor="end" fill="#333333">20%</text>
  <text x="80" y="171" font-family="sans-serif" font-size="13" text-anchor="end" fill="#333333">30%</text>
  <text x="80" y="113" font-family="sans-serif" font-size="13" text-anchor="end" fill="#333333">40%</text>

  <!-- polluted woods bars -->
  <rect x="150" y="230" width="90" height="110" fill="#f2f2f2" stroke="#666666" stroke-width="2"/>
  <rect x="260" y="109" width="90" height="231" fill="#333333" stroke="#000000" stroke-width="2"/>
  <text x="195" y="218" font-family="sans-serif" font-size="15" font-weight="bold" text-anchor="middle" fill="#222222">19%</text>
  <text x="305" y="97" font-family="sans-serif" font-size="15" font-weight="bold" text-anchor="middle" fill="#222222">40%</text>
  <text x="195" y="360" font-family="sans-serif" font-size="14" text-anchor="middle" fill="#333333">light moths</text>
  <text x="305" y="360" font-family="sans-serif" font-size="14" text-anchor="middle" fill="#333333">dark moths</text>
  <text x="250" y="386" font-family="sans-serif" font-size="15" font-weight="bold" text-anchor="middle" fill="#222222">Polluted woods (Birmingham)</text>

  <!-- unpolluted woods bars -->
  <rect x="470" y="268" width="90" height="72" fill="#f2f2f2" stroke="#666666" stroke-width="2"/>
  <rect x="580" y="305" width="90" height="35" fill="#333333" stroke="#000000" stroke-width="2"/>
  <text x="515" y="256" font-family="sans-serif" font-size="15" font-weight="bold" text-anchor="middle" fill="#222222">12.5%</text>
  <text x="625" y="293" font-family="sans-serif" font-size="15" font-weight="bold" text-anchor="middle" fill="#222222">6%</text>
  <text x="515" y="360" font-family="sans-serif" font-size="14" text-anchor="middle" fill="#333333">light moths</text>
  <text x="625" y="360" font-family="sans-serif" font-size="14" text-anchor="middle" fill="#333333">dark moths</text>
  <text x="570" y="386" font-family="sans-serif" font-size="15" font-weight="bold" text-anchor="middle" fill="#222222">Unpolluted woods (Dorset)</text>

  <!-- legend and source -->
  <rect x="240" y="414" width="18" height="12" fill="#f2f2f2" stroke="#666666" stroke-width="1"/>
  <text x="264" y="426" font-family="sans-serif" font-size="13" fill="#222222">light moths (typica)</text>
  <rect x="440" y="414" width="18" height="12" fill="#333333" stroke="#000000" stroke-width="1"/>
  <text x="464" y="426" font-family="sans-serif" font-size="13" fill="#222222">dark moths (carbonaria)</text>
  <text x="390" y="458" font-family="sans-serif" font-size="12" text-anchor="middle" fill="#555555">Bars show recapture rate, not population share. Higher recapture means better survival in that wood.</text>
</svg>
