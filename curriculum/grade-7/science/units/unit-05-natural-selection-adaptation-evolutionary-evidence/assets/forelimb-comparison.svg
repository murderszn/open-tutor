<svg xmlns="http://www.w3.org/2000/svg" width="960" height="520" viewBox="0 0 960 520" role="img" aria-labelledby="title desc">
  <title id="title">Forelimb comparison: human arm, bat wing, whale flipper</title>
  <desc id="desc">Three stylized forelimbs drawn with the same color-coded bones: dark blue humerus, teal radius and ulna, gray wrist bones, light blue finger bones. The human arm grasps, the bat wing flies, and the whale flipper swims, but all three share the same bone plan.</desc>
  <rect x="0" y="0" width="960" height="520" fill="#ffffff"/>
  <text x="480" y="34" font-family="sans-serif" font-size="22" font-weight="bold" text-anchor="middle" fill="#222222">Same bones, different jobs</text>
  <text x="480" y="60" font-family="sans-serif" font-size="14" text-anchor="middle" fill="#555555">Schematic diagram, not to scale. Colors mark the same bone in each limb.</text>

  <!-- Panel 1: human arm -->
  <text x="160" y="100" font-family="sans-serif" font-size="17" font-weight="bold" text-anchor="middle" fill="#222222">Human arm</text>
  <text x="160" y="122" font-family="sans-serif" font-size="14" text-anchor="middle" fill="#555555">grasping</text>
  <line x1="140" y1="370" x2="152" y2="262" stroke="#1f4e79" stroke-width="15" stroke-linecap="round"/>
  <line x1="152" y1="262" x2="200" y2="196" stroke="#2e8b8b" stroke-width="8" stroke-linecap="round"/>
  <line x1="152" y1="262" x2="184" y2="202" stroke="#2e8b8b" stroke-width="8" stroke-linecap="round"/>
  <circle cx="152" cy="262" r="8" fill="#1f4e79"/>
  <circle cx="196" cy="192" r="9" fill="#8a8a8a"/>
  <line x1="196" y1="192" x2="232" y2="152" stroke="#7fb3d5" stroke-width="5" stroke-linecap="round"/>
  <line x1="196" y1="192" x2="240" y2="168" stroke="#7fb3d5" stroke-width="5" stroke-linecap="round"/>
  <line x1="196" y1="192" x2="238" y2="184" stroke="#7fb3d5" stroke-width="5" stroke-linecap="round"/>
  <line x1="196" y1="192" x2="230" y2="200" stroke="#7fb3d5" stroke-width="5" stroke-linecap="round"/>
  <line x1="196" y1="192" x2="218" y2="212" stroke="#7fb3d5" stroke-width="5" stroke-linecap="round"/>
  <text x="118" y="330" font-family="sans-serif" font-size="13" fill="#1f4e79">humerus</text>
  <text x="196" y="238" font-family="sans-serif" font-size="13" fill="#2e8b8b">radius + ulna</text>

  <!-- Panel 2: bat wing -->
  <text x="480" y="100" font-family="sans-serif" font-size="17" font-weight="bold" text-anchor="middle" fill="#222222">Bat wing</text>
  <text x="480" y="122" font-family="sans-serif" font-size="14" text-anchor="middle" fill="#555555">flying</text>
  <polygon points="470,270 648,118 656,158 646,200 614,232 542,212" fill="#d9d9d9" fill-opacity="0.45" stroke="#999999" stroke-width="1"/>
  <line x1="460" y1="370" x2="470" y2="270" stroke="#1f4e79" stroke-width="15" stroke-linecap="round"/>
  <line x1="470" y1="270" x2="540" y2="212" stroke="#2e8b8b" stroke-width="8" stroke-linecap="round"/>
  <line x1="470" y1="270" x2="528" y2="222" stroke="#2e8b8b" stroke-width="8" stroke-linecap="round"/>
  <circle cx="470" cy="270" r="8" fill="#1f4e79"/>
  <circle cx="540" cy="212" r="9" fill="#8a8a8a"/>
  <line x1="540" y1="212" x2="648" y2="118" stroke="#7fb3d5" stroke-width="5" stroke-linecap="round"/>
  <line x1="540" y1="212" x2="656" y2="158" stroke="#7fb3d5" stroke-width="5" stroke-linecap="round"/>
  <line x1="540" y1="212" x2="646" y2="200" stroke="#7fb3d5" stroke-width="5" stroke-linecap="round"/>
  <line x1="540" y1="212" x2="614" y2="232" stroke="#7fb3d5" stroke-width="5" stroke-linecap="round"/>
  <text x="440" y="330" font-family="sans-serif" font-size="13" fill="#1f4e79">humerus</text>
  <text x="520" y="252" font-family="sans-serif" font-size="13" fill="#2e8b8b">radius + ulna</text>

  <!-- Panel 3: whale flipper -->
  <text x="800" y="100" font-family="sans-serif" font-size="17" font-weight="bold" text-anchor="middle" fill="#222222">Whale flipper</text>
  <text x="800" y="122" font-family="sans-serif" font-size="14" text-anchor="middle" fill="#555555">swimming</text>
  <polygon points="772,372 800,196 836,158 892,160 898,196 862,258 800,296" fill="#d9d9d9" fill-opacity="0.45" stroke="#999999" stroke-width="1"/>
  <line x1="782" y1="370" x2="792" y2="282" stroke="#1f4e79" stroke-width="16" stroke-linecap="round"/>
  <line x1="792" y1="282" x2="832" y2="222" stroke="#2e8b8b" stroke-width="9" stroke-linecap="round"/>
  <line x1="792" y1="282" x2="816" y2="228" stroke="#2e8b8b" stroke-width="9" stroke-linecap="round"/>
  <circle cx="792" cy="282" r="8" fill="#1f4e79"/>
  <circle cx="826" cy="220" r="9" fill="#8a8a8a"/>
  <line x1="826" y1="220" x2="872" y2="172" stroke="#7fb3d5" stroke-width="6" stroke-linecap="round"/>
  <line x1="826" y1="220" x2="882" y2="188" stroke="#7fb3d5" stroke-width="6" stroke-linecap="round"/>
  <line x1="826" y1="220" x2="876" y2="208" stroke="#7fb3d5" stroke-width="6" stroke-linecap="round"/>
  <line x1="826" y1="220" x2="860" y2="224" stroke="#7fb3d5" stroke-width="6" stroke-linecap="round"/>
  <text x="748" y="330" font-family="sans-serif" font-size="13" fill="#1f4e79">humerus</text>
  <text x="818" y="258" font-family="sans-serif" font-size="13" fill="#2e8b8b">radius + ulna</text>

  <!-- Legend -->
  <rect x="60" y="420" width="840" height="80" fill="#f4f4f4" stroke="#cccccc"/>
  <text x="80" y="448" font-family="sans-serif" font-size="15" font-weight="bold" fill="#222222">Bone key (same color = same bone):</text>
  <rect x="80" y="460" width="18" height="12" fill="#1f4e79"/>
  <text x="104" y="472" font-family="sans-serif" font-size="14" fill="#222222">humerus (upper-arm bone)</text>
  <rect x="330" y="460" width="18" height="12" fill="#2e8b8b"/>
  <text x="354" y="472" font-family="sans-serif" font-size="14" fill="#222222">radius + ulna (forearm)</text>
  <rect x="580" y="460" width="18" height="12" fill="#8a8a8a"/>
  <text x="604" y="472" font-family="sans-serif" font-size="14" fill="#222222">wrist bones</text>
  <rect x="740" y="460" width="18" height="12" fill="#7fb3d5"/>
  <text x="764" y="472" font-family="sans-serif" font-size="14" fill="#222222">finger bones</text>
</svg>
