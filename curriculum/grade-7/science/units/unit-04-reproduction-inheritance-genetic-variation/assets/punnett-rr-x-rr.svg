<svg xmlns="http://www.w3.org/2000/svg" width="520" height="340" viewBox="0 0 520 340" role="img" aria-label="Punnett square for a cross between two heterozygous pea plants, Rr by Rr, giving boxes RR, Rr, Rr, rr">
  <title>Punnett square: Rr × Rr</title>
  <rect x="0" y="0" width="520" height="340" fill="white"/>
  <text x="260" y="30" text-anchor="middle" font-family="sans-serif" font-size="20" font-weight="bold">Punnett square: Rr × Rr (pea seed shape)</text>
  <text x="260" y="55" text-anchor="middle" font-family="sans-serif" font-size="14">R = round (dominant) · r = wrinkled (recessive)</text>
  <!-- column headers -->
  <text x="230" y="100" text-anchor="middle" font-family="sans-serif" font-size="22" font-weight="bold">R</text>
  <text x="350" y="100" text-anchor="middle" font-family="sans-serif" font-size="22" font-weight="bold">r</text>
  <!-- row headers -->
  <text x="110" y="165" text-anchor="middle" font-family="sans-serif" font-size="22" font-weight="bold">R</text>
  <text x="110" y="265" text-anchor="middle" font-family="sans-serif" font-size="22" font-weight="bold">r</text>
  <!-- grid -->
  <g fill="none" stroke="#333333" stroke-width="2">
    <rect x="170" y="115" width="120" height="100"/>
    <rect x="290" y="115" width="120" height="100"/>
    <rect x="170" y="215" width="120" height="100"/>
    <rect x="290" y="215" width="120" height="100"/>
  </g>
  <g text-anchor="middle" font-family="sans-serif" font-size="24">
    <text x="230" y="165">RR</text>
    <text x="350" y="165">Rr</text>
    <text x="230" y="265">Rr</text>
    <text x="350" y="265">rr</text>
  </g>
  <g text-anchor="middle" font-family="sans-serif" font-size="14">
    <text x="230" y="190">round</text>
    <text x="350" y="190">round</text>
    <text x="230" y="290">round</text>
    <text x="350" y="290">wrinkled</text>
  </g>
  <text x="260" y="338" text-anchor="middle" font-family="sans-serif" font-size="14">Genotypes 1 RR : 2 Rr : 1 rr · Phenotypes 3 round : 1 wrinkled</text>
</svg>
