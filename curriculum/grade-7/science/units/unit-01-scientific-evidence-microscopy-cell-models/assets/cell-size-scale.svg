<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 340" role="img" aria-labelledby="svgTitle svgDesc">
  <title id="svgTitle">Logarithmic scale of cell and particle sizes</title>
  <desc id="svgDesc">A logarithmic scale from 100 nanometers to 1 millimeter showing: virus 100 nm, E. coli 2 micrometers, red blood cell 8 micrometers, human hair width 75 micrometers, onion cell 300 micrometers, amoeba 500 micrometers, grain of sand 1 millimeter. A dashed line at 100 micrometers marks the smallest detail the naked eye can resolve.</desc>
  <rect x="0" y="0" width="940" height="340" fill="#ffffff"/>
  <text x="470" y="28" text-anchor="middle" font-family="sans-serif" font-size="18" font-weight="bold">How big are cells? (logarithmic scale)</text>
  <!-- axis -->
  <line x1="90" y1="200" x2="850" y2="200" stroke="#333" stroke-width="2"/>
  <!-- decade ticks: 1e-7 .. 1e-3 -->
  <g font-family="sans-serif" font-size="13" fill="#333">
    <line x1="90" y1="200" x2="90" y2="212" stroke="#333" stroke-width="2"/><text x="90" y="232" text-anchor="middle">100 nm</text>
    <line x1="280" y1="200" x2="280" y2="212" stroke="#333" stroke-width="2"/><text x="280" y="232" text-anchor="middle">1 &#181;m</text>
    <line x1="470" y1="200" x2="470" y2="212" stroke="#333" stroke-width="2"/><text x="470" y="232" text-anchor="middle">10 &#181;m</text>
    <line x1="660" y1="200" x2="660" y2="212" stroke="#333" stroke-width="2"/><text x="660" y="232" text-anchor="middle">100 &#181;m</text>
    <line x1="850" y1="200" x2="850" y2="212" stroke="#333" stroke-width="2"/><text x="850" y="232" text-anchor="middle">1 mm</text>
  </g>
  <text x="470" y="258" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#555">Each labeled step is 10&#215; larger than the last (1 &#181;m = 1,000 nm; 1 mm = 1,000 &#181;m)</text>
  <!-- eye resolution limit -->
  <line x1="660" y1="60" x2="660" y2="200" stroke="#c0392b" stroke-width="2" stroke-dasharray="7 5"/>
  <text x="666" y="70" font-family="sans-serif" font-size="13" fill="#c0392b">smallest detail the naked eye can resolve (~100 &#181;m)</text>
  <!-- markers -->
  <g font-family="sans-serif" font-size="14" fill="#1a1a1a">
    <circle cx="90" cy="200" r="6" fill="#2980b9"/>
    <line x1="90" y1="200" x2="90" y2="120" stroke="#2980b9" stroke-width="1.5"/>
    <text x="90" y="110" text-anchor="middle" font-weight="bold">virus</text>
    <text x="90" y="92" text-anchor="middle" font-size="12" fill="#555">~100 nm</text>

    <circle cx="337" cy="200" r="6" fill="#2980b9"/>
    <line x1="337" y1="200" x2="337" y2="150" stroke="#2980b9" stroke-width="1.5"/>
    <text x="337" y="140" text-anchor="middle" font-weight="bold">E. coli bacterium</text>
    <text x="337" y="122" text-anchor="middle" font-size="12" fill="#555">~2 &#181;m</text>

    <circle cx="452" cy="200" r="6" fill="#2980b9"/>
    <line x1="452" y1="200" x2="452" y2="120" stroke="#2980b9" stroke-width="1.5"/>
    <text x="452" y="110" text-anchor="middle" font-weight="bold">red blood cell</text>
    <text x="452" y="92" text-anchor="middle" font-size="12" fill="#555">~8 &#181;m</text>

    <circle cx="636" cy="200" r="6" fill="#2980b9"/>
    <line x1="636" y1="200" x2="636" y2="150" stroke="#2980b9" stroke-width="1.5"/>
    <text x="600" y="140" text-anchor="end" font-weight="bold">human hair (width)</text>
    <text x="600" y="122" text-anchor="end" font-size="12" fill="#555">~75 &#181;m</text>

    <circle cx="751" cy="200" r="6" fill="#2980b9"/>
    <line x1="751" y1="200" x2="751" y2="120" stroke="#2980b9" stroke-width="1.5"/>
    <text x="751" y="110" text-anchor="middle" font-weight="bold">onion skin cell</text>
    <text x="751" y="92" text-anchor="middle" font-size="12" fill="#555">~300 &#181;m</text>

    <circle cx="793" cy="200" r="6" fill="#2980b9"/>
    <line x1="793" y1="200" x2="793" y2="160" stroke="#2980b9" stroke-width="1.5"/>
    <text x="880" y="152" text-anchor="end" font-weight="bold">amoeba</text>
    <text x="880" y="134" text-anchor="end" font-size="12" fill="#555">~500 &#181;m</text>

    <circle cx="850" cy="200" r="6" fill="#2980b9"/>
    <line x1="850" y1="200" x2="850" y2="120" stroke="#2980b9" stroke-width="1.5"/>
    <text x="850" y="110" text-anchor="middle" font-weight="bold">grain of sand</text>
    <text x="850" y="92" text-anchor="middle" font-size="12" fill="#555">~1 mm</text>
  </g>
  <text x="470" y="300" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#555">Everything left of the red dashed line is invisible to the naked eye &#8212; that is why cells needed the microscope to be discovered.</text>
  <text x="470" y="322" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#888">Sizes are typical textbook values, plotted exactly on a base-10 log scale. Deterministic diagram &#8212; not a generated image.</text>
</svg>
