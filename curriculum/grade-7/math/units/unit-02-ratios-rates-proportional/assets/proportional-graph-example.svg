<svg xmlns="http://www.w3.org/2000/svg" width="400" height="300" viewBox="0 0 400 300" role="img" aria-label="Graph of y = 2.5x: a straight line through the origin passing through the plotted points (0,0), (1,2.5), (2,5), (3,7.5), and (4,10).">
  <title>Proportional relationship y = 2.5x</title>
  <desc>Exact plot. Points: (0,0), (1,2.5), (2,5), (3,7.5), (4,10). The line passes through the origin.</desc>
  <!-- Plot area: x 50..380 maps 0..4.5 ; y 20..260 maps 11..0 -->
  <!-- Gridlines -->
  <g stroke="#cccccc" stroke-width="1">
    <line x1="50" y1="260" x2="380" y2="260"/>
    <line x1="50" y1="216.4" x2="380" y2="216.4"/>
    <line x1="50" y1="172.7" x2="380" y2="172.7"/>
    <line x1="50" y1="129.1" x2="380" y2="129.1"/>
    <line x1="50" y1="85.5" x2="380" y2="85.5"/>
    <line x1="50" y1="41.8" x2="380" y2="41.8"/>
    <line x1="50" y1="20" x2="50" y2="260"/>
    <line x1="123.3" y1="20" x2="123.3" y2="260"/>
    <line x1="196.7" y1="20" x2="196.7" y2="260"/>
    <line x1="270" y1="20" x2="270" y2="260"/>
    <line x1="343.3" y1="20" x2="343.3" y2="260"/>
  </g>
  <!-- Axes -->
  <g stroke="#000000" stroke-width="2">
    <line x1="50" y1="260" x2="380" y2="260"/>
    <line x1="50" y1="260" x2="50" y2="20"/>
  </g>
  <!-- Axis labels -->
  <g font-family="sans-serif" font-size="12" fill="#000000">
    <text x="45" y="264">0</text>
    <text x="118" y="276">1</text>
    <text x="192" y="276">2</text>
    <text x="265" y="276">3</text>
    <text x="338" y="276">4</text>
    <text x="372" y="276">x</text>
    <text x="30" y="264">0</text>
    <text x="30" y="220">2</text>
    <text x="30" y="177">4</text>
    <text x="30" y="133">6</text>
    <text x="30" y="90">8</text>
    <text x="24" y="46">10</text>
    <text x="8" y="30">y</text>
  </g>
  <!-- The proportional line y = 2.5x, from (0,0) to (4.4,11) -->
  <line x1="50" y1="260" x2="372.7" y2="20" stroke="#c00000" stroke-width="2.5"/>
  <!-- Plotted points -->
  <g fill="#c00000" stroke="#000000" stroke-width="1">
    <circle cx="50" cy="260" r="5"/>
    <circle cx="123.3" cy="205.5" r="5"/>
    <circle cx="196.7" cy="150.9" r="5"/>
    <circle cx="270" cy="96.4" r="5"/>
    <circle cx="343.3" cy="41.8" r="5"/>
  </g>
  <!-- Point labels -->
  <g font-family="sans-serif" font-size="11" fill="#000000">
    <text x="58" y="252">(0, 0)</text>
    <text x="131" y="200">(1, 2.5)</text>
    <text x="204" y="145">(2, 5)</text>
    <text x="278" y="91">(3, 7.5)</text>
    <text x="290" y="36">(4, 10)</text>
  </g>
</svg>
