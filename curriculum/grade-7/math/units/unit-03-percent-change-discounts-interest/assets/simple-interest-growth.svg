<svg xmlns="http://www.w3.org/2000/svg" width="640" height="300" viewBox="0 0 640 300" role="img" aria-labelledby="title desc">
  <title id="title">Simple interest growth: $200 at 5% per year</title>
  <desc id="desc">Bar chart with five bars: year 0, $200; year 1, $210; year 2, $220; year 3, $230; year 4, $240. Each year adds exactly $10.</desc>
  <rect width="640" height="300" fill="white"/>
  <text x="320" y="24" text-anchor="middle" font-family="sans-serif" font-size="17" font-weight="bold">$200 at 5% simple interest</text>
  <text x="320" y="44" text-anchor="middle" font-family="sans-serif" font-size="13">Each year adds 5% of $200 = $10</text>
  <!-- axes -->
  <line x1="60" y1="250" x2="620" y2="250" stroke="black" stroke-width="1.5"/>
  <line x1="60" y1="250" x2="60" y2="20" stroke="black" stroke-width="1.5"/>
  <!-- y gridlines and labels: value * 0.9 = bar height, baseline y = 250 -->
  <text x="54" y="254" text-anchor="end" font-family="sans-serif" font-size="12">$0</text>
  <text x="54" y="209" text-anchor="end" font-family="sans-serif" font-size="12">$50</text>
  <text x="54" y="164" text-anchor="end" font-family="sans-serif" font-size="12">$100</text>
  <text x="54" y="119" text-anchor="end" font-family="sans-serif" font-size="12">$150</text>
  <text x="54" y="74" text-anchor="end" font-family="sans-serif" font-size="12">$200</text>
  <text x="54" y="29" text-anchor="end" font-family="sans-serif" font-size="12">$250</text>
  <!-- bars: height = value * 0.9, top = 250 - height -->
  <rect x="90" y="70" width="70" height="180" fill="#2f6db3"/>
  <text x="125" y="62" text-anchor="middle" font-family="sans-serif" font-size="13">$200</text>
  <text x="125" y="270" text-anchor="middle" font-family="sans-serif" font-size="13">Year 0</text>
  <rect x="200" y="61" width="70" height="189" fill="#2f6db3"/>
  <text x="235" y="53" text-anchor="middle" font-family="sans-serif" font-size="13">$210</text>
  <text x="235" y="270" text-anchor="middle" font-family="sans-serif" font-size="13">Year 1</text>
  <rect x="310" y="52" width="70" height="198" fill="#2f6db3"/>
  <text x="345" y="44" text-anchor="middle" font-family="sans-serif" font-size="13">$220</text>
  <text x="345" y="270" text-anchor="middle" font-family="sans-serif" font-size="13">Year 2</text>
  <rect x="420" y="43" width="70" height="207" fill="#2f6db3"/>
  <text x="455" y="35" text-anchor="middle" font-family="sans-serif" font-size="13">$230</text>
  <text x="455" y="270" text-anchor="middle" font-family="sans-serif" font-size="13">Year 3</text>
  <rect x="530" y="34" width="70" height="216" fill="#2f6db3"/>
  <text x="565" y="26" text-anchor="middle" font-family="sans-serif" font-size="13">$240</text>
  <text x="565" y="270" text-anchor="middle" font-family="sans-serif" font-size="13">Year 4</text>
  <text x="320" y="294" text-anchor="middle" font-family="sans-serif" font-size="12">Balance grows by the same $10 every year: I = 200 x 0.05 x t</text>
</svg>
