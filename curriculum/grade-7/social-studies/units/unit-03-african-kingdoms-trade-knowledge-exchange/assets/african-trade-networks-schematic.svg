<svg xmlns="http://www.w3.org/2000/svg" width="900" height="560" viewBox="0 0 900 560" role="img" aria-label="Schematic diagram of African trade networks, not to scale">
<title>African trade networks — schematic, not to scale</title>
<rect x="0" y="0" width="900" height="560" fill="#fdf6e3"/>
<text x="450" y="30" text-anchor="middle" font-family="sans-serif" font-size="20" font-weight="bold">African Trade Networks — SCHEMATIC, NOT TO SCALE</text>
<text x="450" y="52" text-anchor="middle" font-family="sans-serif" font-size="13">Positions are approximate. Use for route-tracing only — not for measuring distance.</text>
<!-- North / Sahara band -->
<text x="40" y="100" font-family="sans-serif" font-size="13" font-weight="bold">NORTH AFRICA</text>
<circle cx="180" cy="120" r="10" fill="#b58900"/><text x="180" y="145" text-anchor="middle" font-family="sans-serif" font-size="13">Sijilmasa</text>
<text x="40" y="200" font-family="sans-serif" font-size="13" font-weight="bold">SAHARA</text>
<circle cx="330" cy="200" r="10" fill="#b58900"/><text x="330" y="225" text-anchor="middle" font-family="sans-serif" font-size="13">Taghaza (salt)</text>
<!-- West Africa -->
<text x="40" y="300" font-family="sans-serif" font-size="13" font-weight="bold">WEST AFRICA</text>
<circle cx="240" cy="300" r="11" fill="#268bd2"/><text x="240" y="328" text-anchor="middle" font-family="sans-serif" font-size="13">Timbuktu</text>
<circle cx="380" cy="300" r="11" fill="#268bd2"/><text x="380" y="328" text-anchor="middle" font-family="sans-serif" font-size="13">Gao</text>
<circle cx="300" cy="380" r="11" fill="#268bd2"/><text x="300" y="408" text-anchor="middle" font-family="sans-serif" font-size="13">Djenné</text>
<text x="140" y="420" font-family="sans-serif" font-size="13">Gold region (forest zone, south)</text>
<!-- routes west -->
<line x1="180" y1="120" x2="330" y2="200" stroke="#b58900" stroke-width="3" stroke-dasharray="8,4"/>
<line x1="330" y1="200" x2="240" y2="300" stroke="#b58900" stroke-width="3" stroke-dasharray="8,4"/>
<line x1="240" y1="300" x2="380" y2="300" stroke="#b58900" stroke-width="3" stroke-dasharray="8,4"/>
<line x1="240" y1="300" x2="300" y2="380" stroke="#b58900" stroke-width="3" stroke-dasharray="8,4"/>
<text x="470" y="150" font-family="sans-serif" font-size="13">Camel caravan route: salt goes SOUTH, gold goes NORTH</text>
<!-- East Africa -->
<text x="560" y="100" font-family="sans-serif" font-size="13" font-weight="bold">INDIAN OCEAN</text>
<circle cx="640" cy="200" r="11" fill="#2aa198"/><text x="640" y="228" text-anchor="middle" font-family="sans-serif" font-size="13">Mogadishu</text>
<circle cx="700" cy="300" r="11" fill="#2aa198"/><text x="700" y="328" text-anchor="middle" font-family="sans-serif" font-size="13">Kilwa</text>
<circle cx="760" cy="400" r="11" fill="#2aa198"/><text x="760" y="428" text-anchor="middle" font-family="sans-serif" font-size="13">Sofala</text>
<circle cx="620" cy="420" r="11" fill="#d33682"/><text x="620" y="448" text-anchor="middle" font-family="sans-serif" font-size="13">Great Zimbabwe (inland)</text>
<line x1="640" y1="200" x2="700" y2="300" stroke="#2aa198" stroke-width="3"/>
<line x1="700" y1="300" x2="760" y2="400" stroke="#2aa198" stroke-width="3"/>
<line x1="760" y1="400" x2="620" y2="420" stroke="#d33682" stroke-width="3" stroke-dasharray="8,4"/>
<text x="560" y="480" font-family="sans-serif" font-size="13">Dhow route: monsoon winds carry ships up and down the coast.</text>
<text x="560" y="505" font-family="sans-serif" font-size="13">Inland link: gold and ivory travel from Great Zimbabwe to Sofala.</text>
<text x="40" y="530" font-family="sans-serif" font-size="12">Key: gold circle = Saharan route city · blue = West African city · teal = Swahili coast city · pink = inland capital.</text>
</svg>
