<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 560" role="img" aria-labelledby="t d">
<title id="t">Schematic of four medieval trade corridors</title>
<desc id="d">A schematic diagram (not to scale) showing four medieval trade corridors as horizontal bands: the Silk Road overland route (Chang'an, Dunhuang, Samarkand, Baghdad, Constantinople), Mediterranean sea routes (Venice, Constantinople, Alexandria), Indian Ocean monsoon routes (Aden, Hormuz, Calicut, Malacca), and trans-Saharan caravan routes (Sijilmasa, Taghaza, Timbuktu, Gao). Dashed lines are overland caravan routes; wavy solid lines are sea routes.</desc>
<rect x="0" y="0" width="920" height="560" fill="#faf8f2"/>
<text x="460" y="36" text-anchor="middle" font-family="sans-serif" font-size="22" font-weight="bold" fill="#222">Medieval Trade Corridors — Schematic Diagram</text>
<text x="460" y="60" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#555">Shows which cities connected to which. Distances, directions, and coastlines are NOT to scale.</text>

<!-- Band 1: Silk Road -->
<text x="20" y="128" font-family="sans-serif" font-size="14" font-weight="bold" fill="#7a4a1e">Silk Road — overland caravan routes</text>
<line x1="120" y1="160" x2="800" y2="160" stroke="#7a4a1e" stroke-width="4" stroke-dasharray="14,8"/>
<g font-family="sans-serif" font-size="13" fill="#222" text-anchor="middle">
<circle cx="120" cy="160" r="8" fill="#7a4a1e"/><text x="120" y="190">Chang'an</text>
<circle cx="280" cy="160" r="8" fill="#7a4a1e"/><text x="280" y="190">Dunhuang</text>
<circle cx="440" cy="160" r="8" fill="#7a4a1e"/><text x="440" y="190">Samarkand</text>
<circle cx="600" cy="160" r="8" fill="#7a4a1e"/><text x="600" y="190">Baghdad</text>
<circle cx="760" cy="160" r="10" fill="none" stroke="#7a4a1e" stroke-width="3"/><text x="760" y="190">Constantinople</text>
</g>

<!-- Band 2: Mediterranean -->
<text x="20" y="248" font-family="sans-serif" font-size="14" font-weight="bold" fill="#1d5fa8">Mediterranean — sea routes</text>
<path d="M120,280 Q200,268 280,280 T440,280 T600,280 T760,280" fill="none" stroke="#1d5fa8" stroke-width="4"/>
<g font-family="sans-serif" font-size="13" fill="#222" text-anchor="middle">
<circle cx="120" cy="280" r="8" fill="#1d5fa8"/><text x="120" y="310">Venice</text>
<circle cx="440" cy="280" r="10" fill="none" stroke="#1d5fa8" stroke-width="3"/><text x="440" y="310">Constantinople</text>
<circle cx="760" cy="280" r="8" fill="#1d5fa8"/><text x="760" y="310">Alexandria</text>
</g>

<!-- Band 3: Indian Ocean -->
<text x="20" y="368" font-family="sans-serif" font-size="14" font-weight="bold" fill="#0e7c7b">Indian Ocean — monsoon sea routes</text>
<path d="M120,400 Q200,388 280,400 T440,400 T600,400 T760,400" fill="none" stroke="#0e7c7b" stroke-width="4"/>
<g font-family="sans-serif" font-size="13" fill="#222" text-anchor="middle">
<circle cx="120" cy="400" r="8" fill="#0e7c7b"/><text x="120" y="430">Aden</text>
<circle cx="320" cy="400" r="8" fill="#0e7c7b"/><text x="320" y="430">Hormuz</text>
<circle cx="520" cy="400" r="8" fill="#0e7c7b"/><text x="520" y="430">Calicut</text>
<circle cx="720" cy="400" r="8" fill="#0e7c7b"/><text x="720" y="430">Malacca</text>
</g>

<!-- Band 4: Trans-Saharan -->
<text x="20" y="488" font-family="sans-serif" font-size="14" font-weight="bold" fill="#b3541e">Trans-Saharan — desert caravan routes</text>
<line x1="120" y1="520" x2="800" y2="520" stroke="#b3541e" stroke-width="4" stroke-dasharray="14,8"/>
<g font-family="sans-serif" font-size="13" fill="#222" text-anchor="middle">
<circle cx="160" cy="520" r="8" fill="#b3541e"/><text x="160" y="548">Sijilmasa</text>
<circle cx="360" cy="520" r="8" fill="#b3541e"/><text x="360" y="548">Taghaza</text>
<circle cx="560" cy="520" r="8" fill="#b3541e"/><text x="560" y="548">Timbuktu</text>
<circle cx="760" cy="520" r="8" fill="#b3541e"/><text x="760" y="548">Gao</text>
</g>

<!-- Legend -->
<rect x="640" y="66" width="260" height="52" fill="#fff" stroke="#999"/>
<line x1="652" y1="86" x2="692" y2="86" stroke="#7a4a1e" stroke-width="4" stroke-dasharray="14,8"/>
<text x="700" y="90" font-family="sans-serif" font-size="12" fill="#222">overland caravan route</text>
<path d="M652,108 Q662,104 672,108 T692,108" fill="none" stroke="#1d5fa8" stroke-width="4"/>
<text x="700" y="112" font-family="sans-serif" font-size="12" fill="#222">sea route</text>
</svg>
