<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 560" role="img" aria-labelledby="t d">
<title id="t">Qasr Oasis practice map (fictional town)</title>
<desc id="d">A fictional practice map of Qasr Oasis on a grid with columns A to E and rows 1 to 4. Each grid square equals 1 kilometer; the scale bar runs 0 to 5 kilometers. Features: market at A1, east gate at E1, well at C1, caravanserai at C3, palm grove at E4, a stream along the south edge, and a dashed road from the market through the well to the caravanserai. Includes a key box and a compass rose with north up.</desc>
<rect x="0" y="0" width="640" height="560" fill="#f7f3e8"/>
<text x="320" y="30" text-anchor="middle" font-family="sans-serif" font-size="20" font-weight="bold" fill="#222">Qasr Oasis — Practice Map (fictional town)</text>

<!-- grid -->
<g stroke="#b9b09a" stroke-width="1">
<line x1="50" y1="60" x2="550" y2="60"/><line x1="50" y1="160" x2="550" y2="160"/>
<line x1="50" y1="260" x2="550" y2="260"/><line x1="50" y1="360" x2="550" y2="360"/>
<line x1="50" y1="460" x2="550" y2="460"/>
<line x1="50" y1="60" x2="50" y2="460"/><line x1="150" y1="60" x2="150" y2="460"/>
<line x1="250" y1="60" x2="250" y2="460"/><line x1="350" y1="60" x2="350" y2="460"/>
<line x1="450" y1="60" x2="450" y2="460"/><line x1="550" y1="60" x2="550" y2="460"/>
</g>
<g font-family="sans-serif" font-size="14" fill="#555">
<text x="95" y="52">A</text><text x="195" y="52">B</text><text x="295" y="52">C</text><text x="395" y="52">D</text><text x="495" y="52">E</text>
<text x="30" y="115">1</text><text x="30" y="215">2</text><text x="30" y="315">3</text><text x="30" y="415">4</text>
</g>

<!-- stream along south -->
<path d="M50,440 Q150,420 250,440 T450,440 T550,435" fill="none" stroke="#3a7bd5" stroke-width="10" stroke-linecap="round"/>

<!-- road: market(A1) -> well(C1) -> caravanserai(C3) -->
<line x1="100" y1="110" x2="300" y2="110" stroke="#c0392b" stroke-width="4" stroke-dasharray="10,6"/>
<line x1="300" y1="110" x2="300" y2="310" stroke="#c0392b" stroke-width="4" stroke-dasharray="10,6"/>

<!-- symbols -->
<rect x="88" y="98" width="24" height="24" fill="#222"/>
<polygon points="500,98 512,110 500,122 488,110" fill="#222"/>
<circle cx="300" cy="110" r="12" fill="none" stroke="#222" stroke-width="4"/>
<polygon points="300,298 314,322 286,322" fill="#222"/>
<g fill="#2e7d32">
<polygon points="490,400 500,380 510,400"/><polygon points="505,412 515,392 525,412"/><polygon points="480,418 490,398 500,418"/>
</g>

<!-- key -->
<rect x="566" y="70" width="66" height="150" fill="#fff" stroke="#777"/>
<text x="572" y="90" font-family="sans-serif" font-size="11" font-weight="bold" fill="#222">Key</text>
<rect x="572" y="98" width="10" height="10" fill="#222"/><text x="586" y="107" font-family="sans-serif" font-size="10" fill="#222">market</text>
<polygon points="577,120 582,125 577,130 572,125" fill="#222"/><text x="586" y="129" font-family="sans-serif" font-size="10" fill="#222">gate</text>
<circle cx="577" cy="140" r="5" fill="none" stroke="#222" stroke-width="2"/><text x="586" y="144" font-family="sans-serif" font-size="10" fill="#222">well</text>
<polygon points="577,152 582,162 572,162" fill="#222"/><text x="586" y="162" font-family="sans-serif" font-size="10" fill="#222">inn</text>
<polygon points="574,174 577,168 580,174" fill="#2e7d32"/><text x="586" y="179" font-family="sans-serif" font-size="10" fill="#222">grove</text>
<line x1="572" y1="190" x2="582" y2="190" stroke="#c0392b" stroke-width="3" stroke-dasharray="4,2"/><text x="586" y="194" font-family="sans-serif" font-size="10" fill="#222">road</text>
<line x1="572" y1="204" x2="582" y2="204" stroke="#3a7bd5" stroke-width="4"/><text x="586" y="208" font-family="sans-serif" font-size="10" fill="#222">stream</text>

<!-- compass rose -->
<circle cx="599" cy="270" r="24" fill="#fff" stroke="#777"/>
<polygon points="599,250 604,270 599,290 594,270" fill="#222"/>
<text x="599" y="246" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="bold" fill="#222">N</text>

<!-- scale bar: 5 segments of 100 units = 5 km -->
<g font-family="sans-serif" font-size="11" fill="#222">
<rect x="50" y="486" width="100" height="12" fill="#222"/><rect x="150" y="486" width="100" height="12" fill="#fff" stroke="#222"/>
<rect x="250" y="486" width="100" height="12" fill="#222"/><rect x="350" y="486" width="100" height="12" fill="#fff" stroke="#222"/>
<rect x="450" y="486" width="100" height="12" fill="#222"/>
<text x="50" y="482">0</text><text x="145" y="482">1</text><text x="245" y="482">2</text><text x="345" y="482">3</text><text x="445" y="482">4</text><text x="540" y="482">5 km</text>
</g>
<text x="320" y="530" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#555">Each grid square = 1 kilometer. Town and features are fictional.</text>
</svg>
