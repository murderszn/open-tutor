<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 920" role="img" aria-labelledby="svg-title svg-desc">
  <title id="svg-title">Six landforms: hill, valley, plain, river, lake, coast</title>
  <desc id="svg-desc">Six labeled diagram panels showing a hill, a valley, a plain, a river, a lake, and a coast.</desc>
  <rect x="0" y="0" width="1200" height="920" fill="#ffffff"/>
  <text x="600" y="44" text-anchor="middle" font-family="sans-serif" font-size="34" font-weight="bold" fill="#1a1a1a">Six Landforms</text>

  <!-- Panel 1: HILL -->
  <rect x="20" y="70" width="360" height="360" rx="12" fill="#f7f7f2" stroke="#333" stroke-width="3"/>
  <rect x="20" y="330" width="360" height="100" fill="#c9a86a"/>
  <path d="M 60 330 Q 200 150 340 330 Z" fill="#6aa84f" stroke="#2f5b23" stroke-width="3"/>
  <circle cx="300" cy="120" r="26" fill="#ffd84d" stroke="#b8860b" stroke-width="3"/>
  <text x="200" y="120" text-anchor="middle" font-family="sans-serif" font-size="30" font-weight="bold" fill="#1a1a1a">HILL</text>
  <text x="200" y="466" text-anchor="middle" font-family="sans-serif" font-size="19" fill="#1a1a1a">Raised land.</text>
  <text x="200" y="494" text-anchor="middle" font-family="sans-serif" font-size="19" fill="#1a1a1a">Lower than a mountain.</text>

  <!-- Panel 2: VALLEY -->
  <rect x="420" y="70" width="360" height="360" rx="12" fill="#f7f7f2" stroke="#333" stroke-width="3"/>
  <path d="M 420 330 L 520 180 L 600 330 Z" fill="#6aa84f" stroke="#2f5b23" stroke-width="3"/>
  <path d="M 700 330 L 780 180 L 800 330 Z" fill="#6aa84f" stroke="#2f5b23" stroke-width="3"/>
  <rect x="420" y="330" width="360" height="100" fill="#8fce6e"/>
  <text x="600" y="120" text-anchor="middle" font-family="sans-serif" font-size="30" font-weight="bold" fill="#1a1a1a">VALLEY</text>
  <text x="600" y="466" text-anchor="middle" font-family="sans-serif" font-size="19" fill="#1a1a1a">Low land between</text>
  <text x="600" y="494" text-anchor="middle" font-family="sans-serif" font-size="19" fill="#1a1a1a">hills or mountains.</text>

  <!-- Panel 3: PLAIN -->
  <rect x="820" y="70" width="360" height="360" rx="12" fill="#f7f7f2" stroke="#333" stroke-width="3"/>
  <rect x="820" y="300" width="360" height="130" fill="#8fce6e" stroke="#2f5b23" stroke-width="3"/>
  <path d="M 860 300 h 40 M 940 300 h 40 M 1080 300 h 40" stroke="#2f5b23" stroke-width="4"/>
  <text x="1000" y="120" text-anchor="middle" font-family="sans-serif" font-size="30" font-weight="bold" fill="#1a1a1a">PLAIN</text>
  <text x="1000" y="466" text-anchor="middle" font-family="sans-serif" font-size="19" fill="#1a1a1a">Wide, flat land.</text>
  <text x="1000" y="494" text-anchor="middle" font-family="sans-serif" font-size="19" fill="#1a1a1a">Good for farms.</text>

  <!-- Panel 4: RIVER -->
  <rect x="20" y="540" width="360" height="280" rx="12" fill="#f7f7f2" stroke="#333" stroke-width="3"/>
  <rect x="20" y="540" width="360" height="280" rx="12" fill="none"/>
  <path d="M 140 540 C 120 620, 220 660, 200 740 C 190 780, 210 800, 230 820 L 330 820 C 300 770, 290 730, 310 680 C 330 630, 250 600, 260 540 Z" fill="#4a90d9" stroke="#1c4e80" stroke-width="3"/>
  <path d="M 150 640 q 30 20 60 0 M 190 730 q 30 20 60 0" stroke="#bfe0f5" stroke-width="4" fill="none"/>
  <text x="200" y="590" text-anchor="middle" font-family="sans-serif" font-size="30" font-weight="bold" fill="#1a1a1a">RIVER</text>
  <text x="200" y="852" text-anchor="middle" font-family="sans-serif" font-size="19" fill="#1a1a1a">Water that flows</text>
  <text x="200" y="880" text-anchor="middle" font-family="sans-serif" font-size="19" fill="#1a1a1a">across the land.</text>

  <!-- Panel 5: LAKE -->
  <rect x="420" y="540" width="360" height="280" rx="12" fill="#f7f7f2" stroke="#333" stroke-width="3"/>
  <rect x="430" y="600" width="340" height="150" fill="#8fce6e" stroke="#2f5b23" stroke-width="3"/>
  <ellipse cx="600" cy="675" rx="110" ry="48" fill="#4a90d9" stroke="#1c4e80" stroke-width="3"/>
  <text x="600" y="590" text-anchor="middle" font-family="sans-serif" font-size="30" font-weight="bold" fill="#1a1a1a">LAKE</text>
  <text x="600" y="790" text-anchor="middle" font-family="sans-serif" font-size="19" fill="#1a1a1a">Water with land</text>
  <text x="600" y="818" text-anchor="middle" font-family="sans-serif" font-size="19" fill="#1a1a1a">all around it.</text>

  <!-- Panel 6: COAST -->
  <rect x="820" y="540" width="360" height="280" rx="12" fill="#f7f7f2" stroke="#333" stroke-width="3"/>
  <rect x="820" y="540" width="360" height="280" rx="12" fill="none"/>
  <path d="M 820 540 L 1000 540 C 980 620, 1010 700, 990 820 L 820 820 Z" fill="#4a90d9" stroke="#1c4e80" stroke-width="3"/>
  <path d="M 1000 540 C 980 620, 1010 700, 990 820 L 1180 820 L 1180 540 Z" fill="#e8d8a0" stroke="#8a6d3b" stroke-width="3"/>
  <path d="M 1000 540 C 980 620, 1010 700, 990 820" fill="none" stroke="#1c4e80" stroke-width="4"/>
  <text x="1000" y="590" text-anchor="middle" font-family="sans-serif" font-size="30" font-weight="bold" fill="#1a1a1a">COAST</text>
  <text x="1000" y="852" text-anchor="middle" font-family="sans-serif" font-size="19" fill="#1a1a1a">Where land meets</text>
  <text x="1000" y="880" text-anchor="middle" font-family="sans-serif" font-size="19" fill="#1a1a1a">the ocean.</text>
</svg>
