<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 230" role="img" aria-labelledby="svg-title svg-desc">
  <title id="svg-title">Number-line graphs for x greater than 3 and x less than 2</title>
  <desc id="svg-desc">Two horizontal number lines from 0 to 7. Top: an open circle at 3 with a blue arrow pointing right, graphing x greater than 3. Bottom: an open circle at 2 with a blue arrow pointing left, graphing x less than 2.</desc>
  <defs>
    <marker id="arrow-right" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1d76db"/>
    </marker>
    <marker id="arrow-left" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 10 0 L 0 5 L 10 10 z" fill="#1d76db"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="640" height="230" fill="#ffffff"/>
  <!-- Top: x > 3 -->
  <text x="70" y="32" font-family="sans-serif" font-size="20" font-weight="bold" fill="#1a1a1a">x &gt; 3</text>
  <line x1="60" y1="70" x2="600" y2="70" stroke="#1a1a1a" stroke-width="2"/>
  <g stroke="#1a1a1a" stroke-width="2">
    <line x1="70" y1="64" x2="70" y2="76"/>
    <line x1="140" y1="64" x2="140" y2="76"/>
    <line x1="210" y1="64" x2="210" y2="76"/>
    <line x1="280" y1="64" x2="280" y2="76"/>
    <line x1="350" y1="64" x2="350" y2="76"/>
    <line x1="420" y1="64" x2="420" y2="76"/>
    <line x1="490" y1="64" x2="490" y2="76"/>
    <line x1="560" y1="64" x2="560" y2="76"/>
  </g>
  <g font-family="sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle">
    <text x="70" y="94">0</text>
    <text x="140" y="94">1</text>
    <text x="210" y="94">2</text>
    <text x="280" y="94">3</text>
    <text x="350" y="94">4</text>
    <text x="420" y="94">5</text>
    <text x="490" y="94">6</text>
    <text x="560" y="94">7</text>
  </g>
  <line x1="287" y1="70" x2="585" y2="70" stroke="#1d76db" stroke-width="4" marker-end="url(#arrow-right)"/>
  <circle cx="280" cy="70" r="7" fill="#ffffff" stroke="#1a1a1a" stroke-width="2.5"/>
  <!-- Bottom: x < 2 -->
  <text x="70" y="132" font-family="sans-serif" font-size="20" font-weight="bold" fill="#1a1a1a">x &lt; 2</text>
  <line x1="60" y1="170" x2="600" y2="170" stroke="#1a1a1a" stroke-width="2"/>
  <g stroke="#1a1a1a" stroke-width="2">
    <line x1="70" y1="164" x2="70" y2="176"/>
    <line x1="140" y1="164" x2="140" y2="176"/>
    <line x1="210" y1="164" x2="210" y2="176"/>
    <line x1="280" y1="164" x2="280" y2="176"/>
    <line x1="350" y1="164" x2="350" y2="176"/>
    <line x1="420" y1="164" x2="420" y2="176"/>
    <line x1="490" y1="164" x2="490" y2="176"/>
    <line x1="560" y1="164" x2="560" y2="176"/>
  </g>
  <g font-family="sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle">
    <text x="70" y="194">0</text>
    <text x="140" y="194">1</text>
    <text x="210" y="194">2</text>
    <text x="280" y="194">3</text>
    <text x="350" y="194">4</text>
    <text x="420" y="194">5</text>
    <text x="490" y="194">6</text>
    <text x="560" y="194">7</text>
  </g>
  <line x1="203" y1="170" x2="72" y2="170" stroke="#1d76db" stroke-width="4" marker-end="url(#arrow-left)"/>
  <circle cx="210" cy="170" r="7" fill="#ffffff" stroke="#1a1a1a" stroke-width="2.5"/>
</svg>
