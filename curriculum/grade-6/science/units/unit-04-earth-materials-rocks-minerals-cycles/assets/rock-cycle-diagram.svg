<svg xmlns="http://www.w3.org/2000/svg" width="640" height="500" viewBox="0 0 640 500" role="img" aria-labelledby="title desc">
<title id="title">Rock cycle diagram</title>
<desc id="desc">Five boxes in a loop: Magma, Igneous rock, Sediment, Sedimentary rock, Metamorphic rock. Labeled arrows show cooling and crystallization, weathering erosion and deposition, compaction and cementation, heat and pressure without melting, melting, and uplift. Arrows tagged S are driven by the Sun's energy; arrows tagged E by Earth's interior heat.</desc>
<defs>
<marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
<polygon points="0 0, 7 3, 0 6" fill="#333333"/>
</marker>
<style>
.box { fill: #fdfdfd; stroke: #333333; stroke-width: 2; }
.label { font-family: sans-serif; font-size: 16px; font-weight: bold; fill: #111111; text-anchor: middle; }
.arrow-label { font-family: sans-serif; font-size: 13px; fill: #111111; }
.line { stroke: #333333; stroke-width: 2; fill: none; marker-end: url(#arrow); }
.note { font-family: sans-serif; font-size: 12px; fill: #333333; text-anchor: middle; }
</style>
</defs>
<!-- Boxes -->
<rect class="box" x="230" y="20" width="180" height="48"/>
<text class="label" x="320" y="50">MAGMA</text>
<rect class="box" x="420" y="160" width="180" height="48"/>
<text class="label" x="510" y="190">IGNEOUS ROCK</text>
<rect class="box" x="420" y="360" width="180" height="48"/>
<text class="label" x="510" y="390">SEDIMENT</text>
<rect class="box" x="40" y="360" width="180" height="48"/>
<text class="label" x="130" y="390">SEDIMENTARY ROCK</text>
<rect class="box" x="40" y="160" width="180" height="48"/>
<text class="label" x="130" y="190">METAMORPHIC ROCK</text>
<!-- Arrows -->
<line class="line" x1="380" y1="68" x2="470" y2="155"/>
<text class="arrow-label" x="540" y="128" text-anchor="middle">cooling + crystallization [E]</text>
<line class="line" x1="510" y1="208" x2="510" y2="355"/>
<text class="arrow-label" x="505" y="268" text-anchor="end">uplift + weathering,</text>
<text class="arrow-label" x="505" y="286" text-anchor="end">erosion, deposition [E, then S]</text>
<line class="line" x1="415" y1="384" x2="225" y2="384"/>
<text class="arrow-label" x="320" y="372" text-anchor="middle">compaction + cementation [neither]</text>
<line class="line" x1="130" y1="355" x2="130" y2="213"/>
<text class="arrow-label" x="135" y="268">heat + pressure,</text>
<text class="arrow-label" x="135" y="286">no melting [E]</text>
<line class="line" x1="415" y1="184" x2="225" y2="184"/>
<text class="arrow-label" x="320" y="170" text-anchor="middle">heat + pressure, no melting [E]</text>
<line class="line" x1="190" y1="155" x2="290" y2="73"/>
<text class="arrow-label" x="150" y="110">melting [E]</text>
<line class="line" x1="190" y1="208" x2="425" y2="355"/>
<text class="arrow-label" x="235" y="300">uplift + weathering, erosion,</text>
<text class="arrow-label" x="235" y="318">deposition [E, then S]</text>
<line class="line" x1="130" y1="413" x2="505" y2="413"/>
<text class="arrow-label" x="320" y="452" text-anchor="middle">uplift + weathering, erosion, deposition [E, then S]</text>
<text class="note" x="320" y="488">S = Sun's energy · E = Earth's interior heat · Arrow lengths are not timescales.</text>
</svg>
