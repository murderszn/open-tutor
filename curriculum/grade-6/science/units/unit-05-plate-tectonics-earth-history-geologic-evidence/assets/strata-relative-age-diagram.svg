<svg xmlns="http://www.w3.org/2000/svg" width="640" height="420" viewBox="0 0 640 420" role="img" aria-label="Strata diagram: five stacked rock layers A at the bottom through E at the top, a thin ash layer C, a shell fossil in layer A, a leaf fossil in layer D, and a fault cutting layers A, B, and C">
  <title>Strata diagram for superposition exercises</title>
  <desc>Five stacked layers, bottom to top: A sandstone with a shell fossil; B shale; C a thin ash layer; D sandstone with a leaf fossil; E soil. A fault cuts through layers A, B, and C but stops below D. Layer thicknesses carry no time meaning. The diagram is not to scale.</desc>
  <rect x="0" y="0" width="640" height="420" fill="#ffffff"/>
  <text x="12" y="24" font-family="sans-serif" font-size="16" font-weight="bold" fill="#222222">Rock layers at a cliff (oldest at the bottom)</text>
  <!-- Layer E: soil, y 60-100 -->
  <rect x="80" y="60" width="480" height="40" fill="#8a6d4b" stroke="#333333" stroke-width="1"/>
  <text x="90" y="85" font-family="sans-serif" font-size="14" fill="#ffffff">E — soil (youngest)</text>
  <!-- Layer D: sandstone with leaf fossil, y 100-170 -->
  <rect x="80" y="100" width="480" height="70" fill="#d9c08a" stroke="#333333" stroke-width="1"/>
  <text x="90" y="128" font-family="sans-serif" font-size="14" fill="#222222">D — sandstone, leaf fossil</text>
  <ellipse cx="480" cy="138" rx="22" ry="10" fill="#4a7c59" transform="rotate(-20 480 138)"/>
  <line x1="480" y1="138" x2="505" y2="128" stroke="#4a7c59" stroke-width="2"/>
  <!-- Layer C: thin ash, y 170-190 -->
  <rect x="80" y="170" width="480" height="20" fill="#666666" stroke="#333333" stroke-width="1"/>
  <text x="90" y="185" font-family="sans-serif" font-size="13" fill="#ffffff">C — thin ash layer</text>
  <!-- Layer B: shale, y 190-260 -->
  <rect x="80" y="190" width="480" height="70" fill="#9aa5b1" stroke="#333333" stroke-width="1"/>
  <text x="90" y="218" font-family="sans-serif" font-size="14" fill="#222222">B — shale</text>
  <!-- Layer A: sandstone with shell fossil, y 260-350 -->
  <rect x="80" y="260" width="480" height="90" fill="#c9a227" stroke="#333333" stroke-width="1"/>
  <text x="90" y="288" font-family="sans-serif" font-size="14" fill="#222222">A — sandstone, shell fossil (oldest)</text>
  <circle cx="470" cy="320" r="18" fill="#f5f0e1" stroke="#333333" stroke-width="2"/>
  <path d="M 458 320 A 12 12 0 0 1 482 320" fill="none" stroke="#333333" stroke-width="2"/>
  <!-- Fault: diagonal line cutting A, B, C; stops below D -->
  <line x1="330" y1="350" x2="420" y2="172" stroke="#b00000" stroke-width="3"/>
  <text x="430" y="200" font-family="sans-serif" font-size="13" font-weight="bold" fill="#b00000">fault</text>
  <text x="430" y="218" font-family="sans-serif" font-size="12" fill="#b00000">cuts A, B, C —</text>
  <text x="430" y="234" font-family="sans-serif" font-size="12" fill="#b00000">stops below D</text>
  <!-- Footer -->
  <text x="12" y="385" font-family="sans-serif" font-size="12" fill="#555555">Layer thicknesses are not timescales. The fault is younger than layer C and older than layer D.</text>
  <text x="12" y="405" font-family="sans-serif" font-size="12" fill="#555555">The shell fossil lived before the leaf fossil: layer A is below layer D.</text>
</svg>
