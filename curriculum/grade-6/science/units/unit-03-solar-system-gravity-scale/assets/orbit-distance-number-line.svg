<svg xmlns="http://www.w3.org/2000/svg" width="680" height="230" viewBox="0 0 680 230" role="img" aria-label="Number line of mean planet distances from the Sun in astronomical units, from 0 to 30 AU. Mercury 0.39, Venus 0.72, Earth 1.00, Mars 1.52, Jupiter 5.20, Saturn 9.58, Uranus 19.20, Neptune 30.05.">
  <title>Planet distances from the Sun in astronomical units (AU)</title>
  <rect width="680" height="230" fill="#ffffff"/>
  <text x="20" y="24" font-family="sans-serif" font-size="17" font-weight="bold" fill="#111111">Planet distances from the Sun (1 AU = 149.6 million km)</text>
  <text x="20" y="44" font-family="sans-serif" font-size="12" fill="#444444">Mean distances from the unit dataset table. The inner planets cluster near 0–2 AU.</text>
  <line x1="60" y1="130" x2="630" y2="130" stroke="#111111" stroke-width="2"/>
  <g font-family="sans-serif" font-size="12" fill="#111111">
    <line x1="67" y1="124" x2="67" y2="136" stroke="#111111" stroke-width="2"/><text x="52" y="112">Mercury</text><text x="52" y="100">0.39 AU</text>
    <line x1="74" y1="124" x2="74" y2="136" stroke="#111111" stroke-width="2"/><text x="66" y="160">Venus</text><text x="66" y="172">0.72 AU</text>
    <line x1="79" y1="124" x2="79" y2="136" stroke="#111111" stroke-width="2"/><text x="88" y="112">Earth 1.00 AU</text>
    <line x1="89" y1="124" x2="89" y2="136" stroke="#111111" stroke-width="2"/><text x="98" y="160">Mars 1.52 AU</text>
    <line x1="159" y1="124" x2="159" y2="136" stroke="#111111" stroke-width="2"/><text x="138" y="112">Jupiter 5.20 AU</text>
    <line x1="242" y1="124" x2="242" y2="136" stroke="#111111" stroke-width="2"/><text x="218" y="160">Saturn 9.58 AU</text>
    <line x1="425" y1="124" x2="425" y2="136" stroke="#111111" stroke-width="2"/><text x="398" y="112">Uranus 19.20 AU</text>
    <line x1="631" y1="124" x2="631" y2="136" stroke="#111111" stroke-width="2"/><text x="586" y="160">Neptune 30.05 AU</text>
  </g>
  <g font-family="sans-serif" font-size="12" fill="#444444">
    <text x="60" y="196">0 AU (Sun)</text>
    <text x="230" y="196">10 AU</text>
    <text x="420" y="196">20 AU</text>
    <text x="600" y="196">30 AU</text>
  </g>
  <text x="20" y="220" font-family="sans-serif" font-size="12" fill="#444444">Reading: Neptune is about 30 times as far from the Sun as Earth is; the four rocky planets all sit within 2 AU.</text>
</svg>
