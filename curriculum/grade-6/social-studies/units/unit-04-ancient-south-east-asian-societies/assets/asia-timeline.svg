<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="340" viewBox="0 0 1000 340" role="img" aria-label="Timeline from 2600 BCE to 600 CE showing Indus cities, Shang, Zhou, Buddha, Maurya, Ashoka, Qin, Han, Han paper, and Gupta.">
  <title>Ancient South and East Asia — timeline, 2600 BCE to 600 CE (not to scale for labels)</title>
  <rect width="1000" height="340" fill="white"/>
  <text x="500" y="24" text-anchor="middle" font-family="sans-serif" font-size="18" font-weight="bold" fill="#1e3a5f">Ancient South and East Asia — 2600 BCE to 600 CE</text>
  <!-- Axis -->
  <line x1="60" y1="170" x2="940" y2="170" stroke="#111827" stroke-width="2"/>
  <!-- Tick marks and labels -->
  <g font-family="sans-serif" font-size="13" fill="#111827" text-anchor="middle">
    <line x1="60" y1="164" x2="60" y2="176" stroke="#111827" stroke-width="2"/><text x="60" y="195">2600 BCE</text>
    <line x1="225" y1="164" x2="225" y2="176" stroke="#111827" stroke-width="2"/><text x="225" y="195">2000 BCE</text>
    <line x1="500" y1="164" x2="500" y2="176" stroke="#111827" stroke-width="2"/><text x="500" y="195">1000 BCE</text>
    <line x1="775" y1="164" x2="775" y2="176" stroke="#111827" stroke-width="2"/><text x="775" y="195">1 BCE / 1 CE (no year 0)</text>
    <line x1="940" y1="164" x2="940" y2="176" stroke="#111827" stroke-width="2"/><text x="940" y="195">600 CE</text>
  </g>
  <!-- Events: dots on axis, staggered labels with leader lines -->
  <g font-family="sans-serif" font-size="13" fill="#111827">
    <circle cx="60" cy="170" r="5" fill="#dc2626"/><line x1="60" y1="170" x2="62" y2="52" stroke="#94a3b8"/><text x="62" y="48">Indus cities flourish (~2600 BCE)</text>
    <circle cx="335" cy="170" r="5" fill="#dc2626"/><line x1="335" y1="170" x2="335" y2="228" stroke="#94a3b8"/><text x="335" y="244" text-anchor="middle">Shang begins (~1600 BCE)</text>
    <circle cx="487" cy="170" r="5" fill="#dc2626"/><line x1="487" y1="170" x2="487" y2="88" stroke="#94a3b8"/><text x="487" y="84" text-anchor="middle">Zhou begins (~1046 BCE)</text>
    <circle cx="620" cy="170" r="5" fill="#dc2626"/><line x1="620" y1="170" x2="620" y2="268" stroke="#94a3b8"/><text x="620" y="284" text-anchor="middle">Buddha, traditional (~563 BCE)</text>
    <circle cx="686" cy="170" r="5" fill="#dc2626"/><line x1="686" y1="170" x2="686" y2="52" stroke="#94a3b8"/><text x="686" y="48" text-anchor="middle">Maurya begins (~322 BCE)</text>
    <circle cx="701" cy="170" r="5" fill="#dc2626"/><line x1="701" y1="170" x2="701" y2="228" stroke="#94a3b8"/><text x="701" y="244" text-anchor="middle">Ashoka reigns (~268 BCE)</text>
    <circle cx="714" cy="170" r="5" fill="#dc2626"/><line x1="714" y1="170" x2="714" y2="128" stroke="#94a3b8"/><text x="714" y="124" text-anchor="middle">Qin unifies (221 BCE)</text>
    <circle cx="718" cy="170" r="5" fill="#dc2626"/><line x1="718" y1="170" x2="718" y2="268" stroke="#94a3b8"/><text x="718" y="284" text-anchor="middle">Han begins (206 BCE)</text>
    <circle cx="804" cy="170" r="5" fill="#dc2626"/><line x1="804" y1="170" x2="804" y2="88" stroke="#94a3b8"/><text x="804" y="84" text-anchor="middle">Han paper, tradition (~105 CE)</text>
    <circle cx="863" cy="170" r="5" fill="#dc2626"/><line x1="863" y1="170" x2="863" y2="228" stroke="#94a3b8"/><text x="863" y="244" text-anchor="middle">Gupta begins (~320 CE)</text>
  </g>
  <text x="500" y="330" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#475569">All dates approximate ("about"). Event positions computed from the dates; label positions staggered for readability.</text>
</svg>
