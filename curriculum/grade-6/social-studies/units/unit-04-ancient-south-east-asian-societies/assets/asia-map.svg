<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="620" viewBox="0 0 1000 620" role="img" aria-label="Schematic map of ancient South and East Asia, not to scale, showing the Himalayas, the Indus, Ganges, Yellow, and Yangtze rivers, and overland and sea trade routes.">
  <title>South and East Asia — schematic map (not to scale)</title>
  <rect width="1000" height="620" fill="#dbeafe"/>
  <text x="500" y="30" text-anchor="middle" font-family="sans-serif" font-size="22" font-weight="bold" fill="#1e3a5f">South and East Asia — SCHEMATIC MAP, NOT TO SCALE</text>
  <text x="500" y="52" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#334155">Positions are approximate and west-to-east only. No modern borders are shown.</text>
  <!-- Land shapes (schematic only) -->
  <path d="M120,300 L260,250 L330,300 L300,470 L210,560 L150,430 Z" fill="#fde68a" stroke="#92400e" stroke-width="2"/>
  <path d="M560,240 L760,210 L880,280 L840,430 L660,460 L580,370 Z" fill="#fde68a" stroke="#92400e" stroke-width="2"/>
  <path d="M340,210 L560,200 L560,240 L340,250 Z" fill="#e7e5e4" stroke="#78716c" stroke-width="1"/>
  <!-- Himalayas -->
  <g fill="#a8a29e" stroke="#57534e" stroke-width="1">
    <polygon points="350,210 375,160 400,210"/><polygon points="400,210 425,155 450,210"/>
    <polygon points="450,210 475,160 500,210"/><polygon points="500,210 525,155 550,210"/>
  </g>
  <text x="450" y="140" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="bold" fill="#44403c">HIMALAYAS</text>
  <!-- Rivers -->
  <path d="M210,300 L190,380 L175,460" fill="none" stroke="#2563eb" stroke-width="5" stroke-linecap="round"/>
  <text x="120" y="470" font-family="sans-serif" font-size="14" font-weight="bold" fill="#1d4ed8">Indus River</text>
  <path d="M300,330 L360,360 L430,370" fill="none" stroke="#2563eb" stroke-width="5" stroke-linecap="round"/>
  <text x="330" y="395" font-family="sans-serif" font-size="14" font-weight="bold" fill="#1d4ed8">Ganges River</text>
  <path d="M600,270 L680,280 L770,290" fill="none" stroke="#2563eb" stroke-width="5" stroke-linecap="round"/>
  <text x="620" y="260" font-family="sans-serif" font-size="14" font-weight="bold" fill="#1d4ed8">Yellow River</text>
  <path d="M600,360 L690,375 L800,390" fill="none" stroke="#2563eb" stroke-width="5" stroke-linecap="round"/>
  <text x="630" y="415" font-family="sans-serif" font-size="14" font-weight="bold" fill="#1d4ed8">Yangtze River</text>
  <!-- Cities -->
  <g font-family="sans-serif" font-size="14" fill="#111827">
    <circle cx="195" cy="340" r="6" fill="#dc2626"/><text x="205" y="335">Mohenjo-daro</text>
    <circle cx="370" cy="355" r="6" fill="#dc2626"/><text x="380" y="350">Pataliputra</text>
    <circle cx="640" cy="300" r="6" fill="#dc2626"/><text x="650" y="295">Chang'an</text>
    <circle cx="700" cy="320" r="6" fill="#dc2626"/><text x="710" y="315">Luoyang</text>
  </g>
  <!-- Overland Silk Road route -->
  <path d="M330,270 L480,250 L620,260" fill="none" stroke="#b45309" stroke-width="3" stroke-dasharray="10,6"/>
  <text x="470" y="240" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="bold" fill="#92400e">Overland Silk Roads (dashed)</text>
  <!-- Sea route -->
  <path d="M150,520 L300,560 L520,560 L820,470" fill="none" stroke="#0e7490" stroke-width="3" stroke-dasharray="10,6"/>
  <text x="330" y="585" font-family="sans-serif" font-size="13" font-weight="bold" fill="#155e75">Sea routes (dashed)</text>
  <!-- Monsoon arrows -->
  <g stroke="#059669" stroke-width="3" fill="none" marker-end="url(#arrow)">
    <defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#059669"/></marker></defs>
    <path d="M180,540 Q230,470 250,380"/>
    <path d="M420,540 Q430,470 420,400"/>
  </g>
  <text x="90" y="580" font-family="sans-serif" font-size="13" font-weight="bold" fill="#047857">Summer monsoon winds (sea → land, wet)</text>
  <!-- Seas -->
  <text x="60" y="330" font-family="sans-serif" font-size="14" font-style="italic" fill="#155e75">Arabian Sea</text>
  <text x="430" y="480" font-family="sans-serif" font-size="14" font-style="italic" fill="#155e75">Bay of Bengal</text>
  <text x="900" y="330" font-family="sans-serif" font-size="14" font-style="italic" fill="#155e75">Pacific Ocean</text>
  <!-- Compass -->
  <g transform="translate(940,80)"><circle r="28" fill="white" stroke="#334155"/><text y="-8" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="bold" fill="#111827">N</text><path d="M0,-22 L5,0 L0,22 L-5,0 Z" fill="#dc2626"/></g>
  <text x="500" y="612" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#475569">Schematic only: use for direction and relative position, not for measuring distances.</text>
</svg>
