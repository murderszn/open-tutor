<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 620" role="img" aria-labelledby="t d">
<title id="t">Schematic map of the Aegean and eastern Mediterranean, about 450 BCE</title>
<desc id="d">A schematic map, not to scale. It shows Greece, the Aegean Sea, and nearby lands, with Athens, Sparta, Corinth, Piraeus, Delos, Sicily, Egypt, and the Black Sea marked, plus dashed trade routes for grain, olive oil, and wine.</desc>
<rect x="0" y="0" width="1000" height="620" fill="#cfe3f2"/>
<text x="500" y="30" text-anchor="middle" font-family="sans-serif" font-size="20" font-weight="bold" fill="#222">The Greek World and Its Trade Routes — about 450 BCE</text>
<text x="500" y="52" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#555">SCHEMATIC MAP — NOT TO SCALE. Positions are approximate and show direction only.</text>
<polygon points="120,120 300,90 360,150 330,260 260,330 180,320 120,250" fill="#e8d9a8" stroke="#8a7a4a" stroke-width="2"/>
<polygon points="380,90 700,70 760,140 720,220 560,240 430,200 380,150" fill="#e8d9a8" stroke="#8a7a4a" stroke-width="2"/>
<polygon points="60,470 260,440 300,520 240,580 90,580 40,520" fill="#e8d9a8" stroke="#8a7a4a" stroke-width="2"/>
<polygon points="640,470 940,450 960,540 900,590 680,590 620,530" fill="#e8d9a8" stroke="#8a7a4a" stroke-width="2"/>
<polygon points="700,60 980,40 990,90 720,110" fill="#e8d9a8" stroke="#8a7a4a" stroke-width="2"/>
<text x="480" y="180" text-anchor="middle" font-family="sans-serif" font-size="15" font-style="italic" fill="#2a5a7a">AEGEAN SEA</text>
<text x="180" y="420" text-anchor="middle" font-family="sans-serif" font-size="15" font-style="italic" fill="#2a5a7a">MEDITERRANEAN SEA</text>
<text x="850" y="75" text-anchor="middle" font-family="sans-serif" font-size="14" font-style="italic" fill="#2a5a7a">BLACK SEA</text>
<path d="M 250 300 Q 400 260 560 200" fill="none" stroke="#b3271e" stroke-width="2.5" stroke-dasharray="8 6"/>
<path d="M 250 300 Q 500 420 800 520" fill="none" stroke="#b3271e" stroke-width="2.5" stroke-dasharray="8 6"/>
<path d="M 250 300 Q 160 400 170 480" fill="none" stroke="#1e6b34" stroke-width="2.5" stroke-dasharray="8 6"/>
<path d="M 250 300 Q 330 250 420 190" fill="none" stroke="#1e6b34" stroke-width="2.5" stroke-dasharray="8 6"/>
<circle cx="250" cy="300" r="7" fill="#b3271e" stroke="#fff" stroke-width="2"/>
<text x="262" y="296" font-family="sans-serif" font-size="15" font-weight="bold" fill="#222">Athens</text>
<text x="262" y="314" font-family="sans-serif" font-size="12" fill="#555">capital of the</text>
<circle cx="232" cy="285" r="7" fill="#b3271e" stroke="#fff" stroke-width="2"/>
<text x="244" y="281" font-family="sans-serif" font-size="15" font-weight="bold" fill="#222">Piraeus</text>
<text x="244" y="299" font-family="sans-serif" font-size="12" fill="#555">Athens' harbor</text>
<circle cx="205" cy="335" r="7" fill="#b3271e" stroke="#fff" stroke-width="2"/>
<text x="217" y="331" font-family="sans-serif" font-size="15" font-weight="bold" fill="#222">Corinth</text>
<circle cx="180" cy="380" r="7" fill="#b3271e" stroke="#fff" stroke-width="2"/>
<text x="192" y="376" font-family="sans-serif" font-size="15" font-weight="bold" fill="#222">Sparta</text>
<circle cx="420" cy="190" r="7" fill="#b3271e" stroke="#fff" stroke-width="2"/>
<text x="432" y="186" font-family="sans-serif" font-size="15" font-weight="bold" fill="#222">Delos</text>
<text x="432" y="204" font-family="sans-serif" font-size="12" fill="#555">League treasury</text>
<text x="432" y="220" font-family="sans-serif" font-size="12" fill="#555">until 454 BCE</text>
<circle cx="560" cy="200" r="7" fill="#b3271e" stroke="#fff" stroke-width="2"/>
<text x="572" y="196" font-family="sans-serif" font-size="15" font-weight="bold" fill="#222">Byzantium</text>
<text x="572" y="214" font-family="sans-serif" font-size="12" fill="#555">gateway to the</text>
<text x="572" y="230" font-family="sans-serif" font-size="12" fill="#555">Black Sea grain</text>
<circle cx="170" cy="480" r="7" fill="#b3271e" stroke="#fff" stroke-width="2"/>
<text x="182" y="476" font-family="sans-serif" font-size="15" font-weight="bold" fill="#222">Sicily</text>
<text x="182" y="494" font-family="sans-serif" font-size="12" fill="#555">grain source</text>
<circle cx="800" cy="520" r="7" fill="#b3271e" stroke="#fff" stroke-width="2"/>
<text x="812" y="516" font-family="sans-serif" font-size="15" font-weight="bold" fill="#222">Egypt</text>
<text x="812" y="534" font-family="sans-serif" font-size="12" fill="#555">grain source</text>
<rect x="60" y="560" width="330" height="48" fill="#fdf8ec" stroke="#8a7a4a"/>
<text x="72" y="578" font-family="sans-serif" font-size="13" fill="#222">— —  red dashed: grain into Athens</text>
<text x="72" y="598" font-family="sans-serif" font-size="13" fill="#222">— —  green dashed: olive oil, wine, pottery out</text>
<text x="640" y="130" font-family="sans-serif" font-size="13" fill="#555">Asia Minor coast</text>
<text x="120" y="140" font-family="sans-serif" font-size="13" fill="#555">Mainland Greece</text>
</svg>