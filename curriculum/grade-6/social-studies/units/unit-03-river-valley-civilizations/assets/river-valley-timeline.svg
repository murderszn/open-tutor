<svg xmlns="http://www.w3.org/2000/svg" width="1160" height="340" viewBox="0 0 1160 340" role="img" aria-label="Timeline from 3500 BCE to 1000 BCE showing river-valley events">
<rect width="1160" height="340" fill="#fdf8ec"/>
<text x="580" y="30" text-anchor="middle" font-family="sans-serif" font-size="20" font-weight="bold">River-Valley Civilizations Timeline (all dates approximate, BCE)</text>
<line x1="80" y1="150" x2="1080" y2="150" stroke="#333" stroke-width="3"/>
<polygon points="1080,150 1062,142 1062,158" fill="#333"/>
<line x1="80" y1="140" x2="80" y2="160" stroke="#333" stroke-width="2"/><text x="80" y="180" text-anchor="middle" font-family="sans-serif" font-size="14">3500 BCE</text>
<line x1="280" y1="140" x2="280" y2="160" stroke="#333" stroke-width="2"/><text x="280" y="180" text-anchor="middle" font-family="sans-serif" font-size="14">3000 BCE</text>
<line x1="480" y1="140" x2="480" y2="160" stroke="#333" stroke-width="2"/><text x="480" y="180" text-anchor="middle" font-family="sans-serif" font-size="14">2500 BCE</text>
<line x1="680" y1="140" x2="680" y2="160" stroke="#333" stroke-width="2"/><text x="680" y="180" text-anchor="middle" font-family="sans-serif" font-size="14">2000 BCE</text>
<line x1="880" y1="140" x2="880" y2="160" stroke="#333" stroke-width="2"/><text x="880" y="180" text-anchor="middle" font-family="sans-serif" font-size="14">1500 BCE</text>
<line x1="1080" y1="140" x2="1080" y2="160" stroke="#333" stroke-width="2"/><text x="1080" y="180" text-anchor="middle" font-family="sans-serif" font-size="14">1000 BCE</text>
<circle cx="160" cy="150" r="7" fill="#b03030"/>
<line x1="160" y1="157" x2="160" y2="192" stroke="#b03030" stroke-width="1.5"/>
<text x="160" y="210" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold">Cuneiform begins</text>
<text x="160" y="228" text-anchor="middle" font-family="sans-serif" font-size="12">Mesopotamia, ~3300 BCE</text>
<circle cx="240" cy="150" r="7" fill="#b03030"/>
<line x1="240" y1="157" x2="240" y2="242" stroke="#b03030" stroke-width="1.5"/>
<text x="240" y="260" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold">Egypt unified</text>
<text x="240" y="278" text-anchor="middle" font-family="sans-serif" font-size="12">Egypt, ~3100 BCE</text>
<circle cx="480" cy="150" r="7" fill="#b03030"/>
<line x1="480" y1="157" x2="480" y2="192" stroke="#b03030" stroke-width="1.5"/>
<text x="480" y="210" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold">Mohenjo-daro flourishes</text>
<text x="480" y="228" text-anchor="middle" font-family="sans-serif" font-size="12">Indus Valley, ~2500 BCE</text>
<circle cx="778" cy="150" r="7" fill="#b03030"/>
<line x1="778" y1="157" x2="778" y2="242" stroke="#b03030" stroke-width="1.5"/>
<text x="778" y="260" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold">Hammurabi's Code</text>
<text x="778" y="278" text-anchor="middle" font-family="sans-serif" font-size="12">Babylon, ~1754 BCE</text>
<circle cx="840" cy="150" r="7" fill="#b03030"/>
<line x1="840" y1="157" x2="840" y2="192" stroke="#b03030" stroke-width="1.5"/>
<text x="840" y="210" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold">Shang dynasty begins</text>
<text x="840" y="228" text-anchor="middle" font-family="sans-serif" font-size="12">Yellow River valley, ~1600 BCE</text>
<text x="580" y="320" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#555">Reading note: moving right means later in time. There is no year 0; for two BCE dates, subtract directly.</text>
</svg>
