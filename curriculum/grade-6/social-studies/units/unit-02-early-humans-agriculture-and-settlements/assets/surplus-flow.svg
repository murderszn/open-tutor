<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="220" viewBox="0 0 1000 220" role="img" aria-labelledby="t2 d2">
<title id="t2">How a farming surplus leads to specialists and towns</title>
<desc id="d2">A five-step flow: reliable harvests, surplus stored, some people freed from daily food search, specialists such as potters weavers builders and traders, towns grow with more people and more jobs.</desc>
<rect x="0" y="0" width="1000" height="220" fill="#faf8f2"/>
<text x="500" y="34" text-anchor="middle" font-family="sans-serif" font-size="17" font-weight="bold" fill="#333">From surplus to specialists — how farming changed work</text>
<rect x="0" y="52" width="168" height="96" rx="10" fill="#fff" stroke="#1e6f5c" stroke-width="2.5"/>
<text x="84" y="92" text-anchor="middle" font-family="sans-serif" font-size="15.5" font-weight="bold" fill="#1e6f5c">Reliable harvests</text>
<text x="84" y="116" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#555">planting + herding</text>
<line x1="168" y1="100" x2="200" y2="100" stroke="#333" stroke-width="2.5"/>
<polygon points="200,93 200,107 208,100" fill="#333"/>
<rect x="208" y="52" width="168" height="96" rx="10" fill="#fff" stroke="#1e6f5c" stroke-width="2.5"/>
<text x="292" y="92" text-anchor="middle" font-family="sans-serif" font-size="15.5" font-weight="bold" fill="#1e6f5c">SURPLUS stored</text>
<text x="292" y="116" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#555">grain bins, baskets</text>
<line x1="376" y1="100" x2="408" y2="100" stroke="#333" stroke-width="2.5"/>
<polygon points="408,93 408,107 416,100" fill="#333"/>
<rect x="416" y="52" width="168" height="96" rx="10" fill="#fff" stroke="#1e6f5c" stroke-width="2.5"/>
<text x="500" y="92" text-anchor="middle" font-family="sans-serif" font-size="15.5" font-weight="bold" fill="#1e6f5c">Some people freed</text>
<text x="500" y="116" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#555">from daily food search</text>
<line x1="584" y1="100" x2="616" y2="100" stroke="#333" stroke-width="2.5"/>
<polygon points="616,93 616,107 624,100" fill="#333"/>
<rect x="624" y="52" width="168" height="96" rx="10" fill="#fff" stroke="#1e6f5c" stroke-width="2.5"/>
<text x="708" y="92" text-anchor="middle" font-family="sans-serif" font-size="15.5" font-weight="bold" fill="#1e6f5c">SPECIALISTS</text>
<text x="708" y="116" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#555">potters, weavers,</text>
<text x="708" y="134" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#555">builders, traders</text>
<line x1="792" y1="100" x2="824" y2="100" stroke="#333" stroke-width="2.5"/>
<polygon points="824,93 824,107 832,100" fill="#333"/>
<rect x="832" y="52" width="168" height="96" rx="10" fill="#fff" stroke="#1e6f5c" stroke-width="2.5"/>
<text x="916" y="92" text-anchor="middle" font-family="sans-serif" font-size="15.5" font-weight="bold" fill="#1e6f5c">Towns grow</text>
<text x="916" y="116" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#555">more people,</text>
<text x="916" y="134" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#555">more jobs</text>
<text x="500" y="206" text-anchor="middle" font-family="sans-serif" font-size="13.5" fill="#777">Fictional teaching diagram — it shows the idea, not data from any real village.</text>
</svg>