<svg xmlns="http://www.w3.org/2000/svg" width="720" height="430" viewBox="0 0 720 430" role="img" aria-labelledby="title desc">
<title id="title">Unemployment in the United States, 1929–1940 (percent of labor force)</title>
<desc id="desc">Line chart of estimated unemployment: 1929: 3.2, 1930: 8.9, 1931: 15.9, 1932: 23.6, 1933: 24.9, 1934: 21.7, 1935: 20.1, 1936: 17.0, 1937: 14.3, 1938: 19.0, 1939: 17.2, 1940: 14.6 percent. Source: U.S. Bureau of Labor Statistics historical series (Lebergott estimates, as republished by BLS). These are later estimates, not contemporary measurements.</desc>
