<svg xmlns="http://www.w3.org/2000/svg" width="640" height="420" viewBox="0 0 640 420" role="img" aria-labelledby="title desc">
<title id="title">U.S. aircraft production, 1940–1944</title>
<desc id="desc">Bar chart of U.S. aircraft production, all types: 1940: 6,086; 1941: 19,433; 1942: 47,836; 1943: 85,898; 1944: 96,318. Source: The Army Air Forces in World War II, Vol. VI, ch. 10, comparative table; consistent with John Ellis, The World War II Databook.</desc>
<rect width="640" height="420" fill="#ffffff"/>
<text x="320" y="28" text-anchor="middle" font-family="sans-serif" font-size="17" font-weight="bold" fill="#111111">U.S. aircraft production, 1940–1944 (all types)</text>
<line x1="60" y1="275" x2="590" y2="275" stroke="#dddddd" stroke-width="1"/>
<text x="55" y="279" text-anchor="end" font-family="sans-serif" font-size="11" fill="#555555">25,000</text>
