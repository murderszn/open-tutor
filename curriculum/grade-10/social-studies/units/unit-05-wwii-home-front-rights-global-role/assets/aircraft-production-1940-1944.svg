<text x="55" y="203" text-anchor="end" font-family="sans-serif" font-size="11" fill="#555555">50,000</text>
<line x1="60" y1="124" x2="590" y2="124" stroke="#dddddd" stroke-width="1"/>
<text x="55" y="128" text-anchor="end" font-family="sans-serif" font-size="11" fill="#555555">75,000</text>
<line x1="60" y1="350" x2="590" y2="350" stroke="#111111" stroke-width="2"/>
<rect x="70" y="332" width="80" height="18" fill="#8b1a1a"/>
<text x="110" y="324" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="bold" fill="#111111">6,086</text>
<text x="110" y="372" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#111111">1940</text>
<rect x="180" y="291" width="80" height="59" fill="#8b1a1a"/>
<text x="220" y="283" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="bold" fill="#111111">19,433</text>
<text x="220" y="372" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#111111">1941</text>
<rect x="290" y="206" width="80" height="144" fill="#8b1a1a"/>
<text x="330" y="198" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="bold" fill="#111111">47,836</text>
