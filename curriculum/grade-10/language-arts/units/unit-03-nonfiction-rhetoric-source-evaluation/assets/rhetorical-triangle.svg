<svg xmlns="http://www.w3.org/2000/svg" width="640" height="480" viewBox="0 0 640 480" role="img" aria-label="The rhetorical triangle: speaker (ethos) at the top, audience (pathos) at the bottom left, and argument (logos) at the bottom right, joined by lines labeled credibility, emotion, and logic.">
  <title>The rhetorical triangle</title>
  <rect x="0" y="0" width="640" height="480" fill="#ffffff"/>
  <polygon points="320,60 90,400 550,400" fill="none" stroke="#222222" stroke-width="3"/>
  <circle cx="320" cy="60" r="52" fill="#f2f2f2" stroke="#222222" stroke-width="2"/>
  <circle cx="90" cy="400" r="52" fill="#f2f2f2" stroke="#222222" stroke-width="2"/>
  <circle cx="550" cy="400" r="52" fill="#f2f2f2" stroke="#222222" stroke-width="2"/>
  <text x="320" y="52" text-anchor="middle" font-family="sans-serif" font-size="20" font-weight="bold">SPEAKER</text>
  <text x="320" y="76" text-anchor="middle" font-family="sans-serif" font-size="17">ethos</text>
  <text x="90" y="392" text-anchor="middle" font-family="sans-serif" font-size="20" font-weight="bold">AUDIENCE</text>
  <text x="90" y="416" text-anchor="middle" font-family="sans-serif" font-size="17">pathos</text>
  <text x="550" y="392" text-anchor="middle" font-family="sans-serif" font-size="20" font-weight="bold">ARGUMENT</text>
  <text x="550" y="416" text-anchor="middle" font-family="sans-serif" font-size="17">logos</text>
  <text x="320" y="445" text-anchor="middle" font-family="sans-serif" font-size="16">credibility &#8596; emotion &#8596; logic — each corner pulls on the other two</text>
  <text x="320" y="30" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#444444">Ask of every persuasive text: who speaks, to whom, and with what reasons?</text>
</svg>
