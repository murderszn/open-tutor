<svg xmlns="http://www.w3.org/2000/svg" width="860" height="300" viewBox="0 0 860 300" role="img" aria-labelledby="title desc">
<title id="title">Clause-structure diagram: anchor sentence</title>
<desc id="desc">The sentence When the tide turned, the keeper, carrying a lantern, lit the lamps that lined the quay, divided into four labeled boxes: adverbial clause, independent clause, participial phrase, and relative clause. Sentence type: complex.</desc>
<rect x="5" y="5" width="850" height="290" fill="#ffffff" stroke="#333333" stroke-width="2"/>
<text x="430" y="35" font-family="sans-serif" font-size="20" font-weight="bold" text-anchor="middle">When the tide turned, the keeper, carrying a lantern,</text>
<text x="430" y="60" font-family="sans-serif" font-size="20" font-weight="bold" text-anchor="middle">lit the lamps that lined the quay.</text>
<rect x="30" y="90" width="180" height="90" fill="#dbeafe" stroke="#1e40af" stroke-width="2"/>
<text x="120" y="120" font-family="sans-serif" font-size="15" font-weight="bold" text-anchor="middle">Adverbial clause</text>
<text x="120" y="145" font-family="sans-serif" font-size="15" text-anchor="middle">When the tide turned</text>
<rect x="235" y="90" width="190" height="90" fill="#dcfce7" stroke="#166534" stroke-width="2"/>
<text x="330" y="120" font-family="sans-serif" font-size="15" font-weight="bold" text-anchor="middle">Independent clause</text>
<text x="330" y="145" font-family="sans-serif" font-size="15" text-anchor="middle">the keeper lit the lamps</text>
<rect x="450" y="90" width="180" height="90" fill="#fef3c7" stroke="#92400e" stroke-width="2"/>
<text x="540" y="120" font-family="sans-serif" font-size="15" font-weight="bold" text-anchor="middle">Participial phrase</text>
<text x="540" y="145" font-family="sans-serif" font-size="15" text-anchor="middle">carrying a lantern</text>
<text x="655" y="90" width="175" height="90" fill="#fce7f3" stroke="#9d174d" stroke-width="2"/>
<text x="742" y="120" font-family="sans-serif" font-size="15" font-weight="bold" text-anchor="middle">Relative clause</text>
<text x="742" y="145" font-family="sans-serif" font-size="15" text-anchor="middle">that lined the quay</text>
<text x="430" y="215" font-family="sans-serif" font-size="16" text-anchor="middle">Sentence type: complex — one independent clause plus dependent clauses.</text>
<text x="430" y="245" font-family="sans-serif" font-size="14" text-anchor="middle">A phrase (carrying a lantern) has no subject-verb pair and is not a clause.</text>
<text x="430" y="275" font-family="sans-serif" font-size="14" font-style="italic" text-anchor="middle">Deterministic diagram for Lesson 01; the lesson text carries the same breakdown.</text>
</svg>
