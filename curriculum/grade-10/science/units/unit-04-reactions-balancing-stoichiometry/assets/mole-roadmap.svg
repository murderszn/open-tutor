<svg xmlns="http://www.w3.org/2000/svg" width="760" height="300" viewBox="0 0 760 300" role="img" aria-label="Mole roadmap diagram">
  <title>Mole roadmap: mass, moles, and particles</title>
  <rect x="0" y="0" width="760" height="300" fill="#ffffff"/>
  <text x="380" y="30" text-anchor="middle" font-family="sans-serif" font-size="20" font-weight="bold">Mole roadmap — convert in steps, never skip the mole</text>
  <!-- Boxes -->
  <rect x="30" y="90" width="180" height="70" rx="10" fill="#e8eef7" stroke="#333" stroke-width="2"/>
  <text x="120" y="120" text-anchor="middle" font-family="sans-serif" font-size="18" font-weight="bold">Mass (g)</text>
  <text x="120" y="145" text-anchor="middle" font-family="sans-serif" font-size="14">of one substance</text>
  <rect x="290" y="90" width="180" height="70" rx="10" fill="#f7ead8" stroke="#333" stroke-width="2"/>
  <text x="380" y="120" text-anchor="middle" font-family="sans-serif" font-size="18" font-weight="bold">Moles (mol)</text>
  <text x="380" y="145" text-anchor="middle" font-family="sans-serif" font-size="14">of that substance</text>
  <rect x="550" y="90" width="180" height="70" rx="10" fill="#e2f0e2" stroke="#333" stroke-width="2"/>
  <text x="640" y="120" text-anchor="middle" font-family="sans-serif" font-size="18" font-weight="bold">Particles</text>
  <text x="640" y="145" text-anchor="middle" font-family="sans-serif" font-size="14">atoms / molecules</text>
  <!-- Arrows mass <-> moles -->
  <line x1="210" y1="115" x2="290" y2="115" stroke="#333" stroke-width="2"/>
  <polygon points="290,115 278,109 278,121" fill="#333"/>
  <line x1="290" y1="145" x2="210" y2="145" stroke="#333" stroke-width="2"/>
  <polygon points="210,145 222,139 222,151" fill="#333"/>
  <text x="250" y="100" text-anchor="middle" font-family="sans-serif" font-size="13">÷ molar mass</text>
  <text x="250" y="175" text-anchor="middle" font-family="sans-serif" font-size="13">× molar mass</text>
  <!-- Arrows moles <-> particles -->
  <line x1="470" y1="115" x2="550" y2="115" stroke="#333" stroke-width="2"/>
  <polygon points="550,115 538,109 538,121" fill="#333"/>
  <line x1="550" y1="145" x2="470" y2="145" stroke="#333" stroke-width="2"/>
  <polygon points="470,145 482,139 482,151" fill="#333"/>
  <text x="510" y="100" text-anchor="middle" font-family="sans-serif" font-size="13">× 6.02 × 10²³</text>
  <text x="510" y="175" text-anchor="middle" font-family="sans-serif" font-size="13">÷ 6.02 × 10²³</text>
  <!-- Mole ratio bridge -->
  <rect x="190" y="210" width="380" height="60" rx="10" fill="#f2f2f2" stroke="#333" stroke-width="2"/>
  <text x="380" y="236" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="bold">Between two substances: use the mole ratio</text>
  <text x="380" y="258" text-anchor="middle" font-family="sans-serif" font-size="14">moles wanted = moles given × (coefficient wanted ÷ coefficient given)</text>
  <text x="380" y="292" text-anchor="middle" font-family="sans-serif" font-size="13">Rule: mass must become moles before any ratio is applied.</text>
</svg>
