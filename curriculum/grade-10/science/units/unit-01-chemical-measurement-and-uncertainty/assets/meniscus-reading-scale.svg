<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 440" role="img" aria-label="Graduated cylinder scale from 20 to 30 milliliters with the bottom of the meniscus halfway between 24 and 25 milliliters">
  <title>Meniscus reading practice scale</title>
  <desc>Exact diagram: 1-milliliter graduations, numbered every 2 mL; the bottom of the concave meniscus sits halfway between the 24 mL and 25 mL marks, so the reading is 24.5 mL.</desc>
  <rect x="0" y="0" width="220" height="440" fill="#ffffff"/>
  <!-- cylinder body -->
  <rect x="70" y="30" width="80" height="380" fill="none" stroke="#3a3a3a" stroke-width="2"/>
  <!-- liquid -->
  <rect x="73" y="132" width="74" height="275" fill="#8fc1ee"/>
  <!-- meniscus curve: edges cling higher at y=128, center dips to y=135 -->
  <path d="M 73,128 Q 110,142 147,128 L 147,132 L 73,132 Z" fill="#8fc1ee"/>
  <path d="M 73,128 Q 110,142 147,128" fill="none" stroke="#1c5d99" stroke-width="2.5"/>
  <!-- ticks: 1 mL = 10 px; 30 mL at y=80, 20 mL at y=180 -->
  <g stroke="#3a3a3a" stroke-width="1.5">
    <line x1="70" y1="80" x2="50" y2="80"/>
    <line x1="70" y1="90" x2="58" y2="90"/>
    <line x1="70" y1="100" x2="50" y2="100"/>
    <line x1="70" y1="110" x2="58" y2="110"/>
    <line x1="70" y1="120" x2="50" y2="120"/>
    <line x1="70" y1="130" x2="58" y2="130"/>
    <line x1="70" y1="140" x2="50" y2="140"/>
    <line x1="70" y1="150" x2="58" y2="150"/>
    <line x1="70" y1="160" x2="50" y2="160"/>
    <line x1="70" y1="170" x2="58" y2="170"/>
    <line x1="70" y1="180" x2="50" y2="180"/>
  </g>
  <g font-family="sans-serif" font-size="13" fill="#222222" text-anchor="end">
    <text x="44" y="84">30</text>
    <text x="44" y="104">28</text>
    <text x="44" y="124">26</text>
    <text x="44" y="144">24</text>
    <text x="44" y="164">22</text>
    <text x="44" y="184">20</text>
  </g>
  <text x="44" y="210" font-family="sans-serif" font-size="12" fill="#222222" text-anchor="end">mL</text>
</svg>
