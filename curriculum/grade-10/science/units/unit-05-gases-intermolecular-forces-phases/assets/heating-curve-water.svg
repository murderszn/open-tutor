<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 480" role="img" aria-labelledby="title desc">
  <title id="title">Heating curve for 100 g of water, from ice at −20 °C to steam at 120 °C</title>
  <desc id="desc">Temperature in degrees Celsius rises with heat added in kilojoules. The curve rises from −20 °C to 0 °C, stays flat at 0 °C while the ice melts, rises from 0 °C to 100 °C, stays flat at 100 °C while the water boils, then rises from 100 °C to 120 °C as steam. Segment lengths are proportional to the heat added, computed from the constants in the unit README.</desc>
  <rect width="720" height="480" fill="#ffffff"/>
  <!-- axes -->
  <line x1="80" y1="440" x2="700" y2="440" stroke="#333333" stroke-width="2"/>
  <line x1="80" y1="440" x2="80" y2="30" stroke="#333333" stroke-width="2"/>
  <!-- gridlines at 0 C and 100 C -->
  <line x1="80" y1="382.9" x2="700" y2="382.9" stroke="#cccccc" stroke-width="1" stroke-dasharray="4 4"/>
  <line x1="80" y1="97.1" x2="700" y2="97.1" stroke="#cccccc" stroke-width="1" stroke-dasharray="4 4"/>
  <!-- axis labels -->
  <text x="390" y="472" font-family="sans-serif" font-size="15" fill="#333333" text-anchor="middle">Heat added (kJ)</text>
  <text x="18" y="240" font-family="sans-serif" font-size="15" fill="#333333" text-anchor="middle" transform="rotate(-90 18 240)">Temperature (°C)</text>
  <!-- tick labels: temperature -->
  <text x="72" y="444" font-family="sans-serif" font-size="13" fill="#333333" text-anchor="end">−20</text>
  <text x="72" y="387" font-family="sans-serif" font-size="13" fill="#333333" text-anchor="end">0</text>
  <text x="72" y="101" font-family="sans-serif" font-size="13" fill="#333333" text-anchor="end">100</text>
  <text x="72" y="44" font-family="sans-serif" font-size="13" fill="#333333" text-anchor="end">120</text>
  <!-- tick labels: heat added -->
  <text x="80" y="458" font-family="sans-serif" font-size="13" fill="#333333" text-anchor="middle">0</text>
  <text x="233.7" y="458" font-family="sans-serif" font-size="13" fill="#333333" text-anchor="middle">79</text>
  <text x="671" y="458" font-family="sans-serif" font-size="13" fill="#333333" text-anchor="middle">305</text>
  <!-- heating curve: points computed from the unit README constants
       (100 g water; ice 2.09, water 4.18, steam 2.01 J/g C; fusion 334, vaporization 2260 J/g) -->
  <polyline points="80,440 88.1,382.9 152.7,382.9 233.7,97.1 671,97.1 678.8,40" fill="none" stroke="#0b5fa5" stroke-width="3" stroke-linejoin="round"/>
  <!-- segment labels -->
  <text x="120" y="370" font-family="sans-serif" font-size="13" fill="#0b5fa5">ice warms</text>
  <text x="120" y="410" font-family="sans-serif" font-size="13" fill="#0b5fa5">melting (0 °C)</text>
  <text x="180" y="230" font-family="sans-serif" font-size="13" fill="#0b5fa5">water warms</text>
  <text x="420" y="80" font-family="sans-serif" font-size="13" fill="#0b5fa5">boiling (100 °C)</text>
  <text x="600" y="30" font-family="sans-serif" font-size="13" fill="#0b5fa5">steam warms</text>
  <!-- energy annotations -->
  <text x="390" y="130" font-family="sans-serif" font-size="12" fill="#555555" text-anchor="middle">boiling takes 226 kJ — nearly 3/4 of the total 309 kJ</text>
  <text x="120" y="350" font-family="sans-serif" font-size="12" fill="#555555">melting: 33.4 kJ</text>
</svg>
