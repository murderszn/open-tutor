<svg xmlns="http://www.w3.org/2000/svg" width="600" height="280" viewBox="0 0 600 280" role="img" aria-labelledby="title desc">
  <title id="title">Two wave trains compared</title>
  <desc id="desc">Wave A at the top is tall with closely spaced crests. Wave B at the bottom is low with widely spaced crests. Arrows mark amplitude as height and wavelength as crest-to-crest spacing. Schematic, not to scale.</desc>
  <rect width="600" height="280" fill="#ffffff"/>
  <text x="20" y="22" font-family="sans-serif" font-size="16" font-weight="bold" fill="#111111">Wave A — taller amplitude, shorter wavelength</text>
  <line x1="20" y1="75" x2="580" y2="75" stroke="#999999" stroke-dasharray="6 4" stroke-width="1"/>
  <path d="M 20 75 Q 40 35 60 75 T 100 75 T 140 75 T 180 75 T 220 75 T 260 75 T 300 75 T 340 75 T 380 75 T 420 75 T 460 75 T 500 75 T 540 75 T 580 75" fill="none" stroke="#c0392b" stroke-width="3"/>
  <line x1="40" y1="35" x2="40" y2="75" stroke="#111111" stroke-width="1.5"/>
  <polygon points="40,35 36,43 44,43" fill="#111111"/>
  <polygon points="40,75 36,67 44,67" fill="#111111"/>
  <text x="50" y="60" font-family="sans-serif" font-size="14" fill="#111111">amplitude (height)</text>
  <line x1="40" y1="100" x2="80" y2="100" stroke="#111111" stroke-width="1.5"/>
  <polygon points="40,100 48,96 48,104" fill="#111111"/>
  <polygon points="80,100 72,96 72,104" fill="#111111"/>
  <text x="90" y="105" font-family="sans-serif" font-size="14" fill="#111111">wavelength (crest to crest)</text>
  <text x="20" y="145" font-family="sans-serif" font-size="16" font-weight="bold" fill="#111111">Wave B — smaller amplitude, longer wavelength</text>
  <line x1="20" y1="205" x2="580" y2="205" stroke="#999999" stroke-dasharray="6 4" stroke-width="1"/>
  <path d="M 20 205 Q 60 190 100 205 T 180 205 T 260 205 T 340 205 T 420 205 T 500 205 T 580 205" fill="none" stroke="#1f618d" stroke-width="3"/>
  <line x1="60" y1="190" x2="60" y2="205" stroke="#111111" stroke-width="1.5"/>
  <polygon points="60,190 56,198 64,198" fill="#111111"/>
  <polygon points="60,205 56,197 64,197" fill="#111111"/>
  <text x="70" y="200" font-family="sans-serif" font-size="14" fill="#111111">amplitude</text>
  <line x1="60" y1="230" x2="140" y2="230" stroke="#111111" stroke-width="1.5"/>
  <polygon points="60,230 68,226 68,234" fill="#111111"/>
  <polygon points="140,230 132,226 132,234" fill="#111111"/>
  <text x="150" y="235" font-family="sans-serif" font-size="14" fill="#111111">wavelength</text>
  <text x="20" y="265" font-family="sans-serif" font-size="13" fill="#555555">Schematic only — wave heights and spacings are not measured values.</text>
</svg>
