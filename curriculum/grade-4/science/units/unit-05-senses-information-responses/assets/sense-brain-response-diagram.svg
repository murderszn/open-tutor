<svg xmlns="http://www.w3.org/2000/svg" width="960" height="460" viewBox="0 0 960 460" role="img" aria-labelledby="svg-title svg-desc">
  <title id="svg-title">Sense to brain to response — the information path</title>
  <desc id="svg-desc">Three boxes joined by arrows, left to right: Senses pick up information, the Brain works out what the information means, the Body responds. An example underneath traces catching a ball: eyes see the ball coming, the brain works out where it will be, the hands catch it.</desc>
  <rect x="0" y="0" width="960" height="460" fill="#ffffff"/>
  <text x="480" y="42" text-anchor="middle" font-family="sans-serif" font-size="26" font-weight="bold" fill="#1a1a1a">How information travels: sense → brain → response</text>

  <!-- Box 1: Senses -->
  <rect x="30" y="80" width="260" height="170" rx="12" fill="#e8f4e8" stroke="#2e7d32" stroke-width="3"/>
  <text x="160" y="118" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#1b5e20">1. SENSES</text>
  <text x="160" y="152" text-anchor="middle" font-family="sans-serif" font-size="17" fill="#1a1a1a">pick up information</text>
  <text x="160" y="186" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#1a1a1a">eyes · ears · nose</text>
  <text x="160" y="212" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#1a1a1a">tongue · skin</text>

  <!-- Arrow 1 -->
  <line x1="292" y1="165" x2="348" y2="165" stroke="#1a1a1a" stroke-width="4"/>
  <polygon points="348,165 328,153 328,177" fill="#1a1a1a"/>

  <!-- Box 2: Brain -->
  <rect x="350" y="80" width="260" height="170" rx="12" fill="#e3edf7" stroke="#1565c0" stroke-width="3"/>
  <text x="480" y="118" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#0d47a1">2. BRAIN</text>
  <text x="480" y="152" text-anchor="middle" font-family="sans-serif" font-size="17" fill="#1a1a1a">works out what the</text>
  <text x="480" y="178" text-anchor="middle" font-family="sans-serif" font-size="17" fill="#1a1a1a">information means</text>
  <text x="480" y="212" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#1a1a1a">and what to do</text>

  <!-- Arrow 2 -->
  <line x1="612" y1="165" x2="668" y2="165" stroke="#1a1a1a" stroke-width="4"/>
  <polygon points="668,165 648,153 648,177" fill="#1a1a1a"/>

  <!-- Box 3: Response -->
  <rect x="670" y="80" width="260" height="170" rx="12" fill="#fdf0e3" stroke="#e65100" stroke-width="3"/>
  <text x="800" y="118" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#bf360c">3. RESPONSE</text>
  <text x="800" y="152" text-anchor="middle" font-family="sans-serif" font-size="17" fill="#1a1a1a">the body does</text>
  <text x="800" y="178" text-anchor="middle" font-family="sans-serif" font-size="17" fill="#1a1a1a">something</text>
  <text x="800" y="212" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#1a1a1a">freeze · flee · investigate</text>

  <!-- Example -->
  <rect x="30" y="290" width="900" height="130" rx="12" fill="#f5f5f5" stroke="#616161" stroke-width="2"/>
  <text x="480" y="322" text-anchor="middle" font-family="sans-serif" font-size="20" font-weight="bold" fill="#1a1a1a">Example: catching a ball</text>
  <text x="480" y="356" text-anchor="middle" font-family="sans-serif" font-size="17" fill="#1a1a1a">Eyes see the ball coming → Brain works out where it will be → Hands catch it.</text>
  <text x="480" y="390" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#1a1a1a">If any step is missing, the catch does not happen.</text>
</svg>
