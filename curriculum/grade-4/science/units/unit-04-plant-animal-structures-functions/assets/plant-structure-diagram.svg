<svg xmlns="http://www.w3.org/2000/svg" width="640" height="520" viewBox="0 0 640 520" role="img">
<title>Flowering plant with labeled parts: roots, stem, leaf, flower</title>
<desc>Schematic, not to scale. A flowering plant: branching roots below the soil line, a vertical stem, two broad leaves, and one flower at the top. Labels with leader lines name the roots, stem, leaf, and flower.</desc>
<rect x="0" y="0" width="640" height="360" fill="#dff2fb"/>
<rect x="0" y="360" width="640" height="160" fill="#8a5a32"/>
<line x1="0" y1="360" x2="640" y2="360" stroke="#5d3a1e" stroke-width="3"/>
<!-- stem -->
<line x1="320" y1="360" x2="320" y2="120" stroke="#2e7d32" stroke-width="10" stroke-linecap="round"/>
<!-- leaves -->
<path d="M320 220 Q240 190 210 150 Q280 140 320 185 Z" fill="#66bb6a" stroke="#2e7d32" stroke-width="2"/>
<path d="M320 280 Q400 250 430 210 Q360 200 320 245 Z" fill="#66bb6a" stroke="#2e7d32" stroke-width="2"/>
<!-- flower -->
<g>
<circle cx="320" cy="90" r="26" fill="#8d5a2b"/>
<circle cx="320" cy="52" r="16" fill="#ffeb3b"/>
<circle cx="352" cy="72" r="16" fill="#ffeb3b"/>
<circle cx="352" cy="108" r="16" fill="#ffeb3b"/>
<circle cx="320" cy="128" r="16" fill="#ffeb3b"/>
<circle cx="288" cy="108" r="16" fill="#ffeb3b"/>
<circle cx="288" cy="72" r="16" fill="#ffeb3b"/>
</g>
<!-- roots -->
<g stroke="#d7b89a" stroke-width="5" stroke-linecap="round" fill="none">
<path d="M320 360 L300 430 L270 470"/>
<path d="M320 360 L340 435 L370 475"/>
<path d="M320 360 L320 445"/>
<path d="M300 430 L275 450"/>
<path d="M340 435 L365 455"/>
</g>
<!-- labels -->
<g font-family="sans-serif" font-size="20" fill="#111111">
<line x1="320" y1="90" x2="480" y2="60" stroke="#111111" stroke-width="1.5"/>
<text x="490" y="66">Flower</text>
<line x1="430" y1="210" x2="480" y2="200" stroke="#111111" stroke-width="1.5"/>
<text x="490" y="206">Leaf</text>
<line x1="320" y1="240" x2="150" y2="240" stroke="#111111" stroke-width="1.5"/>
<text x="60" y="246">Stem</text>
<line x1="300" y1="430" x2="150" y2="460" stroke="#111111" stroke-width="1.5"/>
<text x="60" y="466">Roots</text>
</g>
<text x="320" y="505" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#5d3a1e">Schematic diagram, not to scale.</text>
</svg>
