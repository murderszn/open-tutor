<svg xmlns="http://www.w3.org/2000/svg" width="720" height="300" viewBox="0 0 720 300" role="img" aria-label="Three fraction strips of equal length: one half shaded, two quarters shaded, four eighths shaded, showing 1/2 equals 2/4 equals 4/8">
  <title>Fraction strip equivalence: 1/2 = 2/4 = 4/8</title>
  <rect x="0" y="0" width="720" height="300" fill="#ffffff"/>
  <!-- Row 1: halves -->
  <text x="20" y="52" font-family="sans-serif" font-size="20">1/2</text>
  <rect x="90" y="30" width="300" height="34" fill="#f4c542" stroke="#333333" stroke-width="2"/>
  <rect x="390" y="30" width="300" height="34" fill="#ffffff" stroke="#333333" stroke-width="2"/>
  <line x1="390" y1="30" x2="390" y2="64" stroke="#333333" stroke-width="2"/>
  <!-- Row 2: quarters -->
  <text x="20" y="142" font-family="sans-serif" font-size="20">2/4</text>
  <rect x="90" y="120" width="150" height="34" fill="#f4c542" stroke="#333333" stroke-width="2"/>
  <rect x="240" y="120" width="150" height="34" fill="#f4c542" stroke="#333333" stroke-width="2"/>
  <rect x="390" y="120" width="150" height="34" fill="#ffffff" stroke="#333333" stroke-width="2"/>
  <rect x="540" y="120" width="150" height="34" fill="#ffffff" stroke="#333333" stroke-width="2"/>
  <!-- Row 3: eighths -->
  <text x="20" y="232" font-family="sans-serif" font-size="20">4/8</text>
  <rect x="90" y="210" width="75" height="34" fill="#f4c542" stroke="#333333" stroke-width="2"/>
  <rect x="165" y="210" width="75" height="34" fill="#f4c542" stroke="#333333" stroke-width="2"/>
  <rect x="240" y="210" width="75" height="34" fill="#f4c542" stroke="#333333" stroke-width="2"/>
  <rect x="315" y="210" width="75" height="34" fill="#f4c542" stroke="#333333" stroke-width="2"/>
  <rect x="390" y="210" width="75" height="34" fill="#ffffff" stroke="#333333" stroke-width="2"/>
  <rect x="465" y="210" width="75" height="34" fill="#ffffff" stroke="#333333" stroke-width="2"/>
  <rect x="540" y="210" width="75" height="34" fill="#ffffff" stroke="#333333" stroke-width="2"/>
  <rect x="615" y="210" width="75" height="34" fill="#ffffff" stroke="#333333" stroke-width="2"/>
  <text x="90" y="280" font-family="sans-serif" font-size="20">Shaded length is the same in all three rows: 1/2 = 2/4 = 4/8.</text>
</svg>
