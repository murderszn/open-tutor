<svg xmlns="http://www.w3.org/2000/svg" width="560" height="330" viewBox="0 0 560 330" role="img" aria-label="Area model for 36 times 14: a rectangle 36 wide and 14 tall, split into 30 by 10 equals 300, 30 by 4 equals 120, 6 by 10 equals 60, and 6 by 4 equals 24, totaling 504.">
  <title>Area model for 36 × 14 = 504</title>
  <rect x="10" y="10" width="540" height="310" fill="#ffffff"/>
  <text x="280" y="38" text-anchor="middle" font-family="sans-serif" font-size="20" font-weight="bold">36 × 14 as an area model</text>
  <!-- Outer rectangle: widths 30 -> 375px, 6 -> 75px; heights 10 -> 150px, 4 -> 60px -->
  <g font-family="sans-serif" font-size="16">
    <text x="235" y="75" text-anchor="middle">30</text>
    <text x="465" y="75" text-anchor="middle">6</text>
    <text x="62" y="160" text-anchor="middle">10</text>
    <text x="62" y="250" text-anchor="middle">4</text>
    <rect x="90" y="85" width="375" height="150" fill="#dbeafe" stroke="#1e40af" stroke-width="2"/>
    <rect x="465" y="85" width="75" height="150" fill="#fef3c7" stroke="#1e40af" stroke-width="2"/>
    <rect x="90" y="235" width="375" height="60" fill="#dcfce7" stroke="#1e40af" stroke-width="2"/>
    <rect x="465" y="235" width="75" height="60" fill="#fee2e2" stroke="#1e40af" stroke-width="2"/>
    <text x="277" y="150" text-anchor="middle">30 × 10 = 300</text>
    <text x="502" y="150" text-anchor="middle" font-size="14">6 × 10</text>
    <text x="502" y="172" text-anchor="middle" font-size="14">= 60</text>
    <text x="277" y="268" text-anchor="middle">30 × 4 = 120</text>
    <text x="502" y="258" text-anchor="middle" font-size="14">6 × 4</text>
    <text x="502" y="280" text-anchor="middle" font-size="14">= 24</text>
  </g>
  <text x="280" y="312" text-anchor="middle" font-family="sans-serif" font-size="17" font-weight="bold">300 + 120 + 60 + 24 = 504</text>
</svg>
