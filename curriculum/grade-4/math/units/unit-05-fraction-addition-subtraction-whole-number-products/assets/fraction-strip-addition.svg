<svg xmlns="http://www.w3.org/2000/svg" width="700" height="230" viewBox="0 0 700 230" role="img" aria-label="Three equal-length fraction bars showing 3/8 plus 2/8 equals 5/8">
  <title>Fraction strip addition: 3/8 + 2/8 = 5/8</title>
  <desc>Three horizontal bars, each 600 units long and split into 8 equal parts of 75 units. The first bar has 3 parts shaded (225 units), the second has 2 parts shaded (150 units), and the third has 5 parts shaded (375 units). The shaded lengths prove 3/8 + 2/8 = 5/8.</desc>
  <style>
    .bar { fill: #ffffff; stroke: #222222; stroke-width: 2; }
    .shade { fill: #2f6fb2; }
    .tick { stroke: #222222; stroke-width: 1; }
    .label { font-family: sans-serif; font-size: 20px; fill: #222222; }
    .caption { font-family: sans-serif; font-size: 18px; fill: #222222; }
  </style>
  <!-- Row 1: 3/8 shaded (3 x 75 = 225) -->
  <text class="label" x="8" y="52">3/8</text>
  <rect class="bar" x="70" y="22" width="600" height="36"/>
  <rect class="shade" x="70" y="22" width="225" height="36"/>
  <line class="tick" x1="145" y1="22" x2="145" y2="58"/>
  <line class="tick" x1="220" y1="22" x2="220" y2="58"/>
  <line class="tick" x1="295" y1="22" x2="295" y2="58"/>
  <line class="tick" x1="370" y1="22" x2="370" y2="58"/>
  <line class="tick" x1="445" y1="22" x2="445" y2="58"/>
  <line class="tick" x1="520" y1="22" x2="520" y2="58"/>
  <line class="tick" x1="595" y1="22" x2="595" y2="58"/>
  <text class="label" x="678" y="52">+</text>
  <!-- Row 2: 2/8 shaded (2 x 75 = 150) -->
  <text class="label" x="8" y="118">2/8</text>
  <rect class="bar" x="70" y="88" width="600" height="36"/>
  <rect class="shade" x="70" y="88" width="150" height="36"/>
  <line class="tick" x1="145" y1="88" x2="145" y2="124"/>
  <line class="tick" x1="220" y1="88" x2="220" y2="124"/>
  <line class="tick" x1="295" y1="88" x2="295" y2="124"/>
  <line class="tick" x1="370" y1="88" x2="370" y2="124"/>
  <line class="tick" x1="445" y1="88" x2="445" y2="124"/>
  <line class="tick" x1="520" y1="88" x2="520" y2="124"/>
  <line class="tick" x1="595" y1="88" x2="595" y2="124"/>
  <text class="label" x="678" y="118">=</text>
  <!-- Row 3: 5/8 shaded (5 x 75 = 375) -->
  <text class="label" x="8" y="184">5/8</text>
  <rect class="bar" x="70" y="154" width="600" height="36"/>
  <rect class="shade" x="70" y="154" width="375" height="36"/>
  <line class="tick" x1="145" y1="154" x2="145" y2="190"/>
  <line class="tick" x1="220" y1="154" x2="220" y2="190"/>
  <line class="tick" x1="295" y1="154" x2="295" y2="190"/>
  <line class="tick" x1="370" y1="154" x2="370" y2="190"/>
  <line class="tick" x1="445" y1="154" x2="445" y2="190"/>
  <line class="tick" x1="520" y1="154" x2="520" y2="190"/>
  <line class="tick" x1="595" y1="154" x2="595" y2="190"/>
  <text class="caption" x="70" y="222">3/8 + 2/8 = 5/8 — three eighths joined with two eighths makes five eighths. The denominator stays 8.</text>
</svg>
