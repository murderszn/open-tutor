<svg xmlns="http://www.w3.org/2000/svg" width="720" height="360" viewBox="0 0 720 360" role="img" aria-label="Grid of the three levels of government by the three branches. National: Congress, President, Supreme Court. State: State legislature, Governor, State courts. Local: City council, Mayor, Local courts.">
  <title>Levels and branches of government — teaching diagram, not to scale</title>
  <rect x="0" y="0" width="720" height="360" fill="#ffffff"/>
  <text x="360" y="28" text-anchor="middle" font-family="sans-serif" font-size="18" font-weight="bold" fill="#222222">Levels and branches of government</text>
  <text x="360" y="48" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#555555">Teaching diagram — not to scale. Color is paired with words in every box.</text>
  <!-- column headers -->
  <text x="270" y="80" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="#1a5276">Legislative — makes laws</text>
  <text x="450" y="80" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="#7d6608">Executive — carries out laws</text>
  <text x="630" y="80" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="#6c3483">Judicial — explains laws</text>
  <!-- row labels -->
  <text x="20" y="140" font-family="sans-serif" font-size="14" font-weight="bold" fill="#222222">National</text>
  <text x="20" y="220" font-family="sans-serif" font-size="14" font-weight="bold" fill="#222222">State</text>
  <text x="20" y="300" font-family="sans-serif" font-size="14" font-weight="bold" fill="#222222">Local</text>
  <!-- grid boxes: 3 cols x 3 rows, each 170x60 -->
  <g font-family="sans-serif" font-size="13" fill="#222222" text-anchor="middle">
    <rect x="180" y="105" width="170" height="60" fill="#d6eaf8" stroke="#1a5276"/>
    <text x="265" y="130">Congress</text>
    <text x="265" y="150">House + Senate</text>
    <rect x="360" y="105" width="170" height="60" fill="#fef9e7" stroke="#7d6608"/>
    <text x="445" y="130">President</text>
    <text x="445" y="150">+ departments</text>
    <rect x="540" y="105" width="170" height="60" fill="#f4ecf7" stroke="#6c3483"/>
    <text x="625" y="130">Supreme Court</text>
    <text x="625" y="150">+ federal courts</text>
    <rect x="180" y="185" width="170" height="60" fill="#d6eaf8" stroke="#1a5276"/>
    <text x="265" y="210">State legislature</text>
    <text x="265" y="230">writes state laws</text>
    <rect x="360" y="185" width="170" height="60" fill="#fef9e7" stroke="#7d6608"/>
    <text x="445" y="210">Governor</text>
    <text x="445" y="230">leads the state</text>
    <rect x="540" y="185" width="170" height="60" fill="#f4ecf7" stroke="#6c3483"/>
    <text x="625" y="210">State courts</text>
    <text x="625" y="230">judges</text>
    <rect x="180" y="265" width="170" height="60" fill="#d6eaf8" stroke="#1a5276"/>
    <text x="265" y="290">City council</text>
    <text x="265" y="310">writes local laws</text>
    <rect x="360" y="265" width="170" height="60" fill="#fef9e7" stroke="#7d6608"/>
    <text x="445" y="290">Mayor</text>
    <text x="445" y="310">leads the city/town</text>
    <rect x="540" y="265" width="170" height="60" fill="#f4ecf7" stroke="#6c3483"/>
    <text x="625" y="290">Local courts</text>
    <text x="625" y="310">judges</text>
  </g>
</svg>
