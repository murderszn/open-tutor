<svg xmlns="http://www.w3.org/2000/svg" width="760" height="420" viewBox="0 0 760 420" role="img" aria-label="Schematic diagram of five exploration voyages: sponsor, landfall, and year for each">
<title>Exploration voyages schematic (not a geographic map)</title>
<rect x="10" y="10" width="740" height="400" fill="#ffffff" stroke="#333333" stroke-width="2"/>
<text x="380" y="40" text-anchor="middle" font-family="sans-serif" font-size="18" font-weight="bold">Five voyages — schematic only (no coastlines, no scale)</text>
<text x="380" y="62" text-anchor="middle" font-family="sans-serif" font-size="13">Read each arrow as: sponsor → landfall (year). Use an atlas for real geography.</text>
<g font-family="sans-serif" font-size="15">
<text x="40" y="115">Spain → Caribbean (1492, Columbus)</text>
<line x1="330" y1="110" x2="560" y2="110" stroke="#333333" stroke-width="2" marker-end="url(#arrow)"/>
<text x="40" y="165">England → Newfoundland (1497, Cabot)</text>
<line x1="360" y1="160" x2="560" y2="160" stroke="#333333" stroke-width="2" marker-end="url(#arrow)"/>
<text x="40" y="215">France → St. Lawrence (1534, Cartier)</text>
<line x1="360" y1="210" x2="560" y2="210" stroke="#333333" stroke-width="2" marker-end="url(#arrow)"/>
<text x="40" y="265">Spain → Mississippi (1541, de Soto)</text>
<line x1="360" y1="260" x2="560" y2="260" stroke="#333333" stroke-width="2" marker-end="url(#arrow)"/>
<text x="40" y="315">Netherlands → Hudson River (1609, Hudson)</text>
<line x1="400" y1="310" x2="560" y2="310" stroke="#333333" stroke-width="2" marker-end="url(#arrow)"/>
</g>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#333333"/></marker></defs>
<text x="380" y="360" text-anchor="middle" font-family="sans-serif" font-size="13">None of the five reached Asia. See the Lesson 02 table for sought and found.</text>
<text x="380" y="385" text-anchor="middle" font-family="sans-serif" font-size="13">Peoples already lived in every landfall region.</text>
</svg>
