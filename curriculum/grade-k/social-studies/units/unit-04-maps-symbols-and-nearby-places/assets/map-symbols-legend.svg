<svg xmlns="http://www.w3.org/2000/svg" width="900" height="660" viewBox="0 0 900 660" role="img" aria-labelledby="title desc">
  <title id="title">Our map symbols — printable legend sheet</title>
  <desc id="desc">Eleven simple map symbols: table, rug, door, window, bookshelf in the top row; plant, tree, road, water, land in the middle row; and a star for treasure in the bottom row. Each symbol has a printed label beneath it.</desc>
  <rect x="0" y="0" width="900" height="660" fill="#ffffff"/>
  <text x="450" y="40" text-anchor="middle" font-family="sans-serif" font-size="30" font-weight="bold" fill="#1a1a1a">Our map symbols</text>
  <text x="450" y="70" text-anchor="middle" font-family="sans-serif" font-size="17" fill="#444444">Draw these on your map. The legend says what each one means.</text>
  <g font-family="sans-serif" font-size="19" text-anchor="middle" fill="#1a1a1a">
    <!-- Row 1 -->
    <g>
      <circle cx="80" cy="150" r="42" fill="#f2c063" stroke="#1a1a1a" stroke-width="3"/>
      <circle cx="80" cy="150" r="10" fill="#1a1a1a"/>
      <text x="80" y="225">table</text>
    </g>
    <g>
      <circle cx="240" cy="150" r="42" fill="none" stroke="#e53935" stroke-width="8"/>
      <circle cx="240" cy="150" r="26" fill="none" stroke="#fb8c00" stroke-width="7"/>
      <circle cx="240" cy="150" r="12" fill="#7e57c2"/>
      <text x="240" y="225">rug</text>
    </g>
    <g>
      <rect x="360" y="110" width="80" height="80" fill="#d7ccc8" stroke="#1a1a1a" stroke-width="3"/>
      <rect x="392" y="110" width="16" height="80" fill="#ffffff" stroke="#1a1a1a" stroke-width="3"/>
      <text x="400" y="225">door</text>
    </g>
    <g>
      <rect x="520" y="110" width="80" height="80" fill="#90caf9" stroke="#1a1a1a" stroke-width="3"/>
      <line x1="560" y1="110" x2="560" y2="190" stroke="#1a1a1a" stroke-width="3"/>
      <line x1="520" y1="150" x2="600" y2="150" stroke="#1a1a1a" stroke-width="3"/>
      <text x="560" y="225">window</text>
    </g>
    <g>
      <rect x="680" y="118" width="110" height="64" fill="#8d6e63" stroke="#1a1a1a" stroke-width="3"/>
      <rect x="690" y="128" width="12" height="44" fill="#e53935"/><rect x="706" y="128" width="12" height="44" fill="#fb8c00"/>
      <rect x="722" y="128" width="12" height="44" fill="#43a047"/><rect x="738" y="128" width="12" height="44" fill="#1e88e5"/>
      <rect x="754" y="128" width="12" height="44" fill="#7e57c2"/><rect x="770" y="128" width="12" height="44" fill="#fdd835"/>
      <text x="735" y="225">bookshelf</text>
    </g>
    <!-- Row 2 -->
    <g>
      <circle cx="80" cy="380" r="30" fill="#8d6e63" stroke="#1a1a1a" stroke-width="3"/>
      <ellipse cx="80" cy="348" rx="34" ry="20" fill="#43a047" stroke="#1a1a1a" stroke-width="3"/>
      <text x="80" y="445">plant</text>
    </g>
    <g>
      <circle cx="240" cy="360" r="34" fill="#43a047" stroke="#1a1a1a" stroke-width="3"/>
      <rect x="234" y="392" width="12" height="28" fill="#8d6e63" stroke="#1a1a1a" stroke-width="2"/>
      <text x="240" y="445">tree</text>
    </g>
    <g>
      <rect x="360" y="330" width="80" height="80" fill="#bdbdbd" stroke="#1a1a1a" stroke-width="3"/>
      <line x1="400" y1="330" x2="400" y2="410" stroke="#ffffff" stroke-width="5" stroke-dasharray="14 10"/>
      <text x="400" y="445">road</text>
    </g>
    <g>
      <path d="M 520 345 Q 540 330 560 345 T 600 345 T 640 345" fill="none" stroke="#1e88e5" stroke-width="8" stroke-linecap="round"/>
      <path d="M 520 375 Q 540 360 560 375 T 600 375 T 640 375" fill="none" stroke="#1e88e5" stroke-width="8" stroke-linecap="round"/>
      <text x="580" y="445">water</text>
    </g>
    <g>
      <rect x="690" y="330" width="90" height="80" fill="#a5d6a7" stroke="#1a1a1a" stroke-width="3"/>
      <circle cx="720" cy="360" r="12" fill="#43a047"/><circle cx="755" cy="385" r="10" fill="#43a047"/>
      <text x="735" y="445">land</text>
    </g>
    <g>
      <polygon points="450,300 464,338 504,340 472,364 484,402 450,380 416,402 428,364 396,340 436,338" fill="#fdd835" stroke="#1a1a1a" stroke-width="3" transform="translate(0,180)"/>
      <text x="450" y="615">treasure (star)</text>
    </g>
  </g>
  <text x="450" y="645" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#444444">Printable teaching aid for Unit 04. Symbols are simple on purpose — your map's legend is what makes them mean something.</text>
</svg>
