<svg xmlns="http://www.w3.org/2000/svg" width="640" height="300" viewBox="0 0 640 300" role="img" aria-labelledby="title desc">
  <title id="title">Three levels of government</title>
  <desc id="desc">Three stacked boxes, widest at the bottom. Top, smallest: National government, whole country, example job: printing money. Middle: State government, one state, example job: driver's licenses. Bottom, widest: Local government, one town or city, example job: fixing potholes and running the library.</desc>
  <rect x="170" y="20" width="300" height="70" fill="#dbeafe" stroke="#1e40af" stroke-width="2"/>
  <text x="320" y="48" text-anchor="middle" font-family="sans-serif" font-size="18" font-weight="bold" fill="#1e3a5f">NATIONAL government</text>
  <text x="320" y="72" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#1e3a5f">Whole country — example: printing money</text>
  <rect x="120" y="115" width="400" height="70" fill="#dcfce7" stroke="#166534" stroke-width="2"/>
  <text x="320" y="143" text-anchor="middle" font-family="sans-serif" font-size="18" font-weight="bold" fill="#14532d">STATE government</text>
  <text x="320" y="167" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#14532d">One state — example: driver's licenses</text>
  <rect x="70" y="210" width="500" height="70" fill="#fef3c7" stroke="#92400e" stroke-width="2"/>
  <text x="320" y="238" text-anchor="middle" font-family="sans-serif" font-size="18" font-weight="bold" fill="#78350f">LOCAL government</text>
  <text x="320" y="262" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#78350f">One town or city — example: fixing potholes, running the library</text>
</svg>
