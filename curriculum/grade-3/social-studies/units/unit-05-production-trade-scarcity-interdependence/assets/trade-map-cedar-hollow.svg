<svg xmlns="http://www.w3.org/2000/svg" width="900" height="560" viewBox="0 0 900 560" role="img" aria-labelledby="trade-map-title trade-map-desc">
  <title id="trade-map-title">Cedar Hollow trade map (fictional practice map)</title>
  <desc id="trade-map-desc">A fictional practice map, not to scale. Cedar Hollow sits in the middle. To the south is Sunnyvale: an arrow from Sunnyvale to Cedar Hollow is labeled oranges, and an arrow back is labeled bread and apples. To the north is Hilltop: an arrow from Hilltop to Cedar Hollow is labeled wool, and an arrow back is labeled cloth. To the west is the Mill Town on the river: an arrow to Cedar Hollow is labeled flour, and an arrow back is labeled bread. A dashed line labeled railroad (since 1910) runs through Cedar Hollow.</desc>
  <rect x="0" y="0" width="900" height="560" fill="#f7f3e8"/>
  <text x="450" y="34" text-anchor="middle" font-family="sans-serif" font-size="22" font-weight="bold" fill="#333333">Cedar Hollow Trade Map</text>
  <text x="450" y="58" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#666666">Fictional practice map — not to scale</text>

  <!-- River -->
  <path d="M 60 470 C 200 420, 320 500, 470 460 S 700 380, 850 430" fill="none" stroke="#7fb3d5" stroke-width="14" stroke-linecap="round" opacity="0.7"/>
  <text x="80" y="500" font-family="sans-serif" font-size="13" fill="#2e6f9e">River</text>

  <!-- Railroad (dashed) -->
  <line x1="60" y1="280" x2="840" y2="280" stroke="#8a6d3b" stroke-width="4" stroke-dasharray="12 8"/>
  <text x="700" y="268" font-family="sans-serif" font-size="13" fill="#8a6d3b">railroad (since 1910)</text>

  <!-- Mill Town (west) -->
  <g>
    <rect x="90" y="230" width="170" height="100" rx="10" fill="#e8dcc3" stroke="#8a6d3b" stroke-width="2"/>
    <text x="175" y="262" text-anchor="middle" font-family="sans-serif" font-size="17" font-weight="bold" fill="#333333">Mill Town</text>
    <text x="175" y="286" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#555555">on the river</text>
    <text x="175" y="310" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#555555">grinds wheat into flour</text>
  </g>

  <!-- Cedar Hollow (center) -->
  <g>
    <rect x="365" y="230" width="170" height="100" rx="10" fill="#f9d976" stroke="#b8860b" stroke-width="3"/>
    <text x="450" y="262" text-anchor="middle" font-family="sans-serif" font-size="17" font-weight="bold" fill="#333333">Cedar Hollow</text>
    <text x="450" y="286" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#555555">market town</text>
    <text x="450" y="310" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#555555">bread, apples, cloth</text>
  </g>

  <!-- Hilltop (north) -->
  <g>
    <rect x="365" y="90" width="170" height="80" rx="10" fill="#d5e8d4" stroke="#4a7c59" stroke-width="2"/>
    <text x="450" y="120" text-anchor="middle" font-family="sans-serif" font-size="17" font-weight="bold" fill="#333333">Hilltop</text>
    <text x="450" y="144" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#555555">raises sheep for wool</text>
  </g>

  <!-- Sunnyvale (south) -->
  <g>
    <rect x="365" y="400" width="170" height="80" rx="10" fill="#ffe0b3" stroke="#c47f17" stroke-width="2"/>
    <text x="450" y="430" text-anchor="middle" font-family="sans-serif" font-size="17" font-weight="bold" fill="#333333">Sunnyvale</text>
    <text x="450" y="454" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#555555">grows oranges</text>
  </g>

  <!-- Arrows: Mill Town <-> Cedar Hollow -->
  <g font-family="sans-serif" font-size="14" fill="#333333">
    <line x1="262" y1="262" x2="362" y2="262" stroke="#333333" stroke-width="2" marker-end="url(#arrow)"/>
    <text x="312" y="250" text-anchor="middle">flour &#8594;</text>
    <line x1="362" y1="300" x2="262" y2="300" stroke="#333333" stroke-width="2" marker-end="url(#arrow)"/>
    <text x="312" y="322" text-anchor="middle">&#8592; bread</text>
  </g>

  <!-- Arrows: Hilltop <-> Cedar Hollow -->
  <g font-family="sans-serif" font-size="14" fill="#333333">
    <line x1="430" y1="172" x2="430" y2="228" stroke="#333333" stroke-width="2" marker-end="url(#arrow)"/>
    <text x="500" y="200" text-anchor="start">wool &#8595;</text>
    <line x1="472" y1="228" x2="472" y2="172" stroke="#333333" stroke-width="2" marker-end="url(#arrow)"/>
    <text x="486" y="200" text-anchor="start">&#8593; cloth</text>
  </g>

  <!-- Arrows: Sunnyvale <-> Cedar Hollow -->
  <g font-family="sans-serif" font-size="14" fill="#333333">
    <line x1="430" y1="398" x2="430" y2="332" stroke="#333333" stroke-width="2" marker-end="url(#arrow)"/>
    <text x="500" y="366" text-anchor="start">oranges &#8593;</text>
    <line x1="472" y1="332" x2="472" y2="398" stroke="#333333" stroke-width="2" marker-end="url(#arrow)"/>
    <text x="486" y="366" text-anchor="start">&#8595; bread and apples</text>
  </g>

  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#333333"/>
    </marker>
  </defs>

  <text x="450" y="530" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#666666">Arrows show what travels each way. Every place sends something and receives something.</text>
</svg>
