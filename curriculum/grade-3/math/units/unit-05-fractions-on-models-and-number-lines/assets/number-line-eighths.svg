<svg xmlns="http://www.w3.org/2000/svg" width="720" height="140" viewBox="0 0 720 140" role="img" aria-label="Number line from 0 to 1 divided into 8 equal parts, with 3/8 and 5/8 marked">
  <title>Number line from 0 to 1 in eighths, marking 3/8 and 5/8</title>
  <desc>Deterministic diagram for Grade 3 Math Unit 05. The interval from 0 to 1 is split into 8 equal parts. The points 3/8 and 5/8 are marked with dots; each part has size 1/8.</desc>
  <rect width="720" height="140" fill="#ffffff"/>
  <!-- baseline -->
  <line x1="60" y1="70" x2="660" y2="70" stroke="#111111" stroke-width="2"/>
  <!-- ticks: 0 to 1 in eighths; 60 + i*75 -->
  <g stroke="#111111" stroke-width="2">
    <line x1="60" y1="60" x2="60" y2="80"/>
    <line x1="135" y1="64" x2="135" y2="76"/>
    <line x1="210" y1="64" x2="210" y2="76"/>
    <line x1="285" y1="64" x2="285" y2="76"/>
    <line x1="360" y1="64" x2="360" y2="76"/>
    <line x1="435" y1="64" x2="435" y2="76"/>
    <line x1="510" y1="64" x2="510" y2="76"/>
    <line x1="585" y1="64" x2="585" y2="76"/>
    <line x1="660" y1="60" x2="660" y2="80"/>
  </g>
  <!-- labels -->
  <g font-family="sans-serif" font-size="16" fill="#111111" text-anchor="middle">
    <text x="60" y="105">0</text>
    <text x="135" y="105">1/8</text>
    <text x="210" y="105">2/8</text>
    <text x="285" y="105">3/8</text>
    <text x="360" y="105">4/8</text>
    <text x="435" y="105">5/8</text>
    <text x="510" y="105">6/8</text>
    <text x="585" y="105">7/8</text>
    <text x="660" y="105">1</text>
  </g>
  <!-- marked points: 3/8 and 5/8 -->
  <circle cx="285" cy="70" r="7" fill="#b3001b" stroke="#111111" stroke-width="1.5"/>
  <circle cx="435" cy="70" r="7" fill="#b3001b" stroke="#111111" stroke-width="1.5"/>
  <g font-family="sans-serif" font-size="15" fill="#b3001b" text-anchor="middle" font-weight="bold">
    <text x="285" y="40">3/8</text>
    <text x="435" y="40">5/8</text>
  </g>
  <text x="360" y="130" font-family="sans-serif" font-size="13" fill="#444444" text-anchor="middle">Each part has size 1/8. Count jumps from 0: 3 jumps land on 3/8; 5 jumps land on 5/8.</text>
</svg>
