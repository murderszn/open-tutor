<svg xmlns="http://www.w3.org/2000/svg" width="720" height="240" viewBox="0 0 720 240" role="img" aria-label="Two-step problem map: Step 1, Step 2, Check">
  <rect width="720" height="240" fill="#fdf6e3"/>
  <text x="360" y="30" text-anchor="middle" font-family="sans-serif" font-size="20" font-weight="bold">Two-step problem map</text>
  <rect x="20" y="60" width="190" height="110" rx="10" fill="#dbeafe" stroke="#1d4ed8"/>
  <text x="115" y="90" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="bold">STEP 1</text>
  <text x="115" y="115" text-anchor="middle" font-family="sans-serif" font-size="15">3 baskets × 3 packs</text>
  <text x="115" y="140" text-anchor="middle" font-family="sans-serif" font-size="15">= 9 packs</text>
  <text x="225" y="125" font-family="sans-serif" font-size="28">→</text>
  <rect x="265" y="60" width="190" height="110" rx="10" fill="#dcfce7" stroke="#15803d"/>
  <text x="360" y="90" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="bold">STEP 2</text>
  <text x="360" y="115" text-anchor="middle" font-family="sans-serif" font-size="15">9 packs × 5 pencils</text>
  <text x="360" y="140" text-anchor="middle" font-family="sans-serif" font-size="15">= 45 pencils</text>
  <text x="470" y="125" font-family="sans-serif" font-size="28">→</text>
  <rect x="510" y="60" width="190" height="110" rx="10" fill="#fef3c7" stroke="#b45309"/>
  <text x="605" y="90" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="bold">CHECK</text>
  <text x="605" y="115" text-anchor="middle" font-family="sans-serif" font-size="15">45 ÷ 5 = 9 packs ✓</text>
  <text x="605" y="140" text-anchor="middle" font-family="sans-serif" font-size="15">Estimate: about 50 ✓</text>
  <text x="360" y="205" text-anchor="middle" font-family="sans-serif" font-size="15">Read the question first. One step at a time. Check the answer last.</text>
</svg>
