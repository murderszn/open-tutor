<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 170" role="img" aria-labelledby="svgTitle svgDesc">
  <title id="svgTitle">Number line from 230 to 260</title>
  <desc id="svgDesc">A horizontal number line marked in tens from 230 to 260. A red halfway marker sits at 245 between 240 and 250. A blue dot marks 248, which is past halfway and closer to 250.</desc>
  <rect x="0" y="0" width="800" height="170" fill="#ffffff"/>
  <!-- Scale: 230 at x=60, 260 at x=740 => 22.6667 px per unit -->
  <line x1="60" y1="90" x2="740" y2="90" stroke="#1a1a1a" stroke-width="3"/>
  <polygon points="740,90 724,82 724,98" fill="#1a1a1a"/>
  <g font-family="sans-serif" font-size="20" text-anchor="middle" fill="#1a1a1a">
    <line x1="60" y1="78" x2="60" y2="102" stroke="#1a1a1a" stroke-width="2"/>
    <text x="60" y="135">230</text>
    <line x1="287" y1="78" x2="287" y2="102" stroke="#1a1a1a" stroke-width="2"/>
    <text x="287" y="135">240</text>
    <line x1="400" y1="74" x2="400" y2="106" stroke="#c0392b" stroke-width="4"/>
    <text x="400" y="135" fill="#c0392b">245</text>
    <text x="400" y="58" fill="#c0392b" font-size="16">halfway</text>
    <line x1="513" y1="78" x2="513" y2="102" stroke="#1a1a1a" stroke-width="2"/>
    <text x="513" y="135">250</text>
    <line x1="740" y1="78" x2="740" y2="102" stroke="#1a1a1a" stroke-width="2"/>
    <text x="740" y="135">260</text>
  </g>
  <circle cx="468" cy="90" r="9" fill="#2471a3"/>
  <text x="468" y="58" font-family="sans-serif" font-size="16" text-anchor="middle" fill="#2471a3">248</text>
  <text x="400" y="163" font-family="sans-serif" font-size="15" text-anchor="middle" fill="#555555">248 is past halfway (245), so 248 rounds up to 250.</text>
</svg>
