<svg xmlns="http://www.w3.org/2000/svg" width="720" height="380" viewBox="0 0 720 380" role="img" aria-label="Left: vector from origin to (3,4) with horizontal component 3, vertical component 4, and magnitude 5. Right: polar grid with circles of radius 1, 2, 3 and a point at radius 2 and angle 60 degrees.">
  <rect width="720" height="380" fill="white"/>
  <text x="20" y="28" font-family="sans-serif" font-size="18" font-weight="bold">Vector components (left) and polar grid (right)</text>
  <!-- Left: axes -->
  <line x1="40" y1="320" x2="330" y2="320" stroke="#333" stroke-width="2"/>
  <line x1="60" y1="340" x2="60" y2="40" stroke="#333" stroke-width="2"/>
  <!-- Vector (3,4) scaled: 60 px per unit, origin (60,320), point (240,200) -->
  <line x1="60" y1="320" x2="240" y2="200" stroke="#c0392b" stroke-width="3"/>
  <polygon points="240,200 226,202 232,214" fill="#c0392b"/>
  <!-- Components -->
  <line x1="60" y1="320" x2="240" y2="320" stroke="#2471a3" stroke-width="2" stroke-dasharray="6,4"/>
  <line x1="240" y1="320" x2="240" y2="200" stroke="#2471a3" stroke-width="2" stroke-dasharray="6,4"/>
  <text x="140" y="340" font-family="sans-serif" font-size="15">a = 3</text>
  <text x="250" y="265" font-family="sans-serif" font-size="15">b = 4</text>
  <text x="130" y="245" font-family="sans-serif" font-size="15" fill="#c0392b">|v| = 5</text>
  <text x="40" y="365" font-family="sans-serif" font-size="13">v = &lt;3, 4&gt;, direction arctan(4/3) ≈ 53.1°</text>
  <!-- Right: polar grid, center (520,190), 40 px per unit -->
  <circle cx="520" cy="190" r="40" fill="none" stroke="#999" stroke-width="1"/>
  <circle cx="520" cy="190" r="80" fill="none" stroke="#999" stroke-width="1"/>
  <circle cx="520" cy="190" r="120" fill="none" stroke="#999" stroke-width="1"/>
  <line x1="380" y1="190" x2="660" y2="190" stroke="#333" stroke-width="1"/>
  <line x1="520" y1="50" x2="520" y2="330" stroke="#333" stroke-width="1"/>
  <!-- Point at r=2, theta=60 deg: (520+80*cos60, 190-80*sin60) = (560, 121) -->
  <line x1="520" y1="190" x2="560" y2="121" stroke="#c0392b" stroke-width="3"/>
  <circle cx="560" cy="121" r="6" fill="#c0392b"/>
  <text x="570" y="115" font-family="sans-serif" font-size="15" fill="#c0392b">(2, 60°)</text>
  <text x="400" y="365" font-family="sans-serif" font-size="13">Polar point (r, θ) = (2, 60°); circles r = 1, 2, 3</text>
</svg>
