<svg xmlns="http://www.w3.org/2000/svg" width="760" height="460" viewBox="0 0 760 460" role="img" aria-label="Simplified global-mean energy budget diagram">
  <title>Simplified global-mean energy budget, rounded values</title>
  <rect x="0" y="0" width="760" height="460" fill="#eaf2f8"/>
  <text x="380" y="30" text-anchor="middle" font-family="sans-serif" font-size="20" font-weight="bold">Simplified global-mean energy budget (rounded values)</text>
  <!-- Sun -->
  <circle cx="90" cy="90" r="42" fill="#f7c948"/>
  <text x="90" y="96" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="bold">Sun</text>
  <!-- Incoming arrow -->
  <line x1="150" y1="120" x2="330" y2="200" stroke="#b7791f" stroke-width="4" marker-end="url(#arrow)"/>
  <text x="200" y="150" font-family="sans-serif" font-size="16" font-weight="bold">Incoming 340 W/m²</text>
  <!-- Reflected arrow -->
  <line x1="330" y1="210" x2="150" y2="110" stroke="#5b7fa6" stroke-width="4" marker-end="url(#arrow)"/>
  <text x="60" y="180" font-family="sans-serif" font-size="15">Reflected 102 W/m²</text>
  <text x="60" y="200" font-family="sans-serif" font-size="13">(albedo about 0.30)</text>
  <!-- Atmosphere band -->
  <rect x="300" y="210" width="300" height="60" fill="#cfe3f5" stroke="#5b7fa6" stroke-width="2"/>
  <text x="450" y="246" text-anchor="middle" font-family="sans-serif" font-size="15">Atmosphere: greenhouse gases</text>
  <!-- Absorbed -->
  <text x="620" y="240" font-family="sans-serif" font-size="15" font-weight="bold">Absorbed 238 W/m²</text>
  <!-- Surface -->
  <rect x="300" y="330" width="300" height="50" fill="#8a6d3b"/>
  <text x="450" y="360" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#ffffff">Earth's surface</text>
  <!-- Surface emission arrow up -->
  <line x1="420" y1="330" x2="420" y2="275" stroke="#c0392b" stroke-width="4" marker-end="url(#arrow)"/>
  <text x="120" y="300" font-family="sans-serif" font-size="15">Surface emits about 390 W/m²</text>
  <!-- Downward return arrow -->
  <line x1="480" y1="275" x2="480" y2="325" stroke="#c0392b" stroke-width="3" stroke-dasharray="6 4" marker-end="url(#arrow)"/>
  <text x="500" y="305" font-family="sans-serif" font-size="14">part returned downward</text>
  <!-- Outgoing LW arrow -->
  <line x1="560" y1="210" x2="660" y2="120" stroke="#c0392b" stroke-width="4" marker-end="url(#arrow)"/>
  <text x="560" y="100" font-family="sans-serif" font-size="15" font-weight="bold">Outgoing infrared 238 W/m²</text>
  <text x="380" y="420" text-anchor="middle" font-family="sans-serif" font-size="13">Balance: 340 in = 102 reflected + 238 out as infrared. Surface emission (390) is not the flux leaving to space.</text>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#333333"/>
    </marker>
  </defs>
</svg>
