<svg xmlns="http://www.w3.org/2000/svg" width="900" height="520" viewBox="0 0 900 520" role="img" aria-labelledby="bc-title bc-desc">
  <title id="bc-title">Schematic business-cycle diagram</title>
  <desc id="bc-desc">A wavy line showing real GDP rising and falling around a straight upward-sloping dashed trend line. The phases are labeled: expansion on the rising part of the wave, peak at the crest, contraction on the falling part, and trough at the lowest point. The vertical axis is labeled Real GDP and the horizontal axis is labeled Time. Schematic only — not real data.</desc>
  <rect x="0" y="0" width="900" height="520" fill="#ffffff"/>
  <!-- Plot area -->
  <line x1="90" y1="60" x2="90" y2="440" stroke="#333333" stroke-width="2"/>
  <line x1="90" y1="440" x2="840" y2="440" stroke="#333333" stroke-width="2"/>
  <text x="30" y="250" font-family="sans-serif" font-size="18" fill="#333333" transform="rotate(-90 30 250)" text-anchor="middle">Real GDP</text>
  <text x="465" y="480" font-family="sans-serif" font-size="18" fill="#333333" text-anchor="middle">Time</text>
  <!-- Long-run trend (dashed) -->
  <line x1="90" y1="360" x2="840" y2="180" stroke="#888888" stroke-width="2" stroke-dasharray="10 8"/>
  <text x="700" y="170" font-family="sans-serif" font-size="16" fill="#555555">Long-run trend (potential GDP)</text>
  <!-- Business cycle wave: expansion, peak, contraction, trough, expansion -->
  <path d="M 90 360
           C 160 360, 190 240, 260 240
           C 330 240, 350 340, 420 340
           C 490 340, 510 200, 580 200
           C 650 200, 670 300, 740 300
           C 790 300, 810 220, 840 220"
        fill="none" stroke="#b3402a" stroke-width="3"/>
  <!-- Phase labels -->
  <text x="180" y="290" font-family="sans-serif" font-size="17" fill="#1a5276" text-anchor="middle">Expansion</text>
  <text x="255" y="215" font-family="sans-serif" font-size="17" font-weight="bold" fill="#1a5276" text-anchor="middle">Peak</text>
  <circle cx="260" cy="240" r="6" fill="#1a5276"/>
  <text x="340" y="330" font-family="sans-serif" font-size="17" fill="#1a5276" text-anchor="middle">Contraction</text>
  <text x="420" y="375" font-family="sans-serif" font-size="17" font-weight="bold" fill="#1a5276" text-anchor="middle">Trough</text>
  <circle cx="420" cy="340" r="6" fill="#1a5276"/>
  <text x="545" y="250" font-family="sans-serif" font-size="17" fill="#1a5276" text-anchor="middle">Expansion</text>
  <text x="580" y="175" font-family="sans-serif" font-size="17" font-weight="bold" fill="#1a5276" text-anchor="middle">Peak</text>
  <circle cx="580" cy="200" r="6" fill="#1a5276"/>
  <text x="705" y="290" font-family="sans-serif" font-size="17" fill="#1a5276" text-anchor="middle">Contraction</text>
  <text x="740" y="335" font-family="sans-serif" font-size="17" font-weight="bold" fill="#1a5276" text-anchor="middle">Trough</text>
  <circle cx="740" cy="300" r="6" fill="#1a5276"/>
  <text x="465" y="515" font-family="sans-serif" font-size="14" fill="#555555" text-anchor="middle">Schematic only — not real data. Real expansions and contractions are irregular in length.</text>
</svg>
