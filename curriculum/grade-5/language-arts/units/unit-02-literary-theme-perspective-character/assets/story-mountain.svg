<svg xmlns="http://www.w3.org/2000/svg" width="640" height="360" viewBox="0 0 640 360" role="img" aria-labelledby="sm-title sm-desc">
<title id="sm-title">Story mountain for "The Broken Kite"</title>
<desc id="sm-desc">A triangular plot diagram. Exposition at the lower left: Sam builds the red kite for eleven days. Rising action climbs: the festival flight, the crash into the oak, Sam hiding the broken kite. Climax at the peak: Ms. Okafor says Bring it here, and Sam lays the kite on the table. Falling action descends: the repair, Sam doing the last knot. Resolution at the lower right: the kite flies past the oak.</desc>
<rect width="640" height="360" fill="#ffffff"/>
<!-- mountain -->
<polyline points="60,300 320,60 580,300" fill="none" stroke="#333333" stroke-width="3"/>
<!-- exposition -->
<circle cx="60" cy="300" r="7" fill="#b00020"/>
<text x="60" y="330" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="bold">Exposition</text>
<text x="60" y="346" text-anchor="middle" font-family="sans-serif" font-size="11">Sam builds the red kite</text>
<!-- rising action -->
<circle cx="190" cy="180" r="7" fill="#b00020"/>
<text x="190" y="160" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="bold">Rising action</text>
<text x="190" y="146" text-anchor="middle" font-family="sans-serif" font-size="11">Flight, crash, hiding</text>
<!-- climax -->
<circle cx="320" cy="60" r="9" fill="#b00020"/>
<text x="320" y="36" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="bold">Climax</text>
<text x="320" y="22" text-anchor="middle" font-family="sans-serif" font-size="11">"Bring it here" — Sam asks</text>
<!-- falling action -->
<circle cx="450" cy="180" r="7" fill="#b00020"/>
<text x="450" y="160" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="bold">Falling action</text>
<text x="450" y="146" text-anchor="middle" font-family="sans-serif" font-size="11">The repair, last knot</text>
<!-- resolution -->
<circle cx="580" cy="300" r="7" fill="#b00020"/>
<text x="580" y="330" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="bold">Resolution</text>
<text x="580" y="346" text-anchor="middle" font-family="sans-serif" font-size="11">Kite flies past the oak</text>
</svg>
