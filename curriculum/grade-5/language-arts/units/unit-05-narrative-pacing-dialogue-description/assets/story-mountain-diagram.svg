<svg xmlns="http://www.w3.org/2000/svg" width="600" height="320" viewBox="0 0 600 320" role="img" aria-labelledby="sm-title sm-desc">
  <title id="sm-title">Story mountain</title>
  <desc id="sm-desc">A mountain shape rising from left to right and falling again. Six labeled points mark the stages: Exposition at the bottom left, Inciting incident on the lower rising slope, Rising action on the rising slope, Climax at the peak, Falling action on the falling slope, and Resolution at the bottom right.</desc>
  <rect width="600" height="320" fill="#ffffff"/>
  <!-- baseline -->
  <line x1="30" y1="280" x2="570" y2="280" stroke="#999999" stroke-width="1.5"/>
  <!-- mountain -->
  <path d="M30 280 L130 280 L210 205 L300 70 L390 195 L480 280 L570 280" fill="none" stroke="#333333" stroke-width="3" stroke-linejoin="round"/>
  <!-- stage points -->
  <circle cx="80" cy="280" r="5" fill="#333333"/>
  <circle cx="170" cy="242" r="5" fill="#333333"/>
  <circle cx="250" cy="145" r="5" fill="#333333"/>
  <circle cx="300" cy="70" r="6" fill="#b91c1c"/>
  <circle cx="350" cy="139" r="5" fill="#333333"/>
  <circle cx="520" cy="280" r="5" fill="#333333"/>
  <!-- labels -->
  <text x="80" y="308" font-family="sans-serif" font-size="14" fill="#111111" text-anchor="middle">Exposition</text>
  <text x="160" y="238" font-family="sans-serif" font-size="14" fill="#111111" text-anchor="end">Inciting incident</text>
  <text x="235" y="130" font-family="sans-serif" font-size="14" fill="#111111" text-anchor="end">Rising action</text>
  <text x="300" y="48" font-family="sans-serif" font-size="14" font-weight="bold" fill="#b91c1c" text-anchor="middle">Climax</text>
  <text x="365" y="130" font-family="sans-serif" font-size="14" fill="#111111" text-anchor="start">Falling action</text>
  <text x="520" y="308" font-family="sans-serif" font-size="14" fill="#111111" text-anchor="middle">Resolution</text>
</svg>
