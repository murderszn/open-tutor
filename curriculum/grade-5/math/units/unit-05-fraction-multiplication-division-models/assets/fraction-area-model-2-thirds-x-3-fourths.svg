<svg xmlns="http://www.w3.org/2000/svg" width="640" height="700" viewBox="0 0 640 700" role="img" aria-label="Area model showing 2/3 times 3/4 equals 6/12, which simplifies to 1/2.">
  <title>Area model: 2/3 × 3/4 = 6/12 = 1/2</title>
  <desc>A unit square divided into 3 equal columns and 4 equal rows (12 small rectangles). Two of the three columns are shaded blue (2/3 of the width) and three of the four rows are shaded amber (3/4 of the height). The overlap is 6 of the 12 small rectangles, shown green: 2/3 × 3/4 = 6/12 = 1/2.</desc>
  <rect x="20" y="20" width="600" height="600" fill="#ffffff" stroke="#333333" stroke-width="3"/>
  <!-- Horizontal shading: 3/4 of the height (top 3 of 4 rows), amber -->
  <rect x="20" y="20" width="600" height="450" fill="#fde68a" fill-opacity="0.55"/>
  <!-- Vertical shading: 2/3 of the width (left 2 of 3 columns), blue -->
  <rect x="20" y="20" width="400" height="600" fill="#93c5fd" fill-opacity="0.55"/>
  <!-- Overlap: 2/3 wide by 3/4 tall = 6 of 12 cells, green -->
  <rect x="20" y="20" width="400" height="450" fill="#86efac" fill-opacity="0.8"/>
  <!-- Grid lines: 3 columns (200 units), 4 rows (150 units) -->
  <g stroke="#333333" stroke-width="2">
    <line x1="220" y1="20" x2="220" y2="620"/>
    <line x1="420" y1="20" x2="420" y2="620"/>
    <line x1="20" y1="170" x2="620" y2="170"/>
    <line x1="20" y1="320" x2="620" y2="320"/>
    <line x1="20" y1="470" x2="620" y2="470"/>
  </g>
  <!-- Labels -->
  <text x="220" y="650" font-family="sans-serif" font-size="22" text-anchor="middle" fill="#1e3a8a">2 of 3 columns = 2/3 of the width</text>
  <text x="320" y="680" font-family="sans-serif" font-size="22" text-anchor="middle" fill="#92400e">3 of 4 rows = 3/4 of the height</text>
</svg>
