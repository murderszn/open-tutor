<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 230" role="img" aria-labelledby="t d">
<title id="t">Fraction bars showing 2 thirds equals 8 twelfths</title>
<desc id="d">Two equal-length bars. The top bar is split into 3 equal parts with 2 shaded, labelled 2/3. The bottom bar is split into 12 equal parts with 8 shaded, labelled 8/12. Both shaded lengths are equal.</desc>
<rect x="20" y="30" width="600" height="56" fill="#ffffff" stroke="#333333" stroke-width="2"/>
<rect x="20" y="30" width="400" height="56" fill="#d94f30"/>
<line x1="220" y1="30" x2="220" y2="86" stroke="#333333" stroke-width="2"/>
<line x1="420" y1="30" x2="420" y2="86" stroke="#333333" stroke-width="2"/>
<text x="20" y="115" font-family="sans-serif" font-size="22" fill="#222222">2/3 of the bar is shaded</text>
<rect x="20" y="140" width="600" height="56" fill="#ffffff" stroke="#333333" stroke-width="2"/>
<rect x="20" y="140" width="400" height="56" fill="#d94f30"/>
<g stroke="#333333" stroke-width="1.5">
<line x1="70" y1="140" x2="70" y2="196"/><line x1="120" y1="140" x2="120" y2="196"/><line x1="170" y1="140" x2="170" y2="196"/><line x1="220" y1="140" x2="220" y2="196"/><line x1="270" y1="140" x2="270" y2="196"/><line x1="320" y1="140" x2="320" y2="196"/><line x1="370" y1="140" x2="370" y2="196"/><line x1="420" y1="140" x2="420" y2="196"/><line x1="470" y1="140" x2="470" y2="196"/><line x1="520" y1="140" x2="520" y2="196"/><line x1="570" y1="140" x2="570" y2="196"/>
</g>
<text x="20" y="222" font-family="sans-serif" font-size="22" fill="#222222">8/12 of the bar is shaded — the same length</text>
</svg>
