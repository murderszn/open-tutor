<svg xmlns="http://www.w3.org/2000/svg" width="760" height="440" viewBox="0 0 760 440" role="img" aria-labelledby="title desc">
<title id="title">Three branches of government and their checks on one another</title>
<desc id="desc">Legislative branch (Congress) makes laws. Executive branch (President) carries out laws and can veto bills; Congress can override a veto with two-thirds in both houses. Judicial branch (Supreme Court) interprets laws and can declare laws unconstitutional. The Senate confirms presidential appointments, including judges. The President nominates federal judges.</desc>
<style>
  .box { fill: #ffffff; stroke: #1a1a1a; stroke-width: 2; }
  .branch { font-family: sans-serif; font-size: 17px; font-weight: bold; }
  .job { font-family: sans-serif; font-size: 14px; }
  .check { font-family: sans-serif; font-size: 13px; font-style: italic; }
  .arrow { stroke: #1a1a1a; stroke-width: 1.6; fill: none; }
</style>
<!-- Boxes -->
<rect class="box" x="30" y="30" width="300" height="110" rx="8"/>
<text class="branch" x="180" y="70" text-anchor="middle">LEGISLATIVE</text>
<text class="job" x="180" y="95" text-anchor="middle">Congress: House + Senate</text>
<text class="job" x="180" y="118" text-anchor="middle">Makes laws</text>
<rect class="box" x="430" y="30" width="300" height="110" rx="8"/>
<text class="branch" x="580" y="70" text-anchor="middle">EXECUTIVE</text>
<text class="job" x="580" y="95" text-anchor="middle">President + departments</text>
<text class="job" x="580" y="118" text-anchor="middle">Carries out laws</text>
<rect class="box" x="230" y="290" width="300" height="110" rx="8"/>
<text class="branch" x="380" y="330" text-anchor="middle">JUDICIAL</text>
<text class="job" x="380" y="355" text-anchor="middle">Supreme Court + federal courts</text>
<text class="job" x="380" y="378" text-anchor="middle">Interprets laws</text>
<!-- Arrows with check labels -->
<path class="arrow" d="M 330 85 L 430 85" marker-end="url(#ah)"/>
<text class="check" x="380" y="70" text-anchor="middle">veto</text>
<path class="arrow" d="M 430 105 L 330 105" marker-end="url(#ah)"/>
<text class="check" x="380" y="130" text-anchor="middle">override (2/3)</text>
<path class="arrow" d="M 580 140 L 470 290" marker-end="url(#ah)"/>
<text class="check" x="575" y="210" text-anchor="middle">nominates judges</text>
<path class="arrow" d="M 430 290 L 540 140" marker-end="url(#ah)"/>
<text class="check" x="545" y="250" text-anchor="middle">rules actions</text>
<text class="check" x="545" y="268" text-anchor="middle">unconstitutional</text>
<path class="arrow" d="M 300 290 L 200 140" marker-end="url(#ah)"/>
<text class="check" x="195" y="210" text-anchor="middle">declares laws</text>
<text class="check" x="195" y="228" text-anchor="middle">unconstitutional</text>
<path class="arrow" d="M 230 140 L 300 290" marker-end="url(#ah)"/>
<text class="check" x="215" y="250" text-anchor="middle">Senate confirms</text>
<text class="check" x="215" y="268" text-anchor="middle">appointments</text>
<defs>
<marker id="ah" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
<path d="M0,0 L0,6 L9,3 z" fill="#1a1a1a"/>
</marker>
</defs>
</svg>
