<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="340" viewBox="0 0 1000 340" role="img" aria-labelledby="title desc">
  <title id="title">Early republic timeline, 1800–1850</title>
  <desc id="desc">Timeline from 1800 to 1850: Louisiana Purchase 1803, Lewis and Clark 1804–06, Battle of Tippecanoe 1811, Erie Canal built 1817–25, Missouri Compromise 1820, Cherokee Phoenix first published 1828, Indian Removal Act 1830, Worcester v. Georgia 1832, Treaty of New Echota 1835, Cherokee removal 1838–39, Texas annexed 1845, California becomes a state 1850. Spacing is not to scale.</desc>
  <rect x="0" y="0" width="1000" height="340" fill="#ffffff"/>
  <text x="500" y="34" font-family="sans-serif" font-size="22" font-weight="bold" text-anchor="middle" fill="#1a1a1a">The Early Republic, 1800–1850</text>
  <text x="500" y="58" font-family="sans-serif" font-size="13" text-anchor="middle" fill="#555555">Spacing is not to scale. Dates are the anchor — read across, then ask what caused what.</text>
  <line x1="40" y1="170" x2="960" y2="170" stroke="#1a1a1a" stroke-width="3"/>
  <polygon points="960,170 944,162 944,178" fill="#1a1a1a"/>
  <g font-family="sans-serif" font-size="13" fill="#1a1a1a">
    <!-- upper events -->
    <g>
      <line x1="90" y1="170" x2="90" y2="120" stroke="#1a1a1a" stroke-width="2"/>
      <circle cx="90" cy="170" r="5" fill="#b3001b"/>
      <text x="90" y="108" text-anchor="middle" font-weight="bold">1803</text>
      <text x="90" y="90" text-anchor="middle">Louisiana</text>
      <text x="90" y="74" text-anchor="middle">Purchase</text>
    </g>
    <g>
      <line x1="250" y1="170" x2="250" y2="120" stroke="#1a1a1a" stroke-width="2"/>
      <circle cx="250" cy="170" r="5" fill="#1a1a1a"/>
      <text x="250" y="108" text-anchor="middle" font-weight="bold">1811</text>
      <text x="250" y="90" text-anchor="middle">Battle of</text>
      <text x="250" y="74" text-anchor="middle">Tippecanoe</text>
    </g>
    <g>
      <line x1="410" y1="170" x2="410" y2="120" stroke="#1a1a1a" stroke-width="2"/>
      <circle cx="410" cy="170" r="5" fill="#1a1a1a"/>
      <text x="410" y="108" text-anchor="middle" font-weight="bold">1820</text>
      <text x="410" y="90" text-anchor="middle">Missouri</text>
      <text x="410" y="74" text-anchor="middle">Compromise</text>
    </g>
    <g>
      <line x1="570" y1="170" x2="570" y2="120" stroke="#1a1a1a" stroke-width="2"/>
      <circle cx="570" cy="170" r="5" fill="#b3001b"/>
      <text x="570" y="108" text-anchor="middle" font-weight="bold">1830</text>
      <text x="570" y="90" text-anchor="middle">Indian Removal</text>
      <text x="570" y="74" text-anchor="middle">Act</text>
    </g>
    <g>
      <line x1="700" y1="170" x2="700" y2="120" stroke="#1a1a1a" stroke-width="2"/>
      <circle cx="700" cy="170" r="5" fill="#1a1a1a"/>
      <text x="700" y="108" text-anchor="middle" font-weight="bold">1835</text>
      <text x="700" y="90" text-anchor="middle">Treaty of</text>
      <text x="700" y="74" text-anchor="middle">New Echota</text>
    </g>
    <g>
      <line x1="880" y1="170" x2="880" y2="120" stroke="#1a1a1a" stroke-width="2"/>
      <circle cx="880" cy="170" r="5" fill="#1a1a1a"/>
      <text x="880" y="108" text-anchor="middle" font-weight="bold">1845</text>
      <text x="880" y="90" text-anchor="middle">Texas</text>
      <text x="880" y="74" text-anchor="middle">annexed</text>
    </g>
    <!-- lower events -->
    <g>
      <line x1="170" y1="170" x2="170" y2="220" stroke="#1a1a1a" stroke-width="2"/>
      <circle cx="170" cy="170" r="5" fill="#1a1a1a"/>
      <text x="170" y="238" text-anchor="middle" font-weight="bold">1804–06</text>
      <text x="170" y="256" text-anchor="middle">Lewis and Clark</text>
    </g>
    <g>
      <line x1="330" y1="170" x2="330" y2="220" stroke="#1a1a1a" stroke-width="2"/>
      <circle cx="330" cy="170" r="5" fill="#1a1a1a"/>
      <text x="330" y="238" text-anchor="middle" font-weight="bold">1817–25</text>
      <text x="330" y="256" text-anchor="middle">Erie Canal built</text>
    </g>
    <g>
      <line x1="490" y1="170" x2="490" y2="220" stroke="#1a1a1a" stroke-width="2"/>
      <circle cx="490" cy="170" r="5" fill="#1a1a1a"/>
      <text x="490" y="238" text-anchor="middle" font-weight="bold">1828</text>
      <text x="490" y="256" text-anchor="middle">Cherokee Phoenix</text>
      <text x="490" y="274" text-anchor="middle">first published</text>
    </g>
    <g>
      <line x1="630" y1="170" x2="630" y2="220" stroke="#1a1a1a" stroke-width="2"/>
      <circle cx="630" cy="170" r="5" fill="#b3001b"/>
      <text x="630" y="238" text-anchor="middle" font-weight="bold">1832</text>
      <text x="630" y="256" text-anchor="middle">Worcester</text>
      <text x="630" y="274" text-anchor="middle">v. Georgia</text>
    </g>
    <g>
      <line x1="780" y1="170" x2="780" y2="220" stroke="#1a1a1a" stroke-width="2"/>
      <circle cx="780" cy="170" r="5" fill="#b3001b"/>
      <text x="780" y="238" text-anchor="middle" font-weight="bold">1838–39</text>
      <text x="780" y="256" text-anchor="middle">Cherokee removal</text>
      <text x="780" y="274" text-anchor="middle">(Trail of Tears)</text>
    </g>
    <g>
      <line x1="940" y1="170" x2="940" y2="220" stroke="#1a1a1a" stroke-width="2"/>
      <circle cx="940" cy="170" r="5" fill="#1a1a1a"/>
      <text x="940" y="238" text-anchor="middle" font-weight="bold">1850</text>
      <text x="940" y="256" text-anchor="middle">California</text>
      <text x="940" y="274" text-anchor="middle">becomes a state</text>
    </g>
  </g>
  <text x="500" y="322" font-family="sans-serif" font-size="13" text-anchor="middle" fill="#555555">Red dots mark the removal story: the Act, the court case, and the forced march. Ask: what connects them?</text>
</svg>
