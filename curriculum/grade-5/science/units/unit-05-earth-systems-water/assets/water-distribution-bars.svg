<svg xmlns="http://www.w3.org/2000/svg" width="700" height="360" viewBox="0 0 700 360" role="img" aria-labelledby="title desc">
  <title id="title">Where Earth's water is — parts out of 100</title>
  <desc id="desc">Two bar charts. All Earth's water: ocean salt water 97 parts, fresh water 3 parts. Fresh water only: frozen in glaciers and ice caps 69 parts, underground ground water 30 parts, lakes rivers and other surface water 1 part. Values rounded from USGS Water Science School figures.</desc>
  <rect x="0" y="0" width="700" height="360" fill="#ffffff"/>
  <text x="20" y="28" font-family="sans-serif" font-size="17" font-weight="bold" fill="#111111">Where Earth's water is (parts out of 100)</text>

  <text x="20" y="58" font-family="sans-serif" font-size="14" font-weight="bold" fill="#111111">All Earth's water</text>
  <text x="20" y="88" font-family="sans-serif" font-size="13" fill="#111111">Ocean (salt water)</text>
  <rect x="20" y="94" width="582" height="22" fill="#2563eb"/>
  <text x="608" y="110" font-family="sans-serif" font-size="13" font-weight="bold" fill="#111111">97</text>
  <text x="20" y="136" font-family="sans-serif" font-size="13" fill="#111111">Fresh water</text>
  <rect x="20" y="142" width="18" height="22" fill="#0ea5e9"/>
  <text x="44" y="158" font-family="sans-serif" font-size="13" font-weight="bold" fill="#111111">3</text>

  <text x="20" y="198" font-family="sans-serif" font-size="14" font-weight="bold" fill="#111111">Fresh water only</text>
  <text x="20" y="228" font-family="sans-serif" font-size="13" fill="#111111">Frozen in glaciers and ice caps</text>
  <rect x="20" y="234" width="414" height="22" fill="#7dd3fc"/>
  <text x="440" y="250" font-family="sans-serif" font-size="13" font-weight="bold" fill="#111111">69</text>
  <text x="20" y="276" font-family="sans-serif" font-size="13" fill="#111111">Underground (ground water)</text>
  <rect x="20" y="282" width="180" height="22" fill="#92400e"/>
  <text x="206" y="298" font-family="sans-serif" font-size="13" font-weight="bold" fill="#111111">30</text>
  <text x="20" y="324" font-family="sans-serif" font-size="13" fill="#111111">Lakes, rivers, other surface water</text>
  <rect x="20" y="330" width="6" height="22" fill="#16a34a"/>
  <text x="32" y="346" font-family="sans-serif" font-size="13" font-weight="bold" fill="#111111">1</text>
</svg>
